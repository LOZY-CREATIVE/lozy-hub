<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lozy Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4E1A1D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lozy">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650&display=swap" rel="stylesheet">
<style>
:root{
  /* fundo: escuro suave, sem preto */
  --bg:#d4d4d4;--chrome:#cdcdcd;--bline:#adadad;--acc:#161616;--accT:#f5f5f5;
  /* superfícies claras (paleta aprovada do dashboard) */
  --s1:#cfcfcf;--s2:#c2c2c2;--s3:#b5b5b5;
  --b1:#b6b6b6;--b2:#a8a8a8;--b3:#8f8f8f;
  /* texto sobre superfícies claras */
  --t1:#161616;--t2:#454545;--t3:#6e6e6e;
  /* texto sobre o fundo escuro */
  --lx1:#161616;--lx2:#454545;--lx3:#6e6e6e;
  /* aliases legados (widgets claros) */
  --lt:#cfcfcf;--lt2:#c2c2c2;--ltb:#b0b0b0;--dk1:#161616;--dk2:#454545;--dk3:#6e6e6e;
  --green:#16a34a;--red:#dc2626;--amber:#d97706;--blue:#2563eb;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--lx1);font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;}
button,input,select,textarea{font-family:inherit;letter-spacing:inherit;font-size:inherit;}
#app{display:flex;min-height:100vh;}
/* SIDEBAR */
#sidebar{width:64px;flex-shrink:0;border-right:1px solid var(--bline);display:flex;flex-direction:column;padding:14px 10px;gap:2px;position:sticky;top:0;height:100vh;background:var(--chrome);z-index:20;transition:width .18s ease;overflow-y:auto;overflow-x:hidden;}
#sidebar.exp{width:216px;}
.sb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-shrink:0;}
#sidebar:not(.exp) .sb-head{flex-direction:column;gap:8px;}
.sb-tgl{width:24px;height:24px;border-radius:7px;border:1px solid var(--bline);background:transparent;color:var(--lx3);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .13s;flex-shrink:0;}
.sb-tgl:hover{color:var(--lx1);}
.nav-grp{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--lx3);margin:14px 8px 6px;font-weight:600;white-space:nowrap;}
.nav-sep{height:12px;}
.nlbl{font-size:12.5px;font-weight:500;white-space:nowrap;}
.soon{font-style:normal;font-size:8.5px;border:1px solid var(--bline);border-radius:999px;padding:1px 6px;color:var(--lx3);margin-left:4px;vertical-align:1px;}
.logo{width:32px;height:32px;border-radius:9px;background:var(--acc);color:var(--accT);display:flex;align-items:center;justify-content:center;font-weight:650;font-size:14px;margin-bottom:16px;flex-shrink:0;}
.snav{width:100%;height:34px;border-radius:9px;border:none;background:transparent;color:var(--lx3);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;position:relative;transition:all .13s;flex-shrink:0;}
#sidebar.exp .snav{justify-content:flex-start;padding:0 10px;}
.snav svg{width:16px;height:16px;}
.snav:hover{background:rgba(0,0,0,.06);color:var(--lx2);}
.snav.active{background:rgba(0,0,0,.1);color:var(--lx1);}
.snav .tip{position:absolute;left:46px;top:50%;transform:translateY(-50%);background:#efefef;border:1px solid #a6a6a6;padding:5px 10px;border-radius:7px;font-size:11.5px;color:#161616;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.15);}
.snav:hover .tip{opacity:1;}
.snav-spacer{flex:1;}
.avatar{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.06);border:1px solid var(--bline);color:var(--lx2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;}
/* TOPBAR */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;justify-content:flex-end;padding:0 26px;height:50px;border-bottom:1px solid var(--bline);position:sticky;top:0;background:rgba(212,212,212,.9);backdrop-filter:blur(14px);z-index:10;}
.tb-r{display:flex;align-items:center;gap:8px;}
.badge-ver{font-size:11px;color:var(--lx3);border:1px solid var(--bline);border-radius:999px;padding:3px 9px;}
/* BUTTONS */
.btn{background:var(--acc);color:var(--accT);border:none;border-radius:999px;padding:7px 15px;font-size:12.5px;font-weight:550;cursor:pointer;transition:opacity .15s;white-space:nowrap;}
.btn:hover{opacity:.85;}
.btn-ghost{background:transparent;color:var(--lx2);border:1px solid #9a9a9a;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:500;cursor:pointer;transition:all .13s;white-space:nowrap;}
.btn-ghost:hover{color:var(--lx1);border-color:#7a7a7a;}
.btn-sm{background:transparent;color:var(--t2);border:1px solid #9a9a9a;border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:500;cursor:pointer;transition:all .13s;}
.btn-sm:hover{color:var(--t1);border-color:#7a7a7a;}
.ibtn{width:22px;height:22px;border-radius:6px;border:1px solid #9a9a9a;background:transparent;color:var(--t3);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0;}
.ibtn:hover{color:var(--t1);background:rgba(0,0,0,.07);}
.ibtn.del:hover{color:var(--red);}
/* CONTENT */
#content{padding:26px 26px 90px;flex:1;}
.page-hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
.page-title{font-size:19px;font-weight:600;letter-spacing:-0.02em;color:var(--lx1);}
.page-sub{font-size:12px;color:var(--lx3);margin-top:3px;}
/* TABS — pill clara com ativo invertido */
.tabs{display:flex;gap:4px;border:1px solid var(--ltb);border-radius:12px;padding:4px;background:var(--s1);margin-bottom:18px;overflow-x:auto;width:max-content;max-width:100%;}
.tab{border:none;background:transparent;color:var(--t3);font-size:12px;font-weight:500;padding:6px 13px;border-radius:8px;cursor:pointer;transition:all .13s;white-space:nowrap;}
.tab:hover{color:var(--t1);}
.tab.active{background:var(--acc);color:var(--accT);}
/* TOOLBAR */
.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search{flex:1;min-width:180px;background:var(--s1);border:1px solid var(--ltb);border-radius:9px;padding:8px 12px;color:var(--t1);font-size:12.5px;}
.search::placeholder{color:var(--t3);}
.search:focus{outline:none;border-color:var(--b3);}
.fsel{background:var(--s1);border:1px solid var(--ltb);border-radius:9px;padding:8px 10px;color:var(--t2);font-size:12px;cursor:pointer;}
.fsel:focus{outline:none;border-color:var(--b3);}
/* CARDS — todos claros agora */
.card{background:var(--s1);border:1px solid var(--ltb);border-radius:var(--r);padding:20px;color:var(--t1);transition:border-color .2s;}
.card:hover{border-color:var(--b3);}
.wl{background:var(--lt);border:1px solid var(--ltb);border-radius:var(--r);padding:20px;color:var(--dk1);}
.wl .clabel{color:var(--dk3);}
.wl .metric{color:var(--dk1);}
.wl .metric-s{color:var(--dk2);}
.wl .widget-ttl{color:var(--dk1);}
.wl .widget-more{color:var(--dk3);}
.wl .empty-msg{color:var(--dk3);}
.clabel{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-bottom:9px;}
.metric{font-size:22px;font-weight:600;letter-spacing:-0.025em;}
.metric-s{font-size:12px;color:var(--t3);margin-top:4px;}
.widget-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;}
.widget-ttl{font-size:12.5px;font-weight:550;}
.widget-more{font-size:11.5px;color:var(--t3);}
.empty-msg{font-size:12px;color:var(--t3);padding:8px 0;}
/* DASH GRID (widgets) */
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;}
.dw-1{grid-column:span 1;}
.dw-2{grid-column:span 2;}
@media(max-width:520px){.dw-2{grid-column:span 1;}}
/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;}
.g-mc{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-bottom:12px;}
.eyebrow{font-size:11px;color:var(--lx3);text-transform:capitalize;margin-bottom:5px;}
.greeting{font-size:22px;font-weight:600;letter-spacing:-0.025em;margin-bottom:24px;color:var(--lx1);}
/* WEEK CAL */
.wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.wk-cell{border-radius:10px;padding:8px 4px;text-align:center;background:var(--lt2);}
.wk-dow{font-size:9px;color:var(--dk3);text-transform:uppercase;font-weight:550;letter-spacing:.05em;}
.wk-num{font-size:14px;font-weight:600;color:var(--dk1);margin-top:2px;}
.wk-cell.today{background:var(--acc);}
.wk-cell.today .wk-dow{color:#9a9a9a;}
.wk-cell.today .wk-num{color:var(--accT);}
.wk-dot{width:4px;height:4px;border-radius:50%;background:var(--dk2);margin:3px auto 0;visibility:hidden;}
.wk-cell.has .wk-dot{visibility:visible;}
.wk-cell.today .wk-dot{background:#bbb;}
/* CHART */
.chart-bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px;}
.cb-group{flex:1;display:flex;align-items:flex-end;gap:3px;height:100%;}
.cb{flex:1;border-radius:4px 4px 2px 2px;min-height:2px;}
.cb.rec{background:var(--dk1);}
.cb.desp{background:#7a7a7a;}
.chart-lbls{display:flex;gap:10px;margin-top:8px;}
.chart-lbls span{flex:1;text-align:center;font-size:10px;color:var(--dk3);text-transform:uppercase;}
.chart-leg{display:flex;gap:14px;margin-top:10px;}
.chart-leg .lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dk2);}
.chart-leg i{width:10px;height:10px;border-radius:3px;display:inline-block;}
/* ROWS / TABLES */
.row-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ltb);}
.row-item:last-child{border-bottom:none;}
.ri-name{font-size:12.5px;font-weight:500;}
.ri-sub{font-size:11.5px;color:var(--t3);margin-top:1px;}
.ri-val{font-size:12.5px;font-weight:550;flex-shrink:0;margin-left:12px;}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tbl-wrap::-webkit-scrollbar{height:5px;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:10.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;padding:0 10px 10px 0;text-align:left;border-bottom:1px solid var(--b1);}
.tbl td{padding:11px 10px 11px 0;border-bottom:1px solid var(--b1);vertical-align:middle;font-size:12.5px;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:rgba(0,0,0,.035);}
.tacts{display:flex;gap:4px;opacity:0;transition:opacity .13s;}
tr:hover .tacts{opacity:1;}
/* BADGES / DOTS */
.bdg{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid #a2a2a2;color:#555;font-weight:500;white-space:nowrap;}
.bdg.quente{color:var(--red);}.bdg.morno{color:var(--amber);}.bdg.frio{color:var(--blue);}
.bdg.alta{color:var(--red);}.bdg.media{color:var(--amber);}.bdg.baixa{color:var(--blue);}
.sdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;flex-shrink:0;}
.s-gray{background:#8a8a8a;}.s-amber{background:var(--amber);}.s-green{background:var(--green);}.s-red{background:var(--red);}.s-blue{background:var(--blue);}
/* KANBAN — cards claros sobre fundo */
#board,.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:14px;}
.col{min-width:232px;max-width:232px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;}
.col-hd{display:flex;justify-content:space-between;align-items:center;padding:0 2px;}
.col-name{font-size:12px;font-weight:550;color:var(--lx2);}
.col-stat{font-size:11px;color:var(--lx3);}
.col-body{display:flex;flex-direction:column;gap:8px;min-height:40px;}
.kcard{background:var(--s1);border:1px solid var(--ltb);border-radius:12px;padding:13px 14px;color:var(--t1);transition:border-color .15s;}
.kcard:hover{border-color:var(--b3);}
.kc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:2px;}
.kc-name{font-size:12.5px;font-weight:550;}
.kc-sub{font-size:11.5px;color:var(--t3);margin-bottom:10px;}
.kc-ft{display:flex;justify-content:space-between;align-items:center;}
.kc-val{font-size:12.5px;font-weight:550;}
.kc-acts{display:flex;gap:4px;opacity:0;transition:opacity .13s;}
.kcard:hover .kc-acts{opacity:1;}
.col-empty{border:1px dashed #a0a0a0;border-radius:10px;padding:16px 10px;text-align:center;font-size:11px;color:var(--lx3);}
/* MEU DIA */
.day-lbl{font-size:10.5px;color:var(--dk3);text-transform:uppercase;letter-spacing:.08em;font-weight:550;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--ltb);}
.task-input-wrap{display:flex;gap:8px;margin-bottom:10px;}
.task-input{flex:1;background:rgba(255,255,255,.55);border:1px solid var(--ltb);border-radius:8px;padding:8px 11px;color:var(--dk1);font-size:12.5px;}
.task-input::placeholder{color:var(--dk3);}
.task-input:focus{outline:none;border-color:var(--dk3);}
.task-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--ltb);}
.task-item:last-child{border-bottom:none;}
.tk-check{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--dk3);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .13s;}
.tk-check.done{background:var(--acc);border-color:var(--acc);}
.tk-check.done::after{content:'✓';font-size:9px;color:var(--accT);font-weight:700;}
.tk-text{flex:1;font-size:12.5px;color:var(--dk1);}
.tk-text.done{color:var(--dk3);text-decoration:line-through;}
.tk-del{width:20px;height:20px;border:none;background:transparent;color:var(--dk3);cursor:pointer;font-size:12px;opacity:0;transition:opacity .13s;}
.task-item:hover .tk-del{opacity:1;}
.tk-del:hover{color:#b91c1c;}
.dem-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--ltb);}
.dem-item:last-child{border-bottom:none;}
.dem-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.dem-dot.atrasada{background:#dc2626;}
.dem-dot.hoje{background:#d97706;}
.dem-body{flex:1;min-width:0;}
.dem-name{font-size:12.5px;font-weight:500;color:var(--dk1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dem-meta{font-size:11.5px;color:var(--dk3);}
.dem-prazo{font-size:11px;flex-shrink:0;margin-left:8px;font-weight:550;}
.dem-prazo.atrasada{color:#dc2626;}
.dem-prazo.hoje{color:#d97706;}
/* GROUP VIEW */
.grp{margin-bottom:18px;}
.grp-hd{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid #a0a0a0;margin-bottom:4px;}
.grp-name{font-size:12.5px;font-weight:600;color:var(--lx1);}
.grp-stat{font-size:11px;color:var(--lx3);}
/* AGENDA */
.ag-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.ag-day{background:var(--s1);border:1px solid var(--ltb);border-radius:12px;min-height:150px;padding:10px;color:var(--t1);}
.ag-day.today{border-color:var(--acc);border-width:1.5px;}
.ag-dhd{font-size:10px;color:var(--t3);text-transform:uppercase;font-weight:550;}
.ag-dnum{font-size:15px;font-weight:600;margin:1px 0 8px;}
.ag-ev{background:var(--s2);border:1px solid var(--b2);border-radius:7px;padding:6px 8px;margin-bottom:5px;font-size:11px;cursor:default;}
.ag-ev .t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ag-ev .h{color:var(--t3);font-size:10px;margin-top:1px;}
.ag-ev a{color:var(--t3);text-decoration:none;font-size:10px;}
.ag-ev a:hover{color:var(--t1);}
.ev-reuniao{border-left:2px solid var(--blue);}
.ev-gravacao{border-left:2px solid var(--red);}
.ev-edicao{border-left:2px solid var(--amber);}
.ev-entrega{border-left:2px solid var(--green);}
.ev-outro{border-left:2px solid #8a8a8a;}
.ev-prazo{border-left:2px solid #9333ea;}
/* WIZARD */
.wiz-steps{display:flex;align-items:center;gap:6px;margin-bottom:22px;flex-wrap:wrap;}
.wstep{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--lx3);padding:5px 12px;border-radius:999px;border:1px solid #9a9a9a;}
.wstep.done{color:#15803d;border-color:#8fbf9f;}
.wstep.cur{color:var(--lx1);border-color:#8a8a8a;background:rgba(0,0,0,.05);}
.wstep .n{width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;font-size:9.5px;}
.wiz-body{max-width:640px;}
.wiz-nav{display:flex;justify-content:space-between;margin-top:22px;max-width:640px;}
.entrega-row{display:grid;grid-template-columns:1fr 64px 100px 30px;gap:8px;margin-bottom:8px;align-items:center;}
.preset-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.ppill{font-size:10.5px;padding:4px 10px;border-radius:999px;border:1px solid #9a9a9a;background:transparent;color:var(--t2);cursor:pointer;transition:all .12s;}
.ppill:hover{color:var(--t1);border-color:#7a7a7a;background:rgba(0,0,0,.05);}
.inv-box{background:var(--s2);border:1px solid var(--b2);border-radius:12px;padding:16px;margin-top:14px;}
.inv-line{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;color:var(--t2);}
.inv-line.total{border-top:1px solid var(--b3);margin-top:6px;padding-top:10px;font-weight:600;color:var(--t1);font-size:14px;}
/* MODAL */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
#overlay.show{display:flex;}
#modal{background:var(--s1);border:1px solid var(--b2);border-radius:16px;width:100%;max-width:400px;padding:24px;max-height:88vh;overflow-y:auto;color:var(--t1);}
#modal.wide{max-width:760px;}
#modal h2{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--t1);}
.field{margin-bottom:12px;}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field label{display:block;font-size:11px;color:var(--t3);margin-bottom:5px;font-weight:500;}
.field input,.field select,.field textarea{width:100%;background:rgba(255,255,255,.55);border:1px solid var(--b2);border-radius:8px;padding:9px 11px;color:var(--t1);font-size:13px;transition:border-color .13s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--t3);}
.field input::placeholder,.field textarea::placeholder{color:var(--t3);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
/* PLACEHOLDER */
.ph-wrap{max-width:420px;padding:30px 0;}
.ph-tag{display:inline-block;font-size:10.5px;color:var(--lx2);border:1px solid #9a9a9a;border-radius:999px;padding:3px 10px;margin-bottom:14px;font-weight:500;}
.ph-wrap h3{font-size:16px;font-weight:600;margin-bottom:6px;color:var(--lx1);}
.ph-wrap p{font-size:12.5px;color:var(--lx2);line-height:1.65;}

/* ═══ STORAGE — adaptador ═══
   window.storage existe dentro do claude.ai; hospedado (GitHub Pages,
   arquivo local, app instalado) cai para localStorage. Mesma interface. */
const Store={
  async get(k){
    if(typeof window!=='undefined'&&window.storage)return window.storage.get(k,false);
    const v=localStorage.getItem(k);return v?{key:k,value:v}:null;
  },
  async set(k,v){
    if(typeof window!=='undefined'&&window.storage)return window.storage.set(k,v,false);
    localStorage.setItem(k,v);return{key:k,value:v};
  }
};

/* ═══ STORAGE ═══ */
const KEYS=['leads','contatos','followups','demandas','tasks','projetos','fin','eventos','propostas','theme','cbase','prefs','dash','sort','parc','assin','cols'];
async function load(){
  let got=false;
  try{
    const r=await Store.get('lozy-hub-v2');
    if(r&&r.value){const d=JSON.parse(r.value);KEYS.forEach(k=>{if(d[k])S[k]=d[k];});got=true;}
  }catch(e){}
  if(!got){ /* migração da v0.3 */
    for(const k of ['leads','demandas','tasks']){
      try{const r=await Store.get('lozy-'+k);if(r&&r.value)S[k]=JSON.parse(r.value);}catch(e){}
    }
    S.tasks=S.tasks.map(t=>t.titulo?t:{id:t.id,titulo:t.text,prioridade:'Média',status:t.done?'Concluída':'A fazer',prazo:null});
    S.demandas=S.demandas.map((d,i)=>({uid:d.uid||('DEM-'+String(i+1).padStart(3,'0')),maeId:d.maeId||null,custo:d.custo||0,receita:d.receita||0,horas:d.horas||0,...d}));
  }
  /* carga migrada do Notion: aplica sempre que o estado estiver vazio, mesmo se houver um save antigo em branco */
  if(!S.demandas.length&&!S.fin.length)applySeed(false);
  else if(!S.parc.length||!S.assin.length){S.parc=SEED3.parc.map(p=>({...p}));S.assin=SEED3.assin.map(a=>({...a}));linkAssinaturas();save();}
  if(!S.tasks.some(t=>String(t.id).startsWith('nt'))||!S.cbase.length){S.tasks=[...SEED2.tasks.map(t=>({...t})),...S.tasks.filter(t=>!String(t.id).startsWith('nt'))];S.cbase=[...SEED2.cbase.map(c=>({...c})),...S.cbase.filter(c=>!String(c.id).startsWith('nc'))];save();}
  applyTheme();
  render();
}
function applySeed(reset){
  if(reset){S.demandas=[];S.fin=[];S.projetos=[];}
  S.demandas=[...SEED.demandas.map(d=>({...d})),...S.demandas.filter(d=>!String(d.id).startsWith('nd'))];
  S.tasks=[...SEED2.tasks.map(t=>({...t})),...S.tasks.filter(t=>!String(t.id).startsWith('nt'))];
  S.cbase=[...SEED2.cbase.map(c=>({...c})),...S.cbase.filter(c=>!String(c.id).startsWith('nc'))];
  S.fin=[...SEED.fin.map(f=>({...f})),...S.fin.filter(f=>!String(f.id).startsWith('nr')&&!String(f.id).startsWith('ne'))];
  SEED.projetos.forEach(p=>{if(!S.projetos.some(x=>x.id===p.id))S.projetos.push({...p});});
  S.parc=[...SEED3.parc.map(p=>({...p})),...S.parc.filter(p=>!String(p.id).startsWith('np_'))];
  S.assin=[...SEED3.assin.map(a=>({...a})),...S.assin.filter(a=>!String(a.id).startsWith('na'))];
  linkAssinaturas();
  save();
}
const ASSIN_ALIAS={'Adobe (?)':'Adobe','Higgsfield (?)':'Higgsfield AI','Apple Icloud':'Apple Icloud','Assinaturas MAIO 26':null,'Ocular Sounds - SFX':null};
function linkAssinaturas(){
  S.fin.forEach(f=>{
    if(f.tipo!=='despesa')return;
    const alvo=ASSIN_ALIAS.hasOwnProperty(f.desc)?ASSIN_ALIAS[f.desc]:f.desc;
    const a=alvo&&S.assin.find(x=>x.nome===alvo);
    if(a){f.assinId=a.id;f.mecanismo='Assinatura';}
    else if(f.mecanismo==='Assinatura'&&!f.grupoId){f.mecanismo='À vista';delete f.assinId;}
  });
}
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    const d={};KEYS.forEach(k=>d[k]=S[k]);
    try{await Store.set('lozy-hub-v2',JSON.stringify(d));}catch(e){console.error(e);}
  },250);
}

/* ═══ HELPERS ═══ */
const fmtBRL=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const fmtBRL2=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sum=(a,f)=>a.reduce((x,y)=>x+Number(f?f(y):y.valor||0),0);
const uid=p=>p+Date.now()+Math.floor(Math.random()*99);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtD=s=>s?new Date(s+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}):'—';
function prazoStatus(prazo){
  if(!prazo)return null;
  const h=new Date();h.setHours(0,0,0,0);
  const p=new Date(prazo+'T00:00:00');
  const diff=Math.round((p-h)/864e5);
  if(diff<0)return{label:'Atrasada '+Math.abs(diff)+'d',cls:'atrasada',diff};
  if(diff===0)return{label:'Hoje',cls:'hoje',diff};
  return{label:'Em '+diff+'d',cls:'ok',diff};
}
function monthKey(s){return s?s.slice(0,7):null;}
function addM(ds,n){const d=new Date(ds+'T00:00:00');const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function mesRef(l){ /* lógica Central Lozy: cartão de crédito + dia de fechamento */
  if(l.tipo!=='despesa'||l.forma!=='Crédito')return monthKey(l.data);
  const c=CONTAS.find(c=>c.nome===l.conta);
  if(!c||!c.fech)return monthKey(l.data);
  const d=new Date(l.data+'T00:00:00');
  if(d.getDate()>c.fech)d.setMonth(d.getMonth()+1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
const liq=r=>Number(r.valor||0)*(1-Number(r.aliquota||0)/100);
function clientes(){ /* base derivada: todos os nomes de cliente do sistema */
  const s=new Set();
  S.leads.filter(l=>l.stage==='Fechado').forEach(l=>s.add(l.empresa));
  S.demandas.forEach(d=>d.cliente&&s.add(d.cliente));
  S.projetos.forEach(p=>p.cliente&&s.add(p.cliente));
  S.fin.forEach(f=>f.cliente&&s.add(f.cliente));
  return[...s].filter(Boolean).sort();
}
function greeting(){const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';}

const NAVGROUPS=[{l:'Operação',ids:['dashboard','comercial','clientes','demandas','tarefas','projetos','agenda','financeiro']},{l:'Ferramentas',ids:['propostas','contratos','central','ajustes']}];
function buildNav(){
  const exp=!S.prefs||S.prefs.sb!==0;
  const sb=document.getElementById('sidebar');
  sb.classList.toggle('exp',exp);
  const tg=document.getElementById('sb-tgl');if(tg)tg.textContent=exp?'«':'»';
  document.getElementById('snavlist').innerHTML=NAVGROUPS.map(g=>
    (exp?'<div class="nav-grp">'+g.l+'</div>':'<div class="nav-sep"></div>')+
    g.ids.map(id=>{const s=SECTIONS.find(x=>x.id===id);
      return '<button class="snav '+(S.active===id?'active':'')+'" onclick="goTo(\''+id+'\')">'+IC[id]+
        (exp?'<span class="nlbl">'+s.label+(!s.ready?'<i class="soon">em breve</i>':'')+'</span>'
            :'<span class="tip">'+s.label+(!s.ready?' · em breve':'')+'</span>')+'</button>';
    }).join('')).join('');
  const mob=['dashboard','demandas','financeiro','agenda'];
  const outras=SECTIONS.filter(x=>!mob.includes(x.id));
  const ativoFora=outras.some(x=>x.id===S.active);
  document.getElementById('bottomnav').innerHTML=mob.map(id=>{
    const s=SECTIONS.find(x=>x.id===id);
    return '<button class="bn '+(S.active===id?'active':'')+'" onclick="goTo(\''+id+'\')">'+IC[id]+'<span>'+s.label.split(' ')[0]+'</span></button>';
  }).join('')+
  '<button class="bn '+(ativoFora?'active':'')+'" onclick="openMaisMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg><span>Mais</span></button>';
}
function openMaisMenu(){
  const body='<div class="mais-grid">'+SECTIONS.map(x=>
    '<button class="mais-item '+(S.active===x.id?'sel':'')+'" onclick="closeModal();goTo(\''+x.id+'\')">'+
    '<span class="mais-ic">'+IC[x.id]+'</span><span class="mais-lb">'+x.label+(!x.ready?' <i class="soon">em breve</i>':'')+'</span></button>').join('')+'</div>';
  openModal('Ir para',body,null,true);
}
function sbToggle(){S.prefs=S.prefs||{};S.prefs.sb=(S.prefs.sb===0?1:0);save();buildNav();}

}

    {k:'criada',l:'Criada em',def:0,get:r=>r.criada||'',cell:r=>`<span style="color:var(--t2);font-size:12px">${fmtD(r.criada)}</span>`},
    {k:'validade',l:'Validade',def:1,get:r=>r.validade||'',cell:r=>`<span style="color:var(--t2);font-size:12px">${fmtD(r.validade)}</span>`},
    {k:'status',l:'Status',def:1,get:r=>r.status||'',cell:r=>{const c={Rascunho:'s-gray',Enviada:'s-amber',Aprovada:'s-green',Recusada:'s-red'}[r.status]||'s-gray';return `<span class="sdot ${c}"></span><button class="btn-sm" onclick="cycleProp('${r.id}')">${r.status}</button>`;}}
  ]},
  tarefas:{nome:'Tarefas',cols:[
    {k:'titulo',l:'Tarefa',def:1,get:r=>r.titulo||'',cell:r=>`<span style="font-weight:500">${esc(r.titulo)}</span>`},
    {k:'status',l:'Status',def:1,get:r=>TSTATUS.indexOf(r.status),cell:r=>{const cor=TCOLORS[r.status]||'#6e6e6e';return `<span class="col-pill" style="background:${hexA(cor,0.14)};color:${cor};font-size:10.5px">${r.status}</span>`;}},
    {k:'prioridade',l:'Prioridade',def:1,get:r=>TPRIOR.indexOf(r.prioridade),cell:r=>`<span class="bdg ${r.prioridade==='Alta'?'alta':r.prioridade==='Média'?'media':'baixa'}">${r.prioridade}</span>`},
    {k:'area',l:'Área',def:1,get:r=>r.area||'',cell:r=>`<span style="color:var(--t2)">${esc(r.area)||'—'}</span>`},
    {k:'cliente',l:'Cliente',def:0,get:r=>r.cliente||'',cell:r=>`<span style="color:var(--t2)">${esc(r.cliente)||'—'}</span>`},
    {k:'prazo',l:'Prazo',def:1,get:r=>r.prazo||'9999',cell:r=>{const ps=r.prazo?prazoStatus(r.prazo):null;const atrasada=ps&&ps.cls==='atrasada'&&!['Concluída','Cancelada'].includes(r.status);return `<span style="color:${atrasada?'var(--red)':'var(--t2)'};font-size:12px">${fmtD(r.prazo)}${atrasada?' · '+ps.label:''}</span>`;}},
    {k:'demanda',l:'Demanda',def:0,get:r=>{const d=r.demandaId&&S.demandas.find(x=>x.id===r.demandaId);return d?d.uid:'';},cell:r=>{const d=r.demandaId&&S.demandas.find(x=>x.id===r.demandaId);return `<span style="color:var(--t2)">${d?d.uid:'—'}</span>`;}}
  ]}
};

function tableCols(id){
  const def=COLDEFS[id];if(!def)return[];
  S.cols=S.cols||{};
  const saved=S.cols[id];
  if(saved&&saved.length)return saved.map(k=>def.cols.find(c=>c.k===k)).filter(Boolean);
  return def.cols.filter(c=>c.def);
}
function tableSort(id){return (S.sort&&S.sort['tbl_'+id])||null;}
function setTableSort(id,k){
  S.sort=S.sort||{};
  const cur=S.sort['tbl_'+id];
  S.sort['tbl_'+id]=(cur&&cur.k===k)?{k,dir:cur.dir==='asc'?'desc':'asc'}:{k,dir:'asc'};
  save();render();
}
function applyTableSort(id,rows){
  const st=tableSort(id);if(!st)return rows;
  const col=COLDEFS[id].cols.find(c=>c.k===st.k);if(!col)return rows;
  const mul=st.dir==='asc'?1:-1;
  return [...rows].sort((a,b)=>{
    const av=col.get(a),bv=col.get(b);
    if(typeof av==='number'&&typeof bv==='number')return (av-bv)*mul;
    return String(av).localeCompare(String(bv),'pt-BR')*mul;
  });
}
/* Monta a tabela. actionsFn(row) -> html dos botões da última coluna */
function renderDataTable(id,rows,actionsFn){
  const cols=tableCols(id);
  if(!cols.length)return '<div class="empty-msg">Nenhuma coluna selecionada. Use "⚙ Colunas" para escolher.</div>';
  const st=tableSort(id);
  const head=cols.map(c=>`<th style="cursor:pointer;user-select:none" onclick="setTableSort('${id}','${c.k}')">${c.l}${st&&st.k===c.k?(st.dir==='asc'?' ↑':' ↓'):''}</th>`).join('');
  const body=rows.map(r=>`<tr>${cols.map(c=>`<td>${c.cell(r)}</td>`).join('')}${actionsFn?`<td><div class="tacts">${actionsFn(r)}</div></td>`:''}</tr>`).join('');
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head}${actionsFn?'<th></th>':''}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function colBtn(id){return `<button class="btn-sm" onclick="openColPicker('${id}')">⚙ Colunas (${tableCols(id).length})</button>`;}
function csvBtn(id,rows){S._csv=S._csv||{};S._csv[id]=rows;return `<button class="btn-sm" onclick="exportCSV('${id}')">↓ CSV</button>`;}
function exportCSV(id){
  const rows=(S._csv&&S._csv[id])||[];
  const cols=tableCols(id);
  const esc2=v=>{const s=String(v??'').replace(/"/g,'""');return /[";\n]/.test(s)?'"'+s+'"':s;};
  const lines=[cols.map(c=>esc2(c.l)).join(';'),...rows.map(r=>cols.map(c=>esc2(c.get(r))).join(';'))];
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lozy-'+id+'.csv';a.click();
}
function openColPicker(id){
  openModal('Colunas — '+COLDEFS[id].nome,colPickerBody(id),null,true);
  document.getElementById('modal').classList.add('wide');
}
function colPickerBody(id){
  const def=COLDEFS[id];
  const vis=tableCols(id).map(c=>c.k);
  const ordered=[...vis,...def.cols.map(c=>c.k).filter(k=>!vis.includes(k))];
  return `<div style="font-size:11.5px;color:var(--t2);margin-bottom:12px;">Escolha quais colunas aparecem e em que ordem. Clique no cabeçalho da tabela para ordenar por ela.</div>
  <div style="max-height:46vh;overflow-y:auto;">
  ${ordered.map((k,i)=>{const c=def.cols.find(x=>x.k===k);const on=vis.includes(k);
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--ltb);opacity:${on?1:0.5}">
      <button class="tk-check ${on?'done':''}" style="border-color:var(--b3)" onclick="colToggle('${id}','${k}')"></button>
      <span style="flex:1;font-size:12.5px;font-weight:500">${c.l}</span>
      ${on?`<button class="ibtn" onclick="colMove('${id}','${k}',-1)">↑</button><button class="ibtn" onclick="colMove('${id}','${k}',1)">↓</button>`:''}
    </div>`;}).join('')}
  </div>
  <div style="display:flex;gap:8px;margin-top:14px;border-top:1px solid var(--ltb);padding-top:14px;">
    <button class="btn-sm" onclick="colAll('${id}')">Selecionar todas</button>
    <button class="btn-sm" onclick="colReset('${id}')">Restaurar padrão</button>
  </div>`;
}
function colToggle(id,k){
  S.cols=S.cols||{};
  let vis=tableCols(id).map(c=>c.k);
  vis=vis.includes(k)?vis.filter(x=>x!==k):[...vis,k];
  S.cols[id]=vis;save();openColPicker(id);render();
}
function colMove(id,k,dir){
  S.cols=S.cols||{};
  const vis=tableCols(id).map(c=>c.k);
  const i=vis.indexOf(k),j=i+dir;
  if(i<0||j<0||j>=vis.length)return;
  [vis[i],vis[j]]=[vis[j],vis[i]];
  S.cols[id]=vis;save();openColPicker(id);render();
}
function colAll(id){S.cols=S.cols||{};S.cols[id]=COLDEFS[id].cols.map(c=>c.k);save();openColPicker(id);render();}
function colReset(id){S.cols=S.cols||{};delete S.cols[id];save();openColPicker(id);render();}
</script>
<script>
/* ═══ DASHBOARD — MOTOR DE WIDGETS ═══ */
function buildDashCtx(){
  const abertos=S.leads.filter(l=>l.stage!=='Fechado'&&l.stage!=='Perdido');
  const propAg=S.propostas.filter(p=>p.status==='Enviada');
  const demAbertas=S.demandas.filter(d=>d.status!=='Entregue');
  const mk=monthKey(todayStr());
  const recMes=sum(S.fin.filter(f=>f.tipo==='receita'&&f.pago&&monthKey(f.data)===mk),f=>liq(f));
  const despMes=sum(S.fin.filter(f=>f.tipo==='despesa'&&f.pago&&mesRef(f)===mk),f=>f.valor);
  const lucro=recMes-despMes;
  const quentes=abertos.filter(l=>l.temp==='quente');
  const demsHoje=S.demandas.filter(d=>d.status!=='Entregue'&&d.prazo&&['atrasada','hoje'].includes(prazoStatus(d.prazo)?.cls))
    .sort((a,b)=>(prazoStatus(a.prazo).cls==='atrasada'?0:1)-(prazoStatus(b.prazo).cls==='atrasada'?0:1));
  const aReceber=sum(S.fin.filter(f=>f.tipo==='receita'&&!f.pago),f=>liq(f));
  const aPagar=sum(S.fin.filter(f=>f.tipo==='despesa'&&!f.pago),f=>f.valor);
  const tarefasPend=S.tasks.filter(t=>!['Concluída','Cancelada'].includes(t.status)).length;
  const clientesTotal=(typeof allClientes==='function'?allClientes().length:clientes().length);
  const projetosAtivos=S.projetos.filter(p=>p.fase!=='Entrega').length;
  return{abertos,propAg,demAbertas,recMes,despMes,lucro,quentes,demsHoje,now:new Date(),aReceber,aPagar,tarefasPend,clientesTotal,projetosAtivos};
}

/* Métricas disponíveis para widgets personalizados (e reaproveitadas pelos widgets fixos) */
const METRIC_DEFS={
  pipeline_aberto:{label:'Pipeline aberto',calc:ctx=>({value:fmtBRL(sum(ctx.abertos)),sub:ctx.abertos.length+' oportunidade'+(ctx.abertos.length===1?'':'s')})},
  propostas_aguardando:{label:'Propostas aguardando',calc:ctx=>({value:String(ctx.propAg.length),sub:ctx.propAg.length?fmtBRL(sum(ctx.propAg,p=>p.investimento))+' em análise':'Nenhuma aguardando'})},
  demandas_abertas:{label:'Demandas em aberto',calc:ctx=>({value:String(ctx.demAbertas.length),sub:ctx.demsHoje.length?ctx.demsHoje.length+' para hoje/atrasadas':'nenhuma vencendo hoje'})},
  lucro_mes:{label:'Lucro do mês',calc:ctx=>({value:fmtBRL(ctx.lucro),sub:fmtBRL(ctx.recMes)+' rec · '+fmtBRL(ctx.despMes)+' desp',neg:ctx.lucro<0})},
  receita_mes:{label:'Receita do mês',calc:ctx=>({value:fmtBRL(ctx.recMes)})},
  despesa_mes:{label:'Despesa do mês',calc:ctx=>({value:fmtBRL(ctx.despMes)})},
  a_receber:{label:'A receber',calc:ctx=>({value:fmtBRL(ctx.aReceber)})},
  a_pagar:{label:'A pagar',calc:ctx=>({value:fmtBRL(ctx.aPagar)})},
  leads_quentes:{label:'Leads quentes',calc:ctx=>({value:String(ctx.quentes.length),sub:ctx.quentes.length?fmtBRL(sum(ctx.quentes)):''})},
  tarefas_pendentes:{label:'Tarefas pendentes',calc:ctx=>({value:String(ctx.tarefasPend)})},
  clientes_total:{label:'Total de clientes',calc:ctx=>({value:String(ctx.clientesTotal)})},
  projetos_ativos:{label:'Projetos ativos',calc:ctx=>({value:String(ctx.projetosAtivos)})}
};

/* Widgets fixos (compostos) */
const BUILTIN_DEFS={
  kpi_pipeline:{label:'Pipeline aberto',span:1,goto:'comercial',metric:'pipeline_aberto'},
  kpi_propostas:{label:'Propostas aguardando',span:1,goto:'propostas',metric:'propostas_aguardando'},
  kpi_demandas:{label:'Demandas em aberto',span:1,goto:'demandas',metric:'demandas_abertas'},
  kpi_lucro:{label:'Lucro do mês',span:1,goto:'financeiro',metric:'lucro_mes'},
  chart_rd:{label:'Receita × Despesa',span:2,goto:'financeiro',html:ctx=>`<div class="widget-hd"><span class="widget-ttl">Receita × Despesa</span><span class="widget-more">últimos 6 meses</span></div>${renderChartRD()}`},
  week:{label:'Esta semana',span:2,goto:'agenda',html:ctx=>`<div class="widget-hd"><span class="widget-ttl">Esta semana</span><span class="widget-more" style="text-transform:capitalize">${ctx.now.toLocaleDateString('pt-BR',{month:'long'})}</span></div>${renderWeekCal()}<div style="margin-top:14px">${renderWeekList()}</div>`},
  meudia:{label:'Meu dia',span:2,goto:null,html:ctx=>renderMeuDiaInner(ctx.demsHoje)},
  leads:{label:'Leads quentes',span:2,goto:'comercial',html:ctx=>`<div class="widget-hd"><span class="widget-ttl">Leads quentes</span><span class="widget-more">${ctx.quentes.length?fmtBRL(sum(ctx.quentes)):''}</span></div>${ctx.quentes.length?ctx.quentes.map(l=>`<div class="row-item"><div><div class="ri-name" style="color:var(--dk1)">${esc(l.empresa)}</div><div class="ri-sub">${esc(l.stage)}${l.contato?' · '+esc(l.contato):''}</div></div><div class="ri-val" style="color:var(--dk1)">${fmtBRL(l.valor)}</div></div>`).join(''):'<div class="empty-msg">Nenhum lead quente em aberto.</div>'}`}
};
const DASH_DEFAULT=[{id:'kpi_pipeline',visible:true},{id:'kpi_propostas',visible:true},{id:'kpi_demandas',visible:true},{id:'kpi_lucro',visible:true},{id:'chart_rd',visible:true},{id:'week',visible:true},{id:'meudia',visible:true},{id:'leads',visible:true}];

function kpiHtml(def,ctx){
  const m=METRIC_DEFS[def.metric];const r=m.calc(ctx);
  return `<div class="clabel">${def.label}</div><div class="metric" style="${r.neg?'color:#b91c1c':''}">${r.value}</div>${r.sub?`<div class="metric-s">${r.sub}</div>`:''}`;
}
function renderDashWidgetBlock(item,ctx){
  if(item.type==='custom'){
    const m=METRIC_DEFS[item.metric]||METRIC_DEFS.pipeline_aberto;
    const r=m.calc(ctx);
    return `<div class="wl dw-1"><div class="clabel">${esc(item.label)||m.label}</div><div class="metric" style="${r.neg?'color:#b91c1c':''}">${r.value}</div>${r.sub?`<div class="metric-s">${r.sub}</div>`:''}</div>`;
  }
  const def=BUILTIN_DEFS[item.id];if(!def)return'';
  const inner=def.html?def.html(ctx):kpiHtml(def,ctx);
  const cls='wl dw-'+def.span+(def.goto?' wl-go':'');
  const onclick=def.goto?` onclick="goTo('${def.goto}')"`:'';
  return `<div class="${cls}"${onclick}>${inner}</div>`;
}

function renderDashboard(c){
  if(!S.dash||!S.dash.length)S.dash=DASH_DEFAULT.map(x=>({...x}));
  const ctx=buildDashCtx();
  const items=S.dash.filter(w=>w.visible!==false);
  c.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:10px;">
      <div><div class="eyebrow">${ctx.now.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</div><div class="greeting" style="margin-bottom:0">${greeting()}, Leonardo.</div></div>
      <button class="btn-ghost" onclick="openDashCustomizer()">⚙ Personalizar</button>
    </div>
    <div class="dash-grid">${items.map(it=>renderDashWidgetBlock(it,ctx)).join('')}</div>`;
}

/* ═══ Personalização: reordenar, ocultar, remover, adicionar widgets ═══ */
function openDashCustomizer(){
  openModal('Personalizar dashboard',dashCustomizerBody(),null,true);
  document.getElementById('modal').classList.add('wide');
}
function dashCustomizerBody(){
  const rows=S.dash.map((it,i)=>{
    const label=it.type==='custom'?(it.label||METRIC_DEFS[it.metric]?.label||'Widget'):(BUILTIN_DEFS[it.id]?.label||it.id);
    const hidden=it.visible===false;
    return `<div style="display:flex;align-items:center;gap:6px;padding:8px 2px;border-bottom:1px solid var(--ltb);opacity:${hidden?0.45:1}">
      <span style="flex:1;font-size:12.5px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(label)}</span>
      ${it.type==='custom'?'<span class="bdg">personalizado</span>':''}
      <button class="ibtn" onclick="dashMove(${i},-1)" title="Mover para cima">↑</button>
      <button class="ibtn" onclick="dashMove(${i},1)" title="Mover para baixo">↓</button>
      <button class="ibtn" onclick="dashToggle(${i})" title="${hidden?'Mostrar':'Ocultar'}">${hidden?'○':'●'}</button>
      ${it.type==='custom'?`<button class="ibtn del" onclick="dashDelete(${i})" title="Remover">✕</button>`:''}
    </div>`;
  }).join('');
  return `<div style="font-size:11.5px;color:var(--t2);margin-bottom:12px;">Reordene, oculte ou remova widgets. Widgets personalizados podem ser criados abaixo a partir de qualquer métrica do sistema.</div>
  <div style="max-height:38vh;overflow-y:auto;margin-bottom:16px;">${rows}</div>
  <div style="border-top:1px solid var(--ltb);padding-top:14px;">
    <div style="font-size:11px;color:var(--t3);margin-bottom:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;">+ Criar widget personalizado</div>
    <div class="f2">
      <div class="field"><label>Título (opcional)</label><input id="dw-title" placeholder="Ex: Total de clientes"></div>
      <div class="field"><label>Métrica</label><select id="dw-metric">${Object.entries(METRIC_DEFS).map(([k,m])=>`<option value="${k}">${m.label}</option>`).join('')}</select></div>
    </div>
    <button class="btn-sm" onclick="dashAddCustom()">+ Adicionar ao dashboard</button>
  </div>`;
}
function dashMove(i,dir){
  const j=i+dir;if(j<0||j>=S.dash.length)return;
  [S.dash[i],S.dash[j]]=[S.dash[j],S.dash[i]];
  save();openDashCustomizer();render();
}
function dashToggle(i){S.dash[i].visible=S.dash[i].visible===false?true:false;save();openDashCustomizer();render();}
function dashDelete(i){if(S.dash[i].type!=='custom')return;S.dash.splice(i,1);save();openDashCustomizer();render();}
function dashAddCustom(){
  const title=document.getElementById('dw-title').value.trim();
  const metric=document.getElementById('dw-metric').value;
  S.dash.push({id:uid('cw'),type:'custom',metric,label:title,visible:true});
  save();openDashCustomizer();render();
}

/* ═══ Blocos auxiliares (usados pelos widgets fixos) ═══ */
function renderChartRD(){
  const months=[];const d=new Date();d.setDate(1);
  for(let i=5;i>=0;i--){const m=new Date(d);m.setMonth(m.getMonth()-i);months.push(m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0'));}
  const data=months.map(mk=>({
    mk,
    rec:sum(S.fin.filter(f=>f.tipo==='receita'&&f.pago&&monthKey(f.data)===mk),f=>liq(f)),
    desp:sum(S.fin.filter(f=>f.tipo==='despesa'&&f.pago&&mesRef(f)===mk),f=>f.valor)
  }));
  const max=Math.max(1,...data.map(x=>Math.max(x.rec,x.desp)));
  return `<div class="chart-bars">${data.map(x=>`<div class="cb-group"><div class="cb rec" style="height:${Math.max(2,x.rec/max*100)}%"></div><div class="cb desp" style="height:${Math.max(2,x.desp/max*100)}%"></div></div>`).join('')}</div>
  <div class="chart-lbls">${data.map(x=>{const[y,m]=x.mk.split('-');return '<span>'+new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</span>';}).join('')}</div>
  <div class="chart-leg"><span class="lg"><i style="background:var(--dk1)"></i>Receita líquida</span><span class="lg"><i style="background:var(--dk3)"></i>Despesa</span></div>`;
}

function weekDays(){
  const now=new Date();now.setHours(0,0,0,0);
  const dow=(now.getDay()+6)%7; /* segunda=0 */
  const mon=new Date(now);mon.setDate(now.getDate()-dow);
  return[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function renderWeekCal(){
  const days=weekDays();const today=todayStr();
  const dows=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];
  const evd=new Set([...S.eventos.map(e=>e.data),...S.demandas.filter(d=>d.status!=='Entregue'&&d.prazo).map(d=>d.prazo)]);
  return '<div class="wk-grid">'+days.map((d,i)=>{
    const ds=dstr(d);
    return `<div class="wk-cell ${ds===today?'today':''} ${evd.has(ds)?'has':''}"><div class="wk-dow">${dows[i]}</div><div class="wk-num">${d.getDate()}</div><div class="wk-dot"></div></div>`;
  }).join('')+'</div>';
}
function renderWeekList(){
  const days=weekDays().map(dstr);
  const evs=[
    ...S.eventos.filter(e=>days.includes(e.data)).map(e=>({d:e.data,t:e.titulo,s:e.hIni||'',tipo:e.tipo})),
    ...S.demandas.filter(d=>d.status!=='Entregue'&&days.includes(d.prazo)).map(d=>({d:d.prazo,t:'Prazo: '+d.titulo,s:'',tipo:'Prazo'}))
  ].sort((a,b)=>a.d.localeCompare(b.d)||a.s.localeCompare(b.s)).slice(0,4);
  if(!evs.length)return '<div class="empty-msg">Semana livre. Clique em qualquer dia da agenda.</div>';
  return evs.map(e=>`<div class="row-item"><div><div class="ri-name" style="color:var(--dk1)">${esc(e.t)}</div><div class="ri-sub">${fmtD(e.d)}${e.s?' · '+e.s:''} · ${e.tipo}</div></div></div>`).join('');
}

function renderMeuDiaInner(demsHoje){
  const tasksHoje=S.tasks.filter(t=>['A fazer','Em andamento'].includes(t.status)&&(!t.prazo||prazoStatus(t.prazo)?.diff<=0));
  const done=S.tasks.filter(t=>t.status==='Concluída').slice(0,3);
  return `<div class="widget-hd"><span class="widget-ttl">Meu dia</span><span class="widget-more">${new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})} · <a class="wgo" onclick="goTo('tarefas')">abrir →</a></span></div>
    <div style="margin-bottom:16px">
      <div class="day-lbl">Tarefas</div>
      <div class="task-input-wrap"><input class="task-input" id="task-input" placeholder="Adicionar tarefa rápida..." onkeydown="if(event.key==='Enter')addQuickTask()"><button class="btn-sm" style="background:var(--dk1);color:#fff;border-color:var(--dk1)" onclick="addQuickTask()">+ Add</button></div>
      ${(tasksHoje.length||done.length)?[...tasksHoje,...done].map(t=>`<div class="task-item">
        <button class="tk-check ${t.status==='Concluída'?'done':''}" onclick="toggleTask('${t.id}')"></button>
        <span class="tk-text ${t.status==='Concluída'?'done':''}">${esc(t.titulo)}</span>
        ${t.prioridade==='Alta'?'<span class="bdg alta" style="border-color:#dc262640">alta</span>':''}
        <button class="tk-del" onclick="delTask('${t.id}')">✕</button>
      </div>`).join(''):'<div class="empty-msg">Sem tarefas para hoje.</div>'}
    </div>
    <div>
      <div class="day-lbl">Demandas para hoje</div>
      ${demsHoje.length?demsHoje.map(d=>{const ps=prazoStatus(d.prazo);return `<div class="dem-item"><div class="dem-dot ${ps.cls}"></div><div class="dem-body"><div class="dem-name">${esc(d.titulo)}</div><div class="dem-meta">${esc(d.cliente||'Sem cliente')} · ${esc(d.tipo)}</div></div><div class="dem-prazo ${ps.cls}">${ps.label}</div></div>`;}).join(''):'<div class="empty-msg">Nenhuma demanda com prazo para hoje.</div>'}
    </div>`;
}
function addQuickTask(){
  const el=document.getElementById('task-input');const v=el?.value.trim();if(!v)return;
  S.tasks.unshift({id:uid('t'),titulo:v,prioridade:'Média',status:'A fazer',prazo:todayStr()});
  save();render();
}
function toggleTask(id){const t=S.tasks.find(x=>x.id===id);if(t){t.status=t.status==='Concluída'?'A fazer':'Concluída';save();render();}}
function delTask(id){S.tasks=S.tasks.filter(x=>x.id!==id);save();render();}

<script>

  return `<div class="kcard"><div class="kc-top"><div class="kc-name">${esc(l.empresa)}</div><span class="bdg ${l.temp}">${l.temp}</span></div>

function mvLead(id,d){const l=S.leads.find(x=>x.id===id);const n=STAGES.indexOf(l.stage)+d;if(n<0||n>=STAGES.length)return;l.stage=STAGES[n];

    <div class="ri-sub">${l?esc(l.empresa)+' · ':''}${fmtD(f.data)}${ps&&!f.feito&&ps.cls!=='ok'?' · <span style="color:'+(ps.cls==='atrasada'?'var(--red)':'var(--amber)')+'">'+ps.label+'</span>':''}</div></div></div>
    <button class="ibtn del" onclick="delFU('${f.id}')">✕</button></div>`;}).join('')}</div>`

  const l=id?S.leads.find(x=>x.id===id):null;

    <div class="f2"><div class="field"><label>Segmento</label><input id="m6" value="${esc(l?.segmento)}" placeholder="Saúde, Gastronomia..."></div>
    <div class="field"><label>Cidade</label><input id="m7" value="${esc(l?.cidade)}"></div></div>
    <div class="f2"><div class="field"><label>Próxima ação</label><input id="m8" value="${esc(l?.proxAcao)}" placeholder="Ligar, enviar proposta..."></div>
    <div class="field"><label>Data da ação</label><input id="m9" type="date" value="${l?.proxData||''}"></div></div>
    ${l?`<div class="field"><label>Etapa</label><select id="m10">${STAGES.map(s=>`<option ${l.stage===s?'selected':''}>${s}</option>`).join('')}</select></div>`:''}`,

<script>
/* ═══ DEMANDAS (lógica Central Lozy) ═══ */
const DCOLORS={'Em planejamento':'#6e6e6e','Em edição':'#8C4530','Com o cliente':'#4E1A1D','Entregue':'#15803d'};
const hexA=(h,a)=>h+Math.round(a*255).toString(16).padStart(2,'0');
const PRAZO_F=[['atrasadas','Atrasadas'],['hoje','Hoje'],['semana','Próximos 7 dias'],['semprazo','Sem prazo']];
function matchPrazo(prazo,filtro,concluida){
  if(!filtro)return true;
  if(filtro==='semprazo')return !prazo;
  if(!prazo)return false;
  const ps=prazoStatus(prazo);
  if(filtro==='atrasadas')return ps.cls==='atrasada'&&!concluida;
  if(filtro==='hoje')return ps.cls==='hoje';
  if(filtro==='semana')return ps.diff>=0&&ps.diff<=7;
  return true;
}
function prazoBuckets(arr,get,isDone){
  const B={atr:[],hoje:[],sem:[],dep:[],sp:[],done:[]};
  arr.forEach(x=>{
    if(isDone&&isDone(x))return B.done.push(x);
    const p=get(x);
    if(!p)return B.sp.push(x);
    const ps=prazoStatus(p);
    if(ps.cls==='atrasada')B.atr.push(x);
    else if(ps.cls==='hoje')B.hoje.push(x);
    else if(ps.diff<=7)B.sem.push(x);
    else B.dep.push(x);});
  return[['Atrasadas',B.atr,'var(--red)'],['Hoje',B.hoje,'var(--amber)'],['Próximos 7 dias',B.sem,null],['Depois',B.dep,null],['Sem prazo',B.sp,null],['Concluídas',B.done,'var(--green)']];
}
function nextDemUid(){const mx=S.demandas.reduce((m,d)=>Math.max(m,parseInt((d.uid||'').replace('DEM-',''))||0),0);return 'DEM-'+String(mx+1).padStart(3,'0');}
function demMargem(d){return Number(d.receita||0)-Number(d.custo||0);}
function filhas(id){return S.demandas.filter(x=>x.maeId===id);}

function renderDemandas(c){
  c.innerHTML=`
    <div class="page-hd"><div><div class="page-title">Demandas</div></div></div>
    ${tabsHtml('demandas',[{id:'lista',l:'Lista'},{id:'porcliente',l:'Por cliente'},{id:'porstatus',l:'Por status'},{id:'portipo',l:'Por tipo'},{id:'porprazo',l:'Por prazo'}])}
    <div id="dem-body"></div>`;
  const b=document.getElementById('dem-body');
  const q=(S.q.dem||'').toLowerCase();const f=S.f.dem||{};
  let ds=S.demandas.filter(d=>
    (!q||[d.titulo,d.cliente,d.uid].join(' ').toLowerCase().includes(q))&&
    (!f.cliente||d.cliente===f.cliente)&&(!f.tipo||d.tipo===f.tipo)&&(!f.status||d.status===f.status)&&matchPrazo(d.prazo,f.prazo,d.status==='Entregue'));
  ds=[...ds].sort((a,b)=>{if(!a.prazo&&!b.prazo)return 0;if(!a.prazo)return 1;if(!b.prazo)return -1;return a.prazo.localeCompare(b.prazo);});
  const toolbar=`<div class="toolbar">
    <input class="search" placeholder="Buscar por título, cliente ou DEM-ID..." value="${esc(S.q.dem||'')}" oninput="S.q.dem=this.value;render();setTimeout(()=>{const e=document.querySelector('.search');e.focus();e.setSelectionRange(e.value.length,e.value.length)},0)">
    <select class="fsel" onchange="S.f.dem={...S.f.dem,cliente:this.value};render()"><option value="">Cliente: Todos</option>${clientes().map(cl=>`<option ${f.cliente===cl?'selected':''}>${cl}</option>`).join('')}</select>
    <select class="fsel" onchange="S.f.dem={...S.f.dem,tipo:this.value};render()"><option value="">Tipo: Todos</option>${DTIPOS.map(t=>`<option ${f.tipo===t?'selected':''}>${t}</option>`).join('')}</select>
    <select class="fsel" onchange="S.f.dem={...S.f.dem,status:this.value};render()"><option value="">Status: Todos</option>${DSTATUS.map(t=>`<option ${f.status===t?'selected':''}>${t}</option>`).join('')}</select>
    <select class="fsel" onchange="S.f.dem={...S.f.dem,prazo:this.value};render()"><option value="">Prazo: Todos</option>${PRAZO_F.map(p=>`<option value="${p[0]}" ${f.prazo===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select>
    ${colBtn('demandas')}${csvBtn('demandas',ds)}
  </div>`;
  const t=S.tab.demandas;
  if(t==='lista'){
    b.innerHTML=toolbar+(ds.length?`<div class="card" style="padding:6px 20px;">${renderDataTable('demandas',applyTableSort('demandas',ds),demActs)}</div>`:'<div class="card"><div class="empty-msg">Nenhuma demanda encontrada.</div></div>');
  }else if(t==='porcliente'){
    const grupos={};ds.forEach(d=>{const k=d.cliente||'Sem cliente';(grupos[k]=grupos[k]||[]).push(d);});
    b.innerHTML=toolbar+(Object.keys(grupos).length?Object.entries(grupos).map(([cl,arr])=>{
      const rec=sum(arr,d=>d.receita),cus=sum(arr,d=>d.custo);
      return `<div class="grp"><div class="grp-hd"><span class="grp-name">${esc(cl)}</span><span class="grp-stat">${arr.length} demanda${arr.length===1?'':'s'} · Receita ${fmtBRL(rec)} · Custo ${fmtBRL(cus)} · <b style="color:${rec-cus<0?'var(--red)':'var(--green)'}">Margem ${fmtBRL(rec-cus)}</b></span></div>
      <div class="card" style="padding:6px 20px;">${renderDataTable('demandas',applyTableSort('demandas',arr),demActs)}</div></div>`;
    }).join(''):'<div class="card"><div class="empty-msg">Nenhuma demanda encontrada.</div></div>');
  }else if(t==='portipo'){
    b.innerHTML=toolbar+DTIPOS.map(tp=>{
      const arr=ds.filter(d=>d.tipo===tp);if(!arr.length)return '';
      const rec=sum(arr,d=>d.receita),cus=sum(arr,d=>d.custo);
      return `<div class="grp"><div class="grp-hd"><span class="grp-name">${tp}</span><span class="grp-stat">${arr.length} · Receita ${fmtBRL(rec)} · Margem ${fmtBRL(rec-cus)}</span></div>
      <div class="card" style="padding:6px 20px;">${renderDataTable('demandas',applyTableSort('demandas',arr),demActs)}</div></div>`;
    }).join('')||'<div class="card"><div class="empty-msg">Nenhuma demanda encontrada.</div></div>';
  }else if(t==='porprazo'){
    const buckets=prazoBuckets(ds,d=>d.prazo,d=>d.status==='Entregue');
    b.innerHTML=toolbar+buckets.map(([nome,arr,cor])=>{
      if(!arr.length)return '';
      return `<div class="grp"><div class="grp-hd"><span class="grp-name" style="color:${cor||'var(--lx1)'}">${nome}</span><span class="grp-stat">${arr.length}</span></div>
      <div class="card" style="padding:6px 20px;">${renderDataTable('demandas',applyTableSort('demandas',arr),demActs)}</div></div>`;
    }).join('')||'<div class="card"><div class="empty-msg">Nenhuma demanda encontrada.</div></div>';
  }else{
    b.innerHTML=toolbar+'<div class="board">'+DSTATUS.map(st=>{
      const arr=ds.filter(d=>d.status===st);const cor=DCOLORS[st]||'#6e6e6e';

  const aReceber=sum(recMes.filter(f=>!f.pago),f=>liq(f));
  const pago=sum(despMes.filter(f=>f.pago),f=>f.valor);
  const aPagar=sum(despMes.filter(f=>!f.pago),f=>f.valor);
  const saldo=recebido-pago;

  const cats={};despMes.forEach(f=>{cats[f.categoria||'Outros']=(cats[f.categoria||'Outros']||0)+Number(f.valor||0);});
  const catMax=Math.max(1,...Object.values(cats));
  const pend=S.fin.filter(f=>!f.pago).sort((a,b)=>String(a.data).localeCompare(b.data)).slice(0,6);
  const [yy,mm]=mk.split('-');
  const mesLabel=new Date(yy,mm-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  b.innerHTML=`

      <div class="card"><div class="clabel">Pago</div><div class="metric" style="color:var(--red)">${fmtBRL(pago)}</div><div class="metric-s">${fmtBRL(aPagar)} a pagar</div></div>
      <div class="card"><div class="clabel">Saldo realizado</div><div class="metric" style="color:${saldo<0?'var(--red)':'var(--t1)'}">${fmtBRL(saldo)}</div><div class="metric-s">previsto ${fmtBRL(recebido+aReceber-pago-aPagar)}</div></div>
