/* ── Lançamentos: filtros completos + ordenação ── */
function finLanc(b){
  const q=(S.q.fin||'').toLowerCase();const f=S.f.finLanc||{};
  const srt=S.sort.finLanc||{campo:'data',dir:'desc'};
  let ls=S.fin.filter(l=>
    (!q||[l.desc,l.cliente,l.categoria,l.tipoReceita].join(' ').toLowerCase().includes(q))&&
    (!f.tipo||l.tipo===f.tipo)&&
    (!f.status||(f.status==='pago'?l.pago:!l.pago))&&
    (!f.cat||l.tipoReceita===f.cat||l.categoria===f.cat)&&
    (!f.nat||l.natureza===f.nat)&&
    (!f.mec||l.mecanismo===f.mec)&&
    (!f.conta||l.conta===f.conta)&&
    (!f.cliente||l.cliente===f.cliente)&&
    (!f.de||(l.data||'')>=f.de)&&
    (!f.ate||(l.data||'')<=f.ate));
  ls=[...ls].sort((a,b)=>{
    let av,bv;
    if(srt.campo==='valor'){av=a.tipo==='receita'?liq(a):a.valor;bv=b.tipo==='receita'?liq(b):b.valor;}
    else if(srt.campo==='desc'){av=(a.desc||'').toLowerCase();bv=(b.desc||'').toLowerCase();}
    else{av=a.data||'';bv=b.data||'';}
    const cmp=av>bv?1:av<bv?-1:0;
    return srt.dir==='asc'?cmp:-cmp;
  });
  const rec=sum(ls.filter(x=>x.tipo==='receita'),x=>liq(x)),desp=sum(ls.filter(x=>x.tipo==='despesa'),x=>x.valor);
  const CATU=[...new Set([...RTIPOS,...FCATS])];
  b.innerHTML=`
    <div class="toolbar">
      <input class="search" placeholder="Buscar descrição, cliente, categoria..." value="${esc(S.q.fin||'')}" oninput="S.q.fin=this.value;render();setTimeout(()=>{const e=document.querySelector('.search');e.focus();e.setSelectionRange(e.value.length,e.value.length)},0)">
      <select class="fsel" onchange="S.f.finLanc={...S.f.finLanc,tipo:this.value};render()"><option value="">Tipo: Todos</option><option value="receita" ${f.tipo==='receita'?'selected':''}>Receitas</option><option value="despesa" ${f.tipo==='despesa'?'selected':''}>Despesas</option></select>
      <select class="fsel" onchange="S.f.finLanc={...S.f.finLanc,status:this.value};render()"><option value="">Status: Todos</option><option value="pago" ${f.status==='pago'?'selected':''}>Pago/Recebido</option><option value="pend" ${f.status==='pend'?'selected':''}>Pendente</option></select>
      <select class="fsel" onchange="S.f.finLanc={...S.f.finLanc,cat:this.value};render()"><option value="">Categoria: Todas</option>${CATU.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select>
      <select class="fsel" onchange="S.f.finLanc={...S.f.finLanc,nat:this.value};render()"><option value="">Natureza: Todas</option>${NATUREZAS.map(n=>`<option ${f.nat===n?'selected':''}>${n}</option>`).join('')}</select>
      <select class="fsel" onchange="S.f.finLanc={...S.f.finLanc,mec:this.value};render()"><option value="">Mecanismo: Todos</option>${MECANISMOS.map(m=>`<option ${f.mec===m?'selected':''}>${m}</option>`).join('')}</select>
      <select class="fsel" onchange="S.f.finLanc={...S.f.finLanc,conta:this.value};render()"><option value="">Conta: Todas</option>${CONTAS.map(c=>`<option ${f.conta===c.nome?'selected':''}>${c.nome}</option>`).join('')}</select>
      <select class="fsel" onchange="S.f.finLanc={...S.f.finLanc,cliente:this.value};render()"><option value="">Cliente: Todos</option>${clientes().map(c=>`<option ${f.cliente===c?'selected':''}>${c}</option>`).join('')}</select>
      <input class="fsel" type="date" title="De" value="${f.de||''}" onchange="S.f.finLanc={...S.f.finLanc,de:this.value};render()">
      <input class="fsel" type="date" title="Até" value="${f.ate||''}" onchange="S.f.finLanc={...S.f.finLanc,ate:this.value};render()">
      ${(f.tipo||f.status||f.cat||f.nat||f.mec||f.conta||f.cliente||f.de||f.ate)?'<button class="btn-sm" onclick="S.f.finLanc={};render()">Limpar filtros</button>':''}
      ${colBtn('fin_lanc')}${csvBtn('fin_lanc',ls)}
    </div>
    <div style="font-size:11.5px;color:var(--lx3);margin-bottom:10px;">${ls.length} lançamentos · Receita líq. <span style="color:var(--green)">${fmtBRL(rec)}</span> · Despesa <span style="color:var(--red)">${fmtBRL(desp)}</span> · Saldo <b style="color:${rec-desp<0?'var(--red)':'var(--green)'}">${fmtBRL(rec-desp)}</b></div>
    ${ls.length?`<div class="card" style="padding:6px 20px;">${renderDataTable('fin_lanc',applyTableSort('fin_lanc',ls),r=>`<button class="ibtn" onclick="openLanc('${r.tipo}','${r.id}')">✎</button><button class="ibtn del" onclick="delLanc('${r.id}')">✕</button>`)}</div>`:'<div class="card"><div class="empty-msg">Nenhum lançamento encontrado com esses filtros.</div></div>'}`;
}

/* ── Contas: filtro + ordenação, independente dos Lançamentos ── */
function finContas(b){
  const f=S.f.finContas||{};
  const srt=S.sort.finContas||{campo:'data',dir:'asc'};
  const aRec=S.fin.filter(f=>f.tipo==='receita'&&!f.pago);
  const aPag=S.fin.filter(f=>f.tipo==='despesa'&&!f.pago);
  const cls=arr=>{
    const atr=arr.filter(x=>x.data&&prazoStatus(x.data)?.cls==='atrasada');
    const hoje=arr.filter(x=>x.data&&prazoStatus(x.data)?.cls==='hoje');
    const sete=arr.filter(x=>x.data&&prazoStatus(x.data)?.diff>0&&prazoStatus(x.data).diff<=7);
    return{atr,hoje,sete};
  };
  const r=cls(aRec),p=cls(aPag);
  const passFilter=x=>(!f.cliente||x.cliente===f.cliente)&&(!f.cat||x.tipoReceita===f.cat||x.categoria===f.cat);
  const sorter=(a,b)=>{
    let av,bv;
    if(srt.campo==='valor'){av=a.tipo==='receita'?liq(a):a.valor;bv=b.tipo==='receita'?liq(b):b.valor;}
    else if(srt.campo==='cliente'){av=(a.cliente||'').toLowerCase();bv=(b.cliente||'').toLowerCase();}
    else{av=a.data||'';bv=b.data||'';}
    const cmp=av>bv?1:av<bv?-1:0;
    return srt.dir==='asc'?cmp:-cmp;
  };
  const CATU=[...new Set([...RTIPOS,...FCATS])];
  const toolbar=`<div class="toolbar">
    <select class="fsel" onchange="S.f.finContas={...S.f.finContas,cliente:this.value};render()"><option value="">Cliente: Todos</option>${clientes().map(c=>`<option ${f.cliente===c?'selected':''}>${c}</option>`).join('')}</select>
    <select class="fsel" onchange="S.f.finContas={...S.f.finContas,cat:this.value};render()"><option value="">Categoria: Todas</option>${CATU.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    <select class="fsel" onchange="S.sort.finContas={...srt,campo:this.value};render()"><option value="data" ${srt.campo==='data'?'selected':''}>Ordenar: Vencimento</option><option value="valor" ${srt.campo==='valor'?'selected':''}>Ordenar: Valor</option><option value="cliente" ${srt.campo==='cliente'?'selected':''}>Ordenar: Cliente</option></select>
    <button class="ibtn" title="Inverter ordem" onclick="S.sort.finContas={...srt,dir:srt.dir==='asc'?'desc':'asc'};render()">${srt.dir==='asc'?'↑':'↓'}</button>
    ${(f.cliente||f.cat)?'<button class="btn-sm" onclick="S.f.finContas={};render()">Limpar filtros</button>':''}
  </div>`;
  const box=(titulo,total,c,tipo,full)=>{
    const list=full.filter(passFilter).sort(sorter).slice(0,12);
    const hoje=todayStr();
    const lim=addM(hoje,1);
    const curto=full.filter(x=>!x.data||x.data<=lim);
    const futuro=full.filter(x=>x.data&&x.data>lim);
    const vf=sum(futuro,x=>tipo==='r'?liq(x):x.valor);
    return `
    <div class="card"><div class="widget-hd"><span class="widget-ttl">${titulo}</span>
    <span class="widget-more"><span style="color:var(--red)">Atrasado ${c.atr.length} · ${fmtBRL(sum(c.atr,x=>tipo==='r'?liq(x):x.valor))}</span> &nbsp; <span style="color:var(--amber)">Hoje ${c.hoje.length}</span> &nbsp; <span style="color:var(--blue)">7 dias ${c.sete.length}</span></span></div>
    <div class="metric" style="margin-bottom:2px">${fmtBRL(sum(curto,x=>tipo==='r'?liq(x):x.valor))}</div>
    <div class="metric-s" style="margin-bottom:10px">até 30 dias${vf?` · <span style="color:var(--t3)">+ ${fmtBRL(vf)} em compromissos futuros (${futuro.length})</span>`:''}</div>
    ${list.length?list.map(x=>{const ps=prazoStatus(x.data);
    return `<div class="row-item"><div><div class="ri-name">${esc(x.desc)}</div><div class="ri-sub">${esc(x.cliente)||'—'} · ${fmtD(x.data)} · <span style="color:${ps.cls==='atrasada'?'var(--red)':ps.cls==='hoje'?'var(--amber)':'var(--t3)'}">${ps.label}</span></div></div>
    <div style="display:flex;align-items:center;gap:8px"><span class="ri-val">${fmtBRL(tipo==='r'?liq(x):x.valor)}</span><button class="btn-sm" onclick="togglePago('${x.id}')">${tipo==='r'?'Receber':'Pagar'}</button></div></div>`;}).join(''):'<div class="empty-msg">Nada encontrado com esses filtros.</div>'}
    </div>`;
  };
  b.innerHTML=toolbar+`<div class="g2">${box('A receber',sum(aRec,x=>liq(x)),r,'r',aRec)}${box('A pagar',sum(aPag,x=>x.valor),p,'p',aPag)}</div>`;
}

/* ── Por cliente: ordenação ── */
function finPorCliente(b){
  const srt=S.sort.finCli||{campo:'resultado',dir:'desc'};
  const map={};
  S.fin.forEach(f=>{const k=f.cliente||'Sem cliente';map[k]=map[k]||{rec:0,desp:0};if(f.tipo==='receita')map[k].rec+=liq(f);else map[k].desp+=Number(f.valor||0);});
  const es=Object.entries(map).map(([cl,v])=>({cl,...v,res:v.rec-v.desp,margem:v.rec?(v.rec-v.desp)/v.rec*100:0}));
  es.sort((a,b)=>{
    let av,bv;
    if(srt.campo==='receita'){av=a.rec;bv=b.rec;}
    else if(srt.campo==='despesa'){av=a.desp;bv=b.desp;}
    else if(srt.campo==='margem'){av=a.margem;bv=b.margem;}
    else if(srt.campo==='cliente'){av=a.cl.toLowerCase();bv=b.cl.toLowerCase();}
    else{av=a.res;bv=b.res;}
    const cmp=av>bv?1:av<bv?-1:0;
    return srt.dir==='asc'?cmp:-cmp;
  });
  b.innerHTML=`<div class="toolbar">
    <select class="fsel" onchange="S.sort.finCli={...srt,campo:this.value};render()">
      <option value="resultado" ${srt.campo==='resultado'?'selected':''}>Ordenar: Resultado</option>
      <option value="receita" ${srt.campo==='receita'?'selected':''}>Ordenar: Receita</option>
      <option value="despesa" ${srt.campo==='despesa'?'selected':''}>Ordenar: Despesa</option>
      <option value="margem" ${srt.campo==='margem'?'selected':''}>Ordenar: Margem</option>
      <option value="cliente" ${srt.campo==='cliente'?'selected':''}>Ordenar: Cliente</option>
    </select>
    <button class="ibtn" title="Inverter ordem" onclick="S.sort.finCli={...srt,dir:srt.dir==='asc'?'desc':'asc'};render()">${srt.dir==='asc'?'↑':'↓'}</button>
    ${colBtn('fin_cliente')}${csvBtn('fin_cliente',es)}
  </div>`+
  (es.length?`<div class="card" style="padding:6px 20px;">${renderDataTable('fin_cliente',applyTableSort('fin_cliente',es))}</div>`:'<div class="card"><div class="empty-msg">Nenhum projeto com lançamentos ainda. Vincule receitas e despesas a clientes para ver rentabilidade.</div></div>');
}

function togglePago(id){const f=S.fin.find(x=>x.id===id);if(f){f.pago=!f.pago;save();render();}}
function delLanc(id){S.fin=S.fin.filter(x=>x.id!==id);save();render();}
function openLanc(tipo,id){
  const l=id?S.fin.find(x=>x.id===id):null;
  const isRec=tipo==='receita';
  openModal(l?'Editar lançamento':(isRec?'Nova receita':'Nova despesa'),`
    <div class="field"><label>Descrição</label><input id="m1" value="${esc(l?.desc)}" placeholder="Ex: Parcela 2/4 — campanha julho"></div>
    <div class="f2"><div class="field"><label>Valor bruto (R$)</label><input id="m2" type="number" step="0.01" value="${l?.valor??''}"></div>
    <div class="field"><label>Data ${isRec?'(recebimento)':'(compra/vencimento)'}</label><input id="m3" type="date" value="${l?.data||todayStr()}"></div></div>
    ${isRec?`
    <div class="f2"><div class="field"><label>Tipo de receita</label><select id="m4">${RTIPOS.map(t=>`<option ${l?.tipoReceita===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Alíquota (%)</label><input id="m5" type="number" step="0.01" value="${l?.aliquota??6}" placeholder="6"></div></div>`
    :`
    <div class="f2"><div class="field"><label>Categoria</label><select id="m4">${FCATS.map(t=>`<option ${l?.categoria===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Natureza</label><select id="m5">${NATUREZAS.map(t=>`<option ${l?.natureza===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
    <div class="field"><label>Mecanismo</label><select id="m8" onchange="parcFields(${l?'true':'false'})">${MECANISMOS.map(t=>`<option ${l?.mecanismo===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div id="parc-extra"></div>`}
    <div class="f2"><div class="field"><label>Forma de pagamento</label><select id="m6">${FORMAS.map(t=>`<option ${l?.forma===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Conta</label><select id="m7">${CONTAS.map(c=>`<option ${l?.conta===c.nome?'selected':''}>${c.nome}</option>`).join('')}</select></div></div>
    <div class="field"><label>Cliente / Projeto (opcional)</label><input id="m9" list="cl-list3" value="${esc(l?.cliente)}"><datalist id="cl-list3">${clientes().map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></div>
    <div class="field" style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="m10" style="width:auto" ${l?.pago?'checked':''}><label style="margin:0">${isRec?'Já foi recebido':'Já foi pago'}</label></div>
    ${!isRec?'<div style="font-size:11px;color:var(--t3)">Crédito: mês de referência segue o fechamento da fatura (Nubank 9 · BTG 27).</div>':''}`,
  ()=>{const v=k=>document.getElementById(k)?.value;
    if(!v('m1').trim())return;
    const base={tipo,desc:v('m1').trim(),valor:Number(v('m2'))||0,data:v('m3'),forma:v('m6'),conta:v('m7'),cliente:v('m9').trim(),pago:document.getElementById('m10').checked};
    if(isRec){base.tipoReceita=v('m4');base.aliquota=Number(v('m5'))||0;}
    else{base.categoria=v('m4');base.natureza=v('m5');base.mecanismo=v('m8');}
    if(l){Object.assign(l,base);}
    else if(!isRec&&base.mecanismo==='Parcelamento'&&Number(v('m11'))>1){
      const N=Math.min(48,Number(v('m11')));const gid=uid('g');
      for(let i=1;i<=N;i++)S.fin.push({id:uid('f'),...base,data:addM(base.data,i-1),parcelaN:i,parcelasTot:N,grupoId:gid,pago:i===1?base.pago:false});
    }
    else S.fin.push({id:uid('f'),...base});
    save();closeModal();render();});
  setTimeout(()=>parcFields(!!l),80);
}

function parcFields(editing){
  const box=document.getElementById('parc-extra');if(!box)return;
  const mec=document.getElementById('m8')?.value;
  if(mec==='Parcelamento'&&!editing){
    box.innerHTML=`<div class="field"><label>Número de parcelas</label><input id="m11" type="number" min="2" max="48" value="2"></div>
    <div style="font-size:11px;color:var(--t3);margin-bottom:10px;">O valor acima é o <b>valor de cada parcela</b> e a data é a <b>1ª parcela</b>. As demais serão lançadas automaticamente, uma por mês, respeitando o fechamento da fatura.</div>`;
  }else if(mec==='Assinatura'){
    box.innerHTML=`<div style="font-size:11px;color:var(--t3);margin-bottom:10px;">↻ Assinaturas aparecem na aba <b>Recorrentes</b>, onde você lança o próximo mês com um clique.</div>`;
  }else box.innerHTML='';
}

/* ── Recorrentes: registros dedicados (espelha bases Parcelamentos e Subscriptions) ── */
function parcInfo(p){
  const regs=S.fin.filter(f=>f.grupoId===p.grupoId).sort((a,b)=>String(a.data).localeCompare(b.data));
  const pagos=regs.filter(x=>x.pago);
  const valorParcela=p.valorTotal/p.nParcelas;
  const n=pagos.length;
  const quitado=n>=p.nParcelas;
  /* próxima = 1º registro não pago; se não houver registro, será criado */
  const pendente=regs.find(x=>!x.pago)||null;
  const ultima=regs.length?regs[regs.length-1].data:null;
  const proxData=quitado?null:(pendente?pendente.data:(ultima?addM(ultima,1):p.primeira));
  const pagoTotal=sum(pagos,x=>x.valor);
  return{pagas:n,valorParcela,quitado,proxData,pendente,pagoTotal,restante:Math.max(0,p.valorTotal-pagoTotal)};
}
function assinInfo(a){
  const regs=S.fin.filter(f=>f.assinId===a.id).sort((x,y)=>String(x.data).localeCompare(y.data));
  const pagos=regs.filter(x=>x.pago);
  const pendente=regs.find(x=>!x.pago)||null;
  const ultima=pagos.length?pagos[pagos.length-1].data:null;
  return{cobrancas:pagos.length,ultima,pendente,prox:pendente?pendente.data:(ultima?addM(ultima,1):todayStr())};
}
function lancarParcela(pid){
  const p=S.parc.find(x=>x.id===pid);if(!p)return;
  const i=parcInfo(p);if(i.quitado)return;
  if(i.pendente){i.pendente.pago=true;save();render();return;}
  S.fin.push({id:uid('f'),tipo:'despesa',desc:p.nome,valor:Math.round(i.valorParcela*100)/100,data:i.proxData,
    categoria:p.categoria,natureza:p.natureza||'Fixo',mecanismo:'Parcelamento',forma:p.conta==='Conta PJ'?'PIX':'Crédito',
    conta:p.conta,cliente:'',pago:false,grupoId:p.grupoId,parcelaN:i.pagas+1,parcelasTot:p.nParcelas});
  save();render();
}
function lancarCobranca(aid){
  const a=S.assin.find(x=>x.id===aid);if(!a)return;
  const i=assinInfo(a);
  if(i.pendente){i.pendente.pago=true;save();render();return;}
  S.fin.push({id:uid('f'),tipo:'despesa',desc:a.nome,valor:a.valor,data:i.prox,categoria:a.categoria,
    natureza:'Fixo',mecanismo:'Assinatura',forma:a.conta==='Conta PJ'?'PIX':'Crédito',conta:a.conta,
    cliente:'',pago:false,assinId:a.id});
  save();render();
}
function toggleAssin(aid){const a=S.assin.find(x=>x.id===aid);if(a){a.ativo=!a.ativo;save();render();}}
function openParc(id){
  const p=id?S.parc.find(x=>x.id===id):null;
  openModal(p?'Editar parcelamento':'Novo parcelamento',`
    <div class="field"><label>Nome</label><input id="m1" value="${esc(p?.nome)}"></div>
    <div class="f2"><div class="field"><label>Valor total (R$)</label><input id="m2" type="number" step="0.01" value="${p?.valorTotal??''}"></div>
    <div class="field"><label>Nº de parcelas</label><input id="m3" type="number" min="1" max="48" value="${p?.nParcelas??12}"></div></div>
    <div class="f2"><div class="field"><label>1ª parcela</label><input id="m4" type="date" value="${p?.primeira||todayStr()}"></div>
    <div class="field"><label>Categoria</label><select id="m5">${FCATS.map(c=>`<option ${p?.categoria===c?'selected':''}>${c}</option>`).join('')}</select></div></div>
    <div class="field"><label>Conta</label><select id="m6">${CONTAS.map(c=>`<option ${p?.conta===c.nome?'selected':''}>${c.nome}</option>`).join('')}</select></div>`,
  ()=>{const v=k=>document.getElementById(k).value;if(!v('m1').trim())return;
    const d={nome:v('m1').trim(),valorTotal:Number(v('m2'))||0,nParcelas:Number(v('m3'))||1,primeira:v('m4'),categoria:v('m5'),conta:v('m6'),natureza:'Fixo'};
    if(p)Object.assign(p,d);else S.parc.push({id:uid('pc'),grupoId:uid('g'),...d});
    save();closeModal();render();});
}
function openAssin(id){
  const a=id?S.assin.find(x=>x.id===id):null;
  openModal(a?'Editar assinatura':'Nova assinatura',`
    <div class="field"><label>Nome</label><input id="m1" value="${esc(a?.nome)}"></div>
    <div class="f2"><div class="field"><label>Valor (R$)</label><input id="m2" type="number" step="0.01" value="${a?.valor??''}"></div>
    <div class="field"><label>Periodicidade</label><select id="m3"><option value="Monthly" ${a?.tipo==='Monthly'?'selected':''}>Mensal</option><option value="Yearly" ${a?.tipo==='Yearly'?'selected':''}>Anual</option></select></div></div>
    <div class="f2"><div class="field"><label>Categoria</label><select id="m4">${FCATS.map(c=>`<option ${a?.categoria===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="field"><label>Conta</label><select id="m5">${CONTAS.map(c=>`<option ${a?.conta===c.nome?'selected':''}>${c.nome}</option>`).join('')}</select></div></div>`,
  ()=>{const v=k=>document.getElementById(k).value;if(!v('m1').trim())return;
    const d={nome:v('m1').trim(),valor:Number(v('m2'))||0,tipo:v('m3'),categoria:v('m4'),conta:v('m5')};
    if(a)Object.assign(a,d);else S.assin.push({id:uid('as'),ativo:true,...d});
    save();closeModal();render();});
}
function delParc(id){S.parc=S.parc.filter(x=>x.id!==id);save();render();}
function delAssin(id){S.assin=S.assin.filter(x=>x.id!==id);save();render();}

function finRecorrentes(b){
  const f=S.f.finRec||{};
  const srt=S.sort.finRec||{campo:'proxima',dir:'asc'};
  const dirmul=srt.dir==='asc'?1:-1;
  const cmp=(a,b2)=>(a>b2?1:a<b2?-1:0)*dirmul;

  let ps=S.parc.map(p=>({p,i:parcInfo(p)}));
  ps=ps.filter(({p,i})=>(!f.cat||p.categoria===f.cat)&&(!f.conta||p.conta===f.conta)&&(!f.status||(f.status==='quitado'?i.quitado:!i.quitado)));
  ps.sort((a,b2)=>srt.campo==='valor'?cmp(a.i.valorParcela,b2.i.valorParcela):srt.campo==='nome'?cmp(a.p.nome.toLowerCase(),b2.p.nome.toLowerCase()):cmp(a.i.proxData||'9999',b2.i.proxData||'9999'));

  let as=S.assin.map(a=>({a,i:assinInfo(a)}));
  as=as.filter(({a})=>(!f.cat||a.categoria===f.cat)&&(!f.conta||a.conta===f.conta));
  as.sort((x,y)=>srt.campo==='valor'?cmp(x.a.valor,y.a.valor):srt.campo==='nome'?cmp(x.a.nome.toLowerCase(),y.a.nome.toLowerCase()):cmp(x.i.prox,y.i.prox));

  const ativos=ps.filter(x=>!x.i.quitado);
  const compromisso=sum(ativos,x=>x.i.restante);
  const mensalParc=sum(ativos,x=>x.i.valorParcela);
  const mensalAssin=sum(as.filter(x=>x.a.ativo!==false),x=>x.a.tipo==='Yearly'?x.a.valor/12:x.a.valor);

  const parcHtml=ps.map(({p,i})=>`<div class="row-item"><div style="flex:1;min-width:0;">
      <div class="ri-name">${esc(p.nome)} <span class="bdg" style="${i.quitado?'color:var(--green)':''}">${i.pagas} de ${p.nParcelas} pagas</span></div>
      <div class="ri-sub">${p.categoria} · ${p.conta} · ${fmtBRL2(i.valorParcela)}/mês · Total ${fmtBRL(p.valorTotal)}${i.quitado?' · quitado ✓':' · faltam '+(p.nParcelas-i.pagas)+' parcelas ('+fmtBRL(i.restante)+') · próxima '+fmtD(i.proxData)}</div>
      <div style="height:4px;background:rgba(0,0,0,.09);border-radius:99px;margin-top:6px;max-width:280px;"><div style="height:100%;background:${i.quitado?'var(--green)':'var(--acc)'};border-radius:99px;width:${Math.round(i.pagas/p.nParcelas*100)}%"></div></div>
    </div>
    <div style="display:flex;gap:4px;align-items:center;">
    ${i.quitado?'<span class="bdg" style="color:var(--green)">✓ Quitado</span>':`<button class="btn-sm" onclick="lancarParcela('${p.id}')">${i.pendente?'Pagar':'Lançar'} parcela ${i.pagas+1}</button>`}
    <button class="ibtn" onclick="openParc('${p.id}')">✎</button><button class="ibtn del" onclick="delParc('${p.id}')">✕</button></div></div>`).join('');

  const assHtml=as.map(({a,i})=>`<div class="row-item" style="opacity:${a.ativo===false?0.5:1}"><div style="flex:1;min-width:0;">
      <div class="ri-name">${esc(a.nome)} <span class="bdg">${a.tipo==='Yearly'?'↻ anual':'↻ mensal'}</span>${a.ativo===false?' <span class="bdg" style="color:var(--red)">pausada</span>':''}</div>
      <div class="ri-sub">${a.categoria} · ${a.conta} · ${fmtBRL(a.valor)}${a.tipo==='Yearly'?'/ano':'/mês'} · ${i.cobrancas?i.cobrancas+' cobranças · última '+fmtD(i.ultima):'nenhuma cobrança lançada'}</div></div>
      <div style="display:flex;gap:4px;align-items:center;">
      <button class="btn-sm" onclick="lancarCobranca('${a.id}')">${i.pendente?'Pagar':'Lançar'} ${fmtD(i.prox)}</button>
      <button class="ibtn" onclick="toggleAssin('${a.id}')" title="${a.ativo===false?'Reativar':'Pausar'}">${a.ativo===false?'▶':'❚❚'}</button>
      <button class="ibtn" onclick="openAssin('${a.id}')">✎</button><button class="ibtn del" onclick="delAssin('${a.id}')">✕</button></div></div>`).join('');

  const toolbar=`<div class="toolbar">
    <select class="fsel" onchange="S.f.finRec={...S.f.finRec,cat:this.value};render()"><option value="">Categoria: Todas</option>${FCATS.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    <select class="fsel" onchange="S.f.finRec={...S.f.finRec,conta:this.value};render()"><option value="">Conta: Todas</option>${CONTAS.map(c=>`<option ${f.conta===c.nome?'selected':''}>${c.nome}</option>`).join('')}</select>
    <select class="fsel" onchange="S.f.finRec={...S.f.finRec,status:this.value};render()"><option value="">Parcelamentos: Todos</option><option value="andamento" ${f.status==='andamento'?'selected':''}>Em andamento</option><option value="quitado" ${f.status==='quitado'?'selected':''}>Quitados</option></select>
    <select class="fsel" onchange="S.sort.finRec={...srt,campo:this.value};render()"><option value="proxima" ${srt.campo==='proxima'?'selected':''}>Ordenar: Próxima data</option><option value="valor" ${srt.campo==='valor'?'selected':''}>Ordenar: Valor</option><option value="nome" ${srt.campo==='nome'?'selected':''}>Ordenar: Nome</option></select>
    <button class="ibtn" title="Inverter ordem" onclick="S.sort.finRec={...srt,dir:srt.dir==='asc'?'desc':'asc'};render()">${srt.dir==='asc'?'↑':'↓'}</button>
    ${(f.cat||f.conta||f.status)?'<button class="btn-sm" onclick="S.f.finRec={};render()">Limpar filtros</button>':''}
    <span style="flex:1"></span>
    <button class="btn-ghost" onclick="openParc()">+ Parcelamento</button><button class="btn-ghost" onclick="openAssin()">+ Assinatura</button>
  </div>`;

  b.innerHTML=toolbar+`<div class="g3">
    <div class="card"><div class="clabel">Compromisso futuro</div><div class="metric">${fmtBRL(compromisso)}</div><div class="metric-s">${ativos.length} parcelamentos ativos</div></div>
    <div class="card"><div class="clabel">Parcelas por mês</div><div class="metric">${fmtBRL(mensalParc)}</div><div class="metric-s">enquanto durarem</div></div>
    <div class="card"><div class="clabel">Assinaturas por mês</div><div class="metric">${fmtBRL(mensalAssin)}</div><div class="metric-s">${as.filter(x=>x.a.ativo!==false).length} ativas</div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="widget-hd"><span class="widget-ttl">Parcelamentos</span><span class="widget-more">${ps.length} exibidos · ${ativos.length} em andamento</span></div>
    ${parcHtml||'<div class="empty-msg">Nenhum parcelamento com esses filtros.</div>'}</div>
    <div class="card"><div class="widget-hd"><span class="widget-ttl">Assinaturas</span><span class="widget-more">${fmtBRL(mensalAssin)}/mês</span></div>
    ${assHtml||'<div class="empty-msg">Nenhuma assinatura com esses filtros.</div>'}</div>
  </div>
  <div class="card" style="font-size:11.5px;color:var(--t3);line-height:1.7;"><b style="color:var(--t2)">Como funciona:</b> Parcelamentos e assinaturas são <b>cadastros próprios</b> — o plano fica registrado (valor total, nº de parcelas, periodicidade) e cada cobrança vira um lançamento quando você clica em "Lançar". É o mesmo modelo do Notion (botões Add Parcela / Add Charge): o histórico reflete só o que realmente aconteceu, e o compromisso futuro fica visível sem poluir o caixa.</div>`;
}
</script>
<script>
/* ═══ AGENDA ═══ */
function renderAgenda(c){
  const days=weekDays();const today=todayStr();
  const dows=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
  c.innerHTML=`
    <div class="page-hd"><div><div class="page-title">Agenda</div></div>
    <div style="display:flex;gap:8px;"><button class="btn-ghost" onclick="exportICS()">↓ Exportar .ics</button><button class="btn-ghost" onclick="openEvento()">+ Novo evento</button></div></div>
    <div style="font-size:11.5px;color:var(--t3);margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap;">
      <span><span class="sdot s-blue"></span>Reunião</span><span><span class="sdot s-red"></span>Gravação</span><span><span class="sdot s-amber"></span>Edição</span><span><span class="sdot s-green"></span>Entrega</span><span><span class="sdot" style="background:#c084fc"></span>Prazo de demanda</span>
    </div>
    <div class="ag-week">${days.map((d,i)=>{
      const ds=dstr(d);
      const evs=S.eventos.filter(e=>e.data===ds).sort((a,b)=>(a.hIni||'').localeCompare(b.hIni||''));
      const przs=S.demandas.filter(x=>x.status!=='Entregue'&&x.prazo===ds);
      return `<div class="ag-day ${ds===today?'today':''}"><div class="ag-dhd">${dows[i]}</div><div class="ag-dnum">${d.getDate()}</div>
      ${evs.map(e=>`<div class="ag-ev ev-${e.tipo.toLowerCase().normalize('NFD').replace(/[^a-z]/g,'')||'outro'}">
        <div class="t">${esc(e.titulo)}</div><div class="h">${e.hIni||''}${e.hFim?'–'+e.hFim:''}${e.local?' · '+esc(e.local):''}</div>
        <div style="display:flex;gap:8px;margin-top:3px;"><a href="${gcalLink(e)}" target="_blank">+ Google Agenda</a><a href="#" onclick="delEvento('${e.id}');return false;">excluir</a></div></div>`).join('')}
      ${przs.map(p=>`<div class="ag-ev ev-prazo"><div class="t">Prazo: ${esc(p.titulo)}</div><div class="h">${esc(p.cliente||'')} · ${p.uid}</div></div>`).join('')}
      ${(!evs.length&&!przs.length)?'<div style="font-size:10.5px;color:var(--t3);padding:4px 0;">—</div>':''}
      </div>`;
    }).join('')}</div>
    <div class="card" style="margin-top:14px;font-size:11.5px;color:var(--t3);line-height:1.7;">
      <b style="color:var(--t2)">Google Agenda:</b> cada evento tem um link "+ Google Agenda" que abre o evento pré-preenchido na sua conta. Para levar tudo de uma vez, use <b>Exportar .ics</b> e importe o arquivo em calendar.google.com → Configurações → Importar. Sincronização automática de mão dupla entra no roadmap quando o hub ganhar backend.
    </div>`;
}
function gcalLink(e){
  const d=e.data.replace(/-/g,'');
  const hi=(e.hIni||'09:00').replace(':','')+'00';
  const hf=(e.hFim||e.hIni||'10:00').replace(':','')+'00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.titulo)+'&dates='+d+'T'+hi+'/'+d+'T'+hf+'&details='+encodeURIComponent('Evento Lozy Hub — '+e.tipo)+(e.local?'&location='+encodeURIComponent(e.local):'');
}
function exportICS(){
  if(!S.eventos.length)return;
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LozyHub//PT-BR'];
  S.eventos.forEach(e=>{
    const d=e.data.replace(/-/g,'');
    lines.push('BEGIN:VEVENT','UID:'+e.id+'@lozyhub','DTSTART:'+d+'T'+((e.hIni||'09:00').replace(':',''))+'00','DTEND:'+d+'T'+((e.hFim||e.hIni||'10:00').replace(':',''))+'00','SUMMARY:'+e.titulo.replace(/[,;]/g,' '),e.local?'LOCATION:'+e.local.replace(/[,;]/g,' '):'','END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const blob=new Blob([lines.filter(Boolean).join('\r\n')],{type:'text/calendar'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lozy-agenda.ics';a.click();
}
function delEvento(id){S.eventos=S.eventos.filter(x=>x.id!==id);save();render();}
function openEvento(){
  openModal('Novo evento',`
    <div class="field"><label>Título</label><input id="m1" placeholder="Ex: Reunião com cliente"></div>
    <div class="f2"><div class="field"><label>Tipo</label><select id="m2">${ETIPOS.map(t=>`<option>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Data</label><input id="m3" type="date" value="${todayStr()}"></div></div>
    <div class="f2"><div class="field"><label>Início</label><input id="m4" type="time" value="14:00"></div>
    <div class="field"><label>Fim</label><input id="m5" type="time" value="15:00"></div></div>
    <div class="field"><label>Local / link</label><input id="m6" placeholder="Sala, endereço ou link da call"></div>`,
  ()=>{const v=k=>document.getElementById(k).value;if(!v('m1').trim())return;
    S.eventos.push({id:uid('e'),titulo:v('m1').trim(),tipo:v('m2'),data:v('m3'),hIni:v('m4'),hFim:v('m5'),local:v('m6').trim()});
    save();closeModal();render();});
}

/* ═══ CENTRO ESTRATÉGICO ═══ */
function renderCentral(c){
  c.innerHTML=`
    <div class="page-hd"><div><div class="page-title">Centro Estratégico</div></div></div>
    ${tabsHtml('central',[{id:'visao',l:'Visão Geral'},{id:'comercial',l:'Comercial'},{id:'producao',l:'Produção'},{id:'financeiro',l:'Financeiro'},{id:'clientes',l:'Clientes'},{id:'crescimento',l:'Crescimento'}])}
    <div id="ce-body"></div>`;
  ({visao:ceVisao,comercial:ceComercial,producao:ceProducao,financeiro:ceFinanceiro,clientes:ceClientes,crescimento:ceCrescimento}[S.tab.central])(document.getElementById('ce-body'));
}
function mesTot(mk){
  return{
    rec:sum(S.fin.filter(f=>f.tipo==='receita'&&f.pago&&monthKey(f.data)===mk),f=>liq(f)),
    desp:sum(S.fin.filter(f=>f.tipo==='despesa'&&f.pago&&mesRef(f)===mk),f=>f.valor)
  };
}
function prevMk(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}

function ceVisao(b){
  const mk=monthKey(todayStr());const cur=mesTot(mk);
  const ganhos=S.leads.filter(l=>l.stage==='Fechado').length;
  const perdidos=S.leads.filter(l=>l.stage==='Perdido').length;
  const conv=(ganhos+perdidos)?ganhos/(ganhos+perdidos)*100:0;
  b.innerHTML=`<div class="g4">
    <div class="card"><div class="clabel">Receita do mês</div><div class="metric">${fmtBRL(cur.rec)}</div></div>
    <div class="card"><div class="clabel">Lucro do mês</div><div class="metric" style="color:${cur.rec-cur.desp<0?'var(--red)':'var(--t1)'}">${fmtBRL(cur.rec-cur.desp)}</div><div class="metric-s">margem ${cur.rec?((cur.rec-cur.desp)/cur.rec*100).toFixed(1):0}%</div></div>
    <div class="card"><div class="clabel">Conversão comercial</div><div class="metric">${conv.toFixed(0)}%</div><div class="metric-s">${ganhos} ganhos / ${perdidos} perdidos</div></div>
    <div class="card"><div class="clabel">Produções ativas</div><div class="metric">${S.projetos.filter(p=>p.fase!=='Entrega').length}</div><div class="metric-s">${S.demandas.filter(d=>d.status!=='Entregue').length} demandas abertas</div></div>
  </div>
  <div class="card" style="font-size:12px;color:var(--t2);line-height:1.7;">Use as abas acima para mergulhar em cada área. Todos os números vêm em tempo real dos módulos — nada é digitado duas vezes.</div>`;
}
function ceComercial(b){
  const novos=S.leads.length;
  const ganhos=S.leads.filter(l=>l.stage==='Fechado');
  const perdidos=S.leads.filter(l=>l.stage==='Perdido').length;
  const conv=(ganhos.length+perdidos)?ganhos.length/(ganhos.length+perdidos)*100:0;
  const ticket=ganhos.length?sum(ganhos)/ganhos.length:0;
  const emNeg=S.leads.filter(l=>l.stage==='Negociação');
  const maxV=Math.max(1,...STAGES.map(st=>sum(S.leads.filter(l=>l.stage===st))));
  b.innerHTML=`<div class="g4">
    <div class="card"><div class="clabel">Leads totais</div><div class="metric">${novos}</div></div>
    <div class="card"><div class="clabel">Conversão</div><div class="metric">${conv.toFixed(0)}%</div><div class="metric-s">${ganhos.length} ganhos / ${perdidos} perdidos</div></div>
    <div class="card"><div class="clabel">Ticket médio</div><div class="metric">${fmtBRL(ticket)}</div></div>
    <div class="card"><div class="clabel">Em negociação</div><div class="metric">${fmtBRL(sum(emNeg))}</div><div class="metric-s">${emNeg.length} conversas</div></div>
  </div>
  <div class="card"><div class="widget-hd"><span class="widget-ttl">Funil comercial</span></div>
  ${STAGES.map(st=>{const ls=S.leads.filter(l=>l.stage===st);const v=sum(ls);
  return `<div style="display:flex;align-items:center;gap:12px;padding:7px 0;"><div style="width:120px;font-size:12px;color:var(--t2)">${st}</div>
  <div style="flex:1;height:5px;background:rgba(0,0,0,.09);border-radius:99px;overflow:hidden;"><div style="height:100%;background:var(--t1);border-radius:99px;width:${Math.round(v/maxV*100)}%"></div></div>
  <div style="min-width:110px;text-align:right;font-size:11.5px;color:var(--t3)">${ls.length} · ${fmtBRL(v)}</div></div>`;}).join('')}</div>`;
}
function ceProducao(b){
  const concl=S.projetos.filter(p=>p.fase==='Entrega').length;
  const atras=S.projetos.filter(p=>p.entrega&&p.fase!=='Entrega'&&prazoStatus(p.entrega)?.cls==='atrasada').length;
  const tkC=S.tasks.filter(t=>t.status==='Concluída').length;
  const tkP=S.tasks.length-tkC;
  const demAtras=S.demandas.filter(d=>d.status!=='Entregue'&&d.prazo&&prazoStatus(d.prazo)?.cls==='atrasada').length;
  b.innerHTML=`<div class="g4">
    <div class="card"><div class="clabel">Projetos ativos</div><div class="metric">${S.projetos.filter(p=>p.fase!=='Entrega').length}</div></div>
    <div class="card"><div class="clabel">Concluídos</div><div class="metric">${concl}</div></div>
    <div class="card"><div class="clabel">Atrasados</div><div class="metric" style="color:${atras?'var(--red)':'var(--t1)'}">${atras}</div><div class="metric-s">${demAtras} demandas atrasadas</div></div>
    <div class="card"><div class="clabel">Tarefas</div><div class="metric">${tkC}<span style="color:var(--t3);font-size:14px"> / ${tkC+tkP}</span></div><div class="metric-s">concluídas / total</div></div>
  </div>
  <div class="card"><div class="widget-hd"><span class="widget-ttl">Demandas por status</span></div>
  ${DSTATUS.map(st=>{const n=S.demandas.filter(d=>d.status===st).length;const mx=Math.max(1,S.demandas.length);
  return `<div style="display:flex;align-items:center;gap:12px;padding:7px 0;"><div style="width:120px;font-size:12px;color:var(--t2)">${st}</div>
  <div style="flex:1;height:5px;background:rgba(0,0,0,.09);border-radius:99px;"><div style="height:100%;background:var(--t1);border-radius:99px;width:${Math.round(n/mx*100)}%"></div></div>
  <div style="min-width:40px;text-align:right;font-size:11.5px;color:var(--t3)">${n}</div></div>`;}).join('')}</div>`;
}
function ceFinanceiro(b){
  const mk=monthKey(todayStr());
  const rec=S.fin.filter(f=>f.tipo==='receita');
  const desp=S.fin.filter(f=>f.tipo==='despesa');
  const recebido=sum(rec.filter(f=>f.pago&&monthKey(f.data)===mk),f=>liq(f));
  const aReceber=sum(rec.filter(f=>!f.pago),f=>liq(f));
  const pago=sum(desp.filter(f=>f.pago&&mesRef(f)===mk),f=>f.valor);
  const aPagar=sum(desp.filter(f=>!f.pago),f=>f.valor);
  const atrasR=sum(rec.filter(f=>!f.pago&&f.data&&prazoStatus(f.data)?.cls==='atrasada'),f=>liq(f));
  const atrasP=sum(desp.filter(f=>!f.pago&&f.data&&prazoStatus(f.data)?.cls==='atrasada'),f=>f.valor);
  const fixo=sum(desp.filter(f=>f.natureza==='Fixo'&&mesRef(f)===mk),f=>f.valor);
  const varv=sum(desp.filter(f=>f.natureza==='Variável'&&mesRef(f)===mk),f=>f.valor);
  b.innerHTML=`<div class="g3">
    <div class="card"><div class="clabel">Recebido (mês)</div><div class="metric" style="color:var(--green)">${fmtBRL(recebido)}</div><div class="metric-s">${fmtBRL(aReceber)} a receber · <span style="color:var(--red)">${fmtBRL(atrasR)} atrasado</span></div></div>
    <div class="card"><div class="clabel">Pago (mês)</div><div class="metric" style="color:var(--red)">${fmtBRL(pago)}</div><div class="metric-s">${fmtBRL(aPagar)} a pagar · <span style="color:var(--red)">${fmtBRL(atrasP)} atrasado</span></div></div>
    <div class="card"><div class="clabel">Saldo previsto</div><div class="metric">${fmtBRL(recebido+aReceber-pago-aPagar)}</div><div class="metric-s">margem realizada ${recebido?((recebido-pago)/recebido*100).toFixed(1):0}%</div></div>
  </div>
  <div class="card"><div class="widget-hd"><span class="widget-ttl">Estrutura de custos do mês</span><span class="widget-more">Natureza — regra Central Lozy</span></div>
  <div style="display:flex;gap:12px;">
    <div style="flex:1"><div class="clabel">Fixo</div><div class="metric" style="font-size:18px">${fmtBRL(fixo)}</div></div>
    <div style="flex:1"><div class="clabel">Variável</div><div class="metric" style="font-size:18px">${fmtBRL(varv)}</div></div>
    <div style="flex:1"><div class="clabel">Fixo / Receita</div><div class="metric" style="font-size:18px">${recebido?(fixo/recebido*100).toFixed(0):0}%</div></div>
  </div></div>`;
}
function ceClientes(b){
  const map={};
  S.fin.filter(f=>f.tipo==='receita').forEach(f=>{const k=f.cliente||'Sem cliente';map[k]=map[k]||{rec:0,desp:0};map[k].rec+=liq(f);});
  S.fin.filter(f=>f.tipo==='despesa'&&f.cliente).forEach(f=>{map[f.cliente]=map[f.cliente]||{rec:0,desp:0};map[f.cliente].desp+=Number(f.valor);});
  const top=Object.entries(map).sort((a,b)=>b[1].rec-a[1].rec).slice(0,8);
  const topL=Object.entries(map).sort((a,b)=>(b[1].rec-b[1].desp)-(a[1].rec-a[1].desp)).slice(0,8);
  b.innerHTML=`<div class="g3">
    <div class="card"><div class="clabel">Total de clientes</div><div class="metric">${clientes().length}</div></div>
    <div class="card"><div class="clabel">Com receita registrada</div><div class="metric">${Object.keys(map).filter(k=>map[k].rec>0).length}</div></div>
    <div class="card"><div class="clabel">Projetos por cliente</div><div class="metric">${clientes().length?(S.projetos.length/clientes().length).toFixed(1):0}</div><div class="metric-s">média</div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="widget-hd"><span class="widget-ttl">Top por receita</span></div>
    ${top.length?top.map(([cl,v])=>`<div class="row-item"><div class="ri-name">${esc(cl)}</div><div class="ri-val" style="color:var(--green)">${fmtBRL(v.rec)}</div></div>`).join(''):'<div class="empty-msg">Sem receitas por cliente ainda.</div>'}</div>
    <div class="card"><div class="widget-hd"><span class="widget-ttl">Top por resultado</span></div>
    ${topL.length?topL.map(([cl,v])=>`<div class="row-item"><div class="ri-name">${esc(cl)}</div><div class="ri-val" style="color:${v.rec-v.desp<0?'var(--red)':'var(--green)'}">${fmtBRL(v.rec-v.desp)}</div></div>`).join(''):'<div class="empty-msg">Sem dados suficientes.</div>'}</div>
  </div>`;
}
function ceCrescimento(b){
  const mk=monthKey(todayStr());const pv=prevMk();
  const cur=mesTot(mk),ant=mesTot(pv);
  const dRec=ant.rec?((cur.rec-ant.rec)/ant.rec*100):null;
  const lCur=cur.rec-cur.desp,lAnt=ant.rec-ant.desp;
  const dLuc=lAnt?((lCur-lAnt)/Math.abs(lAnt)*100):null;
  const months=[];const d=new Date();d.setDate(1);
  for(let i=5;i>=0;i--){const m=new Date(d);m.setMonth(m.getMonth()-i);months.push(m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0'));}
  const serie=months.map(m=>({m,...mesTot(m)}));
  const mx=Math.max(1,...serie.map(x=>Math.max(x.rec,x.rec-x.desp,0)));
  const bars=(get,color)=>`<div class="chart-bars" style="height:110px">${serie.map(x=>`<div class="cb-group"><div class="cb" style="background:${color};height:${Math.max(2,Math.max(0,get(x))/mx*100)}%"></div></div>`).join('')}</div>
  <div class="chart-lbls">${serie.map(x=>{const[y,m]=x.m.split('-');return '<span>'+new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</span>';}).join('')}</div>`;
  b.innerHTML=`<div class="g2">
    <div class="card"><div class="clabel">Receita</div><div class="metric">${fmtBRL(cur.rec)}</div><div class="metric-s">${dRec===null?'sem base de comparação':'<span style="color:'+(dRec>=0?'var(--green)':'var(--red)')+'">'+(dRec>=0?'▲':'▼')+' '+Math.abs(dRec).toFixed(1)+'%</span> vs mês anterior'}</div></div>
    <div class="card"><div class="clabel">Lucro</div><div class="metric" style="color:${lCur<0?'var(--red)':'var(--t1)'}">${fmtBRL(lCur)}</div><div class="metric-s">${dLuc===null?'sem base de comparação':'<span style="color:'+(dLuc>=0?'var(--green)':'var(--red)')+'">'+(dLuc>=0?'▲':'▼')+' '+Math.abs(dLuc).toFixed(1)+'%</span> vs mês anterior'}</div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="widget-hd"><span class="widget-ttl">Receita — últimos 6 meses</span></div>${bars(x=>x.rec,'var(--t1)')}</div>
    <div class="card"><div class="widget-hd"><span class="widget-ttl">Lucro — últimos 6 meses</span></div>${bars(x=>x.rec-x.desp,'var(--t2)')}</div>
  </div>`;
}
</script>
<script>
/* ═══ PROPOSTAS (com calculadora Lozy) ═══ */
function renderPropostas(c){
  if(S.tab.propostas==='nova'&&S.wiz)return renderWizard(c);
  const ps=[...S.propostas].sort((a,b)=>String(b.criada).localeCompare(a.criada));
  c.innerHTML=`
    <div class="page-hd"><div><div class="page-title">Propostas</div></div>
    <button class="btn" onclick="startWizard()">+ Nova proposta</button></div>
    ${ps.length?`<div class="toolbar">${colBtn('propostas')}${csvBtn('propostas',ps)}</div><div class="card" style="padding:6px 20px;">${renderDataTable('propostas',applyTableSort('propostas',ps),p=>`<button class="ibtn" title="baixar HTML" onclick="downloadProp('${p.id}')">↓</button><button class="ibtn" title="visualizar" onclick="previewProp('${p.id}')">👁</button><button class="ibtn del" onclick="delProp('${p.id}')">✕</button>`)}</div>`
    :`<div class="card"><div class="empty-msg">Nenhuma proposta criada ainda. O construtor usa a tabela de preços da Calculadora Lozy — captação, edição, fotos e deslocamento.</div></div>`}`;
}
function cycleProp(id){const p=S.propostas.find(x=>x.id===id);const st=['Rascunho','Enviada','Aprovada','Recusada'];p.status=st[(st.indexOf(p.status)+1)%st.length];save();render();}
function delProp(id){S.propostas=S.propostas.filter(x=>x.id!==id);save();render();}

function startWizard(){
  S.wiz={step:0,empresa:'',cliente:'',projeto:'',formato:'Projeto Personalizado',conceito:'',entregas:[],desconto:0,desloc:0,modo:'cliente',validade:(()=>{const d=new Date();d.setDate(d.getDate()+30);return dstr(d);})()};
  S.tab.propostas='nova';render();
}
const WSTEPS=['Geral','Conceito','Escopo','Investimento','Resultado'];
function wStep(n){S.wiz.step=n;render();}
function renderWizard(c){
  const w=S.wiz;
  const inv=calcInvest(w);
  let body='';
  if(w.step===0)body=`
    <div class="field"><label>Cliente (pessoa)</label><input id="w1" value="${esc(w.cliente)}" placeholder="Nome da pessoa" oninput="S.wiz.cliente=this.value"></div>
    <div class="field"><label>Empresa ou marca</label><input id="w2" value="${esc(w.empresa)}" placeholder="Nome da empresa" oninput="S.wiz.empresa=this.value"></div>
    <div class="field"><label>Nome do projeto</label><input id="w3" value="${esc(w.projeto)}" placeholder="Ex: Conteúdo mensal — Redes sociais" oninput="S.wiz.projeto=this.value"></div>
    <div class="field"><label>Formato</label><select id="w4" onchange="S.wiz.formato=this.value">${['Projeto Personalizado','Conteúdo Mensal','Vídeo Institucional','Evento','Captação','Edição','Fotografia'].map(f=>`<option ${w.formato===f?'selected':''}>${f}</option>`).join('')}</select></div>`;
  else if(w.step===1)body=`
    <div class="field"><label>Frase de abertura</label><input id="w5" value="${esc(w.conceito.split('\n')[0]||'')}" placeholder="A ideia principal da proposta..." oninput="S.wiz.conceito=this.value+'\\n'+(S.wiz.conceito.split('\\n').slice(1).join('\\n'))"></div>
    <div class="field"><label>Contexto do projeto</label><textarea id="w6" rows="5" placeholder="O momento do cliente, o desafio e a proposta criativa..." oninput="S.wiz.conceito=(S.wiz.conceito.split('\\n')[0]||'')+'\\n'+this.value">${esc(w.conceito.split('\n').slice(1).join('\n'))}</textarea></div>`;
  else if(w.step===2)body=`
    <div style="font-size:11.5px;color:var(--t3);margin-bottom:10px;">Adicione entregas pela tabela Lozy (valores oficiais da calculadora) ou crie itens personalizados.</div>
    <div class="preset-pills">${PRESETS.map((p,i)=>`<button class="ppill" onclick="addPreset(${i})">${p.n} · ${fmtBRL(p.v)}</button>`).join('')}</div>
    ${w.entregas.map((e,i)=>`<div class="entrega-row">
      <input class="task-input" value="${esc(e.nome)}" oninput="S.wiz.entregas[${i}].nome=this.value">
      <input class="task-input" type="number" min="1" value="${e.qtd}" oninput="S.wiz.entregas[${i}].qtd=Number(this.value)||1;refreshInv()">
      <input class="task-input" type="number" step="0.01" value="${e.valor}" oninput="S.wiz.entregas[${i}].valor=Number(this.value)||0;refreshInv()">
      <button class="ibtn del" onclick="S.wiz.entregas.splice(${i},1);render()">✕</button></div>`).join('')}
    <button class="btn-sm" onclick="S.wiz.entregas.push({nome:'',qtd:1,valor:0});render()">+ Entrega personalizada</button>`;
  else if(w.step===3)body=`
    <div class="f2">
      <div class="field"><label>Desconto sobre serviço (%)</label><input type="number" min="0" max="50" value="${w.desconto}" oninput="S.wiz.desconto=Number(this.value)||0;refreshInv()"></div>
      <div class="field"><label>Deslocamento (R$) — fora do desconto</label><input type="number" step="0.01" value="${w.desloc}" oninput="S.wiz.desloc=Number(this.value)||0;refreshInv()"></div>
    </div>
    <div class="f2">
      <div class="field"><label>Como os valores aparecem para o cliente?</label><select onchange="S.wiz.modo=this.value">
        <option value="cliente" ${w.modo==='cliente'?'selected':''}>Somente investimento total</option>
        <option value="detalhado" ${w.modo==='detalhado'?'selected':''}>Detalhar valores por entrega</option></select></div>
      <div class="field"><label>Proposta válida até</label><input type="date" value="${w.validade}" onchange="S.wiz.validade=this.value"></div>
    </div>
    <div class="inv-box" id="inv-box">${invBox(inv,w)}</div>
    <div style="font-size:11px;color:var(--t3);margin-top:8px;">Regras Lozy aplicadas: desconto incide só sobre serviço (nunca sobre deslocamento) · mínimos captação R$650 / edição R$160 · sinal de 40% da captação para reservar a data · validade 30 dias.</div>`;
  else body=`
    <div class="inv-box">${invBox(inv,w)}</div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">
      <button class="btn" onclick="saveProposta()">Salvar proposta</button>
      <button class="btn-ghost" onclick="saveProposta(true)">Salvar + baixar HTML</button>
    </div>
    <div style="font-size:11.5px;color:var(--t3);margin-top:12px;">O HTML gerado é uma página standalone com a identidade Lozy — envie o arquivo direto pro cliente ou hospede no seu domínio.</div>`;

  c.innerHTML=`
    <div class="page-hd"><div><div class="page-title">${w.projeto||'Vamos construir sua proposta'}</div></div>
    <button class="btn-ghost" onclick="S.wiz=null;S.tab.propostas='lista';render()">← Voltar</button></div>
    <div class="wiz-steps">${WSTEPS.map((s,i)=>`<div class="wstep ${i<w.step?'done':i===w.step?'cur':''}" style="cursor:pointer" onclick="wStep(${i})"><span class="n">${i<w.step?'✓':i+1}</span>${s}</div>`).join('')}</div>
    <div class="wiz-body card">${body}</div>
    <div class="wiz-nav">
      <button class="btn-ghost" ${w.step===0?'style="visibility:hidden"':''} onclick="wStep(${w.step-1})">Anterior</button>
      ${w.step<WSTEPS.length-1?`<button class="btn" onclick="wStep(${w.step+1})">Próximo</button>`:''}
    </div>`;
}
function addPreset(i){const p=PRESETS[i];S.wiz.entregas.push({nome:p.n,qtd:1,valor:p.v});render();}
function calcInvest(w){
  const serv=w.entregas.reduce((a,e)=>a+e.qtd*e.valor,0);
  const desc=serv*(w.desconto/100);
  const total=serv-desc+Number(w.desloc||0);
  return{serv,desc,total};
}
function invBox(inv,w){
  return `<div class="inv-line"><span>Serviços (${w.entregas.length} entregas)</span><span>${fmtBRL2(inv.serv)}</span></div>
  ${inv.desc?`<div class="inv-line"><span>Desconto (${w.desconto}%)</span><span>−${fmtBRL2(inv.desc)}</span></div>`:''}
  ${w.desloc?`<div class="inv-line"><span>Deslocamento</span><span>${fmtBRL2(Number(w.desloc))}</span></div>`:''}
  <div class="inv-line total"><span>Investimento total</span><span>${fmtBRL2(inv.total)}</span></div>`;
}
function refreshInv(){const el=document.getElementById('inv-box');if(el)el.innerHTML=invBox(calcInvest(S.wiz),S.wiz);}
function saveProposta(dl){
  const w=S.wiz;const inv=calcInvest(w);
  const p={id:uid('pp'),empresa:w.empresa,cliente:w.cliente,projeto:w.projeto||'Proposta Lozy',formato:w.formato,conceito:w.conceito,entregas:w.entregas,desconto:w.desconto,desloc:w.desloc,modo:w.modo,investimento:inv.total,validade:w.validade,status:'Rascunho',criada:todayStr()};
  S.propostas.push(p);save();
  S.wiz=null;S.tab.propostas='lista';render();
  if(dl)downloadProp(p.id);
}
function propHTML(p){
  const linhas=p.modo==='detalhado'
    ?p.entregas.map(e=>'<tr><td>'+esc(e.nome)+'</td><td class="c">'+e.qtd+'</td><td class="r">'+fmtBRL2(e.qtd*e.valor)+'</td></tr>').join('')
    :p.entregas.map(e=>'<tr><td>'+esc(e.nome)+'</td><td class="c">'+e.qtd+'</td><td class="r">—</td></tr>').join('');
  const conc=p.conceito.split('\n');
  return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proposta — '+esc(p.projeto)+'</title>'+
  '<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#0a0a0a;color:#f5f5f5;line-height:1.6}'+
  '.wrap{max-width:720px;margin:0 auto;padding:60px 24px}'+
  '.mark{width:44px;height:44px;border-radius:12px;background:#f5f5f5;color:#0a0a0a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;margin-bottom:36px}'+
  'h1{font-size:30px;font-weight:650;letter-spacing:-.03em;margin-bottom:6px}'+
  '.sub{color:#a3a3a3;font-size:14px;margin-bottom:44px}'+
  'h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#6b6b6b;margin:40px 0 14px;font-weight:600}'+
  '.lead{font-size:19px;font-weight:550;letter-spacing:-.01em;margin-bottom:10px}'+
  'p{color:#c9c9c9;font-size:14.5px}'+
  'table{width:100%;border-collapse:collapse;margin-top:6px}'+
  'td,th{padding:12px 0;border-bottom:1px solid #222;font-size:14px;text-align:left}'+
  'td.c{text-align:center;color:#a3a3a3}td.r{text-align:right}'+
  '.inv{background:#141414;border:1px solid #262626;border-radius:16px;padding:24px;margin-top:14px}'+
  '.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:650;letter-spacing:-.02em;padding-top:14px;border-top:1px solid #2a2a2a;margin-top:10px}'+
  '.cond{font-size:12.5px;color:#8a8a8a;line-height:1.8}'+
  '.foot{margin-top:56px;padding-top:20px;border-top:1px solid #1e1e1e;color:#6b6b6b;font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}'+
  'details{border-bottom:1px solid #222}summary{padding:12px 0;cursor:pointer;font-size:14px;font-weight:500;list-style:none}summary::after{content:"+";float:right;color:#6b6b6b}details[open] summary::after{content:"−"}details p{padding:0 0 14px;font-size:13px}'+
  '@media print{body{background:#fff;color:#111}.inv{background:#f5f5f5;border-color:#ddd}td,th{border-color:#ddd}p{color:#333}.sub,.cond{color:#666}}</style></head><body><div class="wrap">'+
  '<div class="mark">L</div>'+
  '<h1>'+esc(p.projeto)+'</h1>'+
  '<div class="sub">Proposta para '+esc(p.empresa||p.cliente)+' · '+p.formato+' · válida até '+new Date(p.validade+'T00:00:00').toLocaleDateString('pt-BR')+'</div>'+
  (conc[0]?'<h2>Conceito</h2><div class="lead">'+esc(conc[0])+'</div>'+(conc.slice(1).join(' ').trim()?'<p>'+esc(conc.slice(1).join(' '))+'</p>':''):'')+
  '<h2>Escopo e entregas</h2><table><thead><tr><th>Entrega</th><th style="text-align:center">Qtd</th><th style="text-align:right">Valor</th></tr></thead><tbody>'+linhas+'</tbody></table>'+
  '<h2>Investimento</h2><div class="inv">'+
  (p.modo==='detalhado'&&p.desconto?'<div style="display:flex;justify-content:space-between;font-size:14px;color:#a3a3a3;padding:3px 0"><span>Desconto aplicado</span><span>'+p.desconto+'%</span></div>':'')+
  (p.desloc?'<div style="display:flex;justify-content:space-between;font-size:14px;color:#a3a3a3;padding:3px 0"><span>Deslocamento</span><span>'+fmtBRL2(p.desloc)+'</span></div>':'')+
  '<div class="tot"><span>Investimento total</span><span>'+fmtBRL2(p.investimento)+'</span></div></div>'+
  '<h2>Condições</h2><div class="cond">Sinal de 40% da captação para reserva da data — reagendável sem custo até 48h antes.<br>Edição paga na entrega · 2 revisões inclusas por vídeo.<br>Impostos já considerados — os valores desta proposta são finais.<br>Proposta válida por 30 dias a partir do envio.</div>'+

<script>
/* ═══════════════════════════════════════════════════════════════
   SINCRONIZAÇÃO — Supabase
   Estratégia: diff por registro contra um snapshot do último sync.
   Só o que mudou sobe; o que mudou no servidor desce. Conflito no
   mesmo registro resolve por updated_at (o mais recente vence).
   Sem backend configurado, o Hub segue funcionando local.
   ═══════════════════════════════════════════════════════════════ */
const SYNC_KINDS=['leads','contatos','followups','demandas','tasks','projetos','fin','eventos','propostas','cbase','parc','assin'];
const SETTING_KEYS=['theme','prefs','dash','cols','sort'];
let SY={busy:false,last:null,err:null,snap:{}};

function syncCfg(){return (S.prefs&&S.prefs.sb_url)?{url:S.prefs.sb_url,key:S.prefs.sb_key,token:S.prefs.sb_token,refresh:S.prefs.sb_refresh,email:S.prefs.sb_email}:null;}
function syncOn(){const c=syncCfg();return !!(c&&c.url&&c.key&&c.token);}

async function sbFetch(path,opts={}){
  const c=syncCfg();if(!c)throw new Error('sem configuração');
  const r=await fetch(c.url.replace(/\/$/,'')+path,{...opts,headers:{
    'apikey':c.key,'Authorization':'Bearer '+c.token,
    'Content-Type':'application/json',...(opts.headers||{})}});
  if(r.status===401){const ok=await sbRefresh();if(ok)return sbFetch(path,opts);throw new Error('sessão expirada — entre novamente');}
  if(!r.ok)throw new Error('HTTP '+r.status+' — '+(await r.text()).slice(0,140));
  /* upsert com return=minimal responde 201/204 sem corpo — nada a interpretar */
  if(r.status===204)return null;
  const txt=await r.text();
  if(!txt||!txt.trim())return null;
  try{return JSON.parse(txt);}catch(e){return null;}
}
async function sbRefresh(){
  const c=syncCfg();if(!c||!c.refresh)return false;
  try{
    const r=await fetch(c.url.replace(/\/$/,'')+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:{'apikey':c.key,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:c.refresh})});
    if(!r.ok)return false;
    const t=await r.text();if(!t)return false;
    const d=JSON.parse(t);
    S.prefs.sb_token=d.access_token;S.prefs.sb_refresh=d.refresh_token;save();
    return true;
  }catch(e){return false;}
}
async function sbLogin(url,key,email,senha){
  const r=await fetch(url.replace(/\/$/,'')+'/auth/v1/token?grant_type=password',{
    method:'POST',headers:{'apikey':key,'Content-Type':'application/json'},
    body:JSON.stringify({email,password:senha})});
  const t=await r.text();
  let d={};try{d=t?JSON.parse(t):{};}catch(e){}
  if(!r.ok)throw new Error(d.error_description||d.msg||d.message||('falha na autenticação (HTTP '+r.status+')'));
  if(!d.access_token)throw new Error('resposta sem token — confira URL e anon key');
  S.prefs={...S.prefs,sb_url:url,sb_key:key,sb_email:email,sb_token:d.access_token,sb_refresh:d.refresh_token};
  save();return true;
}
function sbLogout(){
  ['sb_token','sb_refresh','sb_email'].forEach(k=>delete S.prefs[k]);
  SY.snap={};SY.last=null;save();render();
}

/* ── snapshot: fotografia do estado no último sync bem-sucedido ── */
function snapshot(){
  const m={};
  SYNC_KINDS.forEach(k=>(S[k]||[]).forEach(r=>{if(r&&r.id)m[k+'|'+r.id]=JSON.stringify(r);}));
  return m;
}
async function loadSnap(){
  try{const r=await Store.get('lozy-sync-snap');if(r&&r.value){const d=JSON.parse(r.value);SY.snap=d.snap||{};SY.last=d.last||null;}}catch(e){}
}
async function saveSnap(){
  try{await Store.set('lozy-sync-snap',JSON.stringify({snap:SY.snap,last:SY.last}));}catch(e){}
}

async function doSync(silent){
  if(!syncOn()||SY.busy)return;
  SY.busy=true;SY.err=null;if(!silent)render();
  let etapa='conexão';
  try{
    /* 1. DESCE o que mudou no servidor desde o último sync */
    etapa='baixar alterações';
    const since=SY.last?`&updated_at=gt.${encodeURIComponent(SY.last)}`:'';
    const remoto=await sbFetch(`/rest/v1/lozy_records?select=id,kind,data,updated_at,deleted&order=updated_at.asc${since}`);
    const agora=new Date().toISOString();
    const cur=snapshot();
    (remoto||[]).forEach(row=>{
      const arr=S[row.kind];if(!Array.isArray(arr))return;
      const i=arr.findIndex(x=>x&&x.id===row.id);
      const localMudou=cur[row.kind+'|'+row.id]!==SY.snap[row.kind+'|'+row.id];
      if(row.deleted){ if(i>=0&&!localMudou)arr.splice(i,1); return; }
      /* se o registro também mudou localmente, o servidor só vence se for mais novo */
      if(i>=0&&localMudou)return;
      if(i>=0)arr[i]=row.data;else arr.push(row.data);
    });

    /* 2. SOBE o que mudou aqui */
    etapa='enviar alterações';
    const depois=snapshot();
    const up=[];
    Object.keys(depois).forEach(k=>{
      if(depois[k]!==SY.snap[k]){
        const[kind,...rest]=k.split('|');
        up.push({id:rest.join('|'),kind,data:JSON.parse(depois[k]),deleted:false});
      }
    });
    const del=Object.keys(SY.snap).filter(k=>!(k in depois)).map(k=>{
      const[kind,...rest]=k.split('|');
      return{id:rest.join('|'),kind,data:{},deleted:true};
    });
    const payload=[...up,...del];
    for(let i=0;i<payload.length;i+=200){
      await sbFetch('/rest/v1/lozy_records',{method:'POST',
        headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
        body:JSON.stringify(payload.slice(i,i+200))});
    }

    /* 3. Configurações (tema, colunas, widgets) */
    etapa='salvar configurações';
    const cfg=SETTING_KEYS.map(k=>({key:k,value:S[k]===undefined?null:(k==='prefs'?sanitizePrefs(S.prefs):S[k])})).filter(x=>x.value!==null);
    if(cfg.length)await sbFetch('/rest/v1/lozy_settings',{method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(cfg)});

    SY.snap=snapshot();SY.last=agora;
    await saveSnap();save();
  }catch(e){
    SY.err='['+etapa+'] '+e.message;
    console.error('[Lozy sync]',etapa,e);
  }
  SY.busy=false;
  if(silent)renderSyncPill();else render();
}
/* nunca enviar tokens de sessão para a tabela de configurações */
function sanitizePrefs(p){
  const o={...(p||{})};
  ['sb_token','sb_refresh','sb_key','sb_url','sb_email'].forEach(k=>delete o[k]);
  return o;
}
/* primeira sincronização em máquina nova: puxa tudo */
async function syncPullAll(){
  if(!syncOn())return;
  SY.busy=true;render();
  try{
    const rows=await sbFetch('/rest/v1/lozy_records?select=id,kind,data,deleted&deleted=is.false');
    SYNC_KINDS.forEach(k=>{if(Array.isArray(S[k]))S[k]=[];});
    (rows||[]).forEach(r=>{if(Array.isArray(S[r.kind]))S[r.kind].push(r.data);});
    const cfg=await sbFetch('/rest/v1/lozy_settings?select=key,value');
    (cfg||[]).forEach(c=>{if(SETTING_KEYS.includes(c.key)&&c.value){
      if(c.key==='prefs')S.prefs={...S.prefs,...c.value};else S[c.key]=c.value;}});
    SY.snap=snapshot();SY.last=new Date().toISOString();
    await saveSnap();save();applyTheme();
  }catch(e){SY.err=e.message;}
  SY.busy=false;render();
}

/* ── indicador visual no topo ── */
function renderSyncPill(){
  const el=document.getElementById('sync-pill');if(!el)return;
  if(!syncOn()){el.innerHTML='<span class="badge-ver" title="Dados salvos apenas neste dispositivo">● local</span>';return;}
  if(SY.busy){el.innerHTML='<span class="badge-ver">↻ sincronizando…</span>';return;}
  if(SY.err){el.innerHTML=`<span class="badge-ver" style="color:var(--red)" title="${esc(SY.err)}">⚠ erro</span>`;return;}
  const h=SY.last?new Date(SY.last).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'—';
  el.innerHTML=`<span class="badge-ver" style="cursor:pointer" onclick="doSync()" title="Clique para sincronizar agora">✓ sync ${h}</span>`;
}
/* auto-sync: ao voltar para a aba e a cada 2 min */
function startAutoSync(){
  setInterval(()=>{if(syncOn()&&!document.hidden)doSync(true);},120000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&syncOn())doSync(true);});
  window.addEventListener('online',()=>{if(syncOn())doSync(true);});
}

/* ── painel de configuração (usado em Ajustes) ── */
function syncPanel(){
  const c=syncCfg();
  if(!syncOn())return `
    <div style="font-size:12px;color:var(--t2);line-height:1.7;margin-bottom:14px;">
      Hoje seus dados vivem <b>apenas neste navegador</b>. Conectando um projeto Supabase, o mesmo Hub passa a abrir sincronizado no computador e no celular.
      <br><span style="color:var(--t3)">Antes: rode o arquivo <b>supabase-schema.sql</b> no SQL Editor do seu projeto e crie seu usuário em Authentication → Users.</span>
    </div>
    <div class="f2">
      <div class="field"><label>Project URL</label><input id="sb1" placeholder="https://xxxx.supabase.co" value="${esc(c?.url)}"></div>
      <div class="field"><label>Anon key</label><input id="sb2" placeholder="eyJhbGciOi..." value="${esc(c?.key)}"></div>
    </div>
    <div class="f2">
      <div class="field"><label>E-mail</label><input id="sb3" type="email" value="${esc(c?.email)}"></div>
      <div class="field"><label>Senha</label><input id="sb4" type="password" placeholder="sua senha do Supabase"></div>
    </div>
    <button class="btn" onclick="syncConnect()">Conectar e sincronizar</button>
    <div id="sb-msg" style="font-size:11.5px;color:var(--red);margin-top:10px;"></div>`;
  return `
    <div style="font-size:12px;color:var(--t2);line-height:1.7;margin-bottom:14px;">
      Conectado como <b>${esc(c.email)}</b>. Sincroniza sozinho a cada 2 minutos e sempre que você volta para a aba.
      ${SY.last?`<br><span style="color:var(--t3)">Último sync: ${new Date(SY.last).toLocaleString('pt-BR')}</span>`:''}
      ${SY.err?`<br><span style="color:var(--red)">Erro: ${esc(SY.err)}</span>`:''}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn" onclick="doSync()">${SY.busy?'Sincronizando…':'Sincronizar agora'}</button>
      <button class="btn-sm" onclick="if(confirm('Baixar tudo do servidor e substituir os dados deste dispositivo?'))syncPullAll()">↓ Baixar tudo do servidor</button>
      <button class="btn-sm" onclick="sbLogout()">Desconectar</button>
    </div>`;
}
async function syncConnect(){
  const v=k=>document.getElementById(k).value.trim();
  const msg=document.getElementById('sb-msg');
  msg.textContent='Conectando…';msg.style.color='var(--t3)';
  try{
    await sbLogin(v('sb1'),v('sb2'),v('sb3'),document.getElementById('sb4').value);
    await loadSnap();
    await doSync();
    render();
  }catch(e){msg.textContent=e.message;msg.style.color='var(--red)';}
}
</script>
<script>
/* ═══ CLIENTES ═══ */
function cliStats(nome){
  const dems=S.demandas.filter(d=>d.cliente===nome);
  const rec=sum(S.fin.filter(f=>f.tipo==='receita'&&f.cliente===nome),f=>liq(f));
  const desp=sum(S.fin.filter(f=>f.tipo==='despesa'&&f.cliente===nome),f=>f.valor);
  return{dems:dems.length,abertas:dems.filter(d=>d.status!=='Entregue').length,rec,res:rec-desp,projetos:S.projetos.filter(p=>p.cliente===nome).length};
}
function allClientes(){
  const nomes=new Set(S.cbase.map(c=>c.nome));
  const extras=clientes().filter(n=>!nomes.has(n)).map(n=>({id:'x'+n,nome:n,email:'',tel:'',instagram:'',segmento:'',cidade:'',notas:'',derived:true}));
  return[...S.cbase,...extras];
}
function renderClientes(c){
  const q=(S.q.cli||'').toLowerCase();
  let cs=allClientes().filter(x=>!q||[x.nome,x.segmento,x.email,x.instagram].join(' ').toLowerCase().includes(q));
  cs.sort((a,b)=>a.nome.localeCompare(b.nome));
  c.innerHTML=`
    <div class="page-hd"><div><div class="page-title">Clientes</div></div>
    <button class="btn-ghost" onclick="openCliente()">+ Novo cliente</button></div>
    ${tabsHtml('clientes',[{id:'cards',l:'Cards'},{id:'lista',l:'Lista'},{id:'porreceita',l:'Por receita'}])}
    <div class="toolbar"><input class="search" placeholder="Buscar cliente, segmento, contato..." value="${esc(S.q.cli||'')}" oninput="S.q.cli=this.value;render();setTimeout(()=>{const e=document.querySelector('.search');e.focus();e.setSelectionRange(e.value.length,e.value.length)},0)">${S.tab.clientes==='lista'?colBtn('clientes')+csvBtn('clientes',cs):''}</div>
    <div id="cli-body"></div>`;
  const b=document.getElementById('cli-body');
  const t=S.tab.clientes;
  if(t==='cards'){
    b.innerHTML='<div class="cli-grid">'+cs.map(cl=>{const st=cliStats(cl.nome);
      return `<div class="card cli-card" onclick="openCliente('${cl.id}')">
      <div class="cli-avatar">${esc(cl.nome[0].toUpperCase())}</div>
      <div class="cli-nome">${esc(cl.nome)}</div>
      <div class="cli-meta">${esc(cl.segmento)||'Sem segmento'}${cl.instagram?' · '+esc(cl.instagram):''}</div>
      <div class="cli-stats">
        <div class="cli-stat"><b>${st.dems}</b><span>Demandas</span></div>
        <div class="cli-stat"><b>${st.abertas}</b><span>Abertas</span></div>
        <div class="cli-stat"><b style="color:${st.rec?'var(--green)':'inherit'}">${fmtBRL(st.rec)}</b><span>Receita</span></div>
      </div></div>`;}).join('')+'</div>';
  }else if(t==='lista'){
    b.innerHTML=cs.length?`<div class="card" style="padding:6px 20px;">${renderDataTable('clientes',applyTableSort('clientes',cs),cl=>`<button class="ibtn" onclick="openCliente('${cl.id}')">✎</button>`)}</div>`:'<div class="card"><div class="empty-msg">Nenhum cliente encontrado.</div></div>';
  }else{
    const rank=cs.map(cl=>({cl,st:cliStats(cl.nome)})).filter(x=>x.st.rec>0).sort((a,b)=>b.st.rec-a.st.rec);
    const mx=Math.max(1,...rank.map(x=>x.st.rec));
    b.innerHTML=rank.length?`<div class="card">${rank.map(({cl,st})=>`
      <div style="display:flex;align-items:center;gap:14px;padding:9px 0;">
      <div style="width:190px;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(cl.nome)}</div>
      <div style="flex:1;height:6px;background:rgba(0,0,0,.09);border-radius:99px;overflow:hidden;"><div style="height:100%;background:var(--acc);border-radius:99px;width:${Math.round(st.rec/mx*100)}%"></div></div>
      <div style="min-width:150px;text-align:right;font-size:12px;color:var(--t2)">${fmtBRL(st.rec)} · <span style="color:${st.res<0?'var(--red)':'var(--green)'}">${fmtBRL(st.res)}</span></div></div>`).join('')}
      <div style="font-size:10.5px;color:var(--t3);margin-top:10px;">barra = receita líquida · valor à direita = receita · resultado (receita − despesas vinculadas)</div></div>`
    :'<div class="card"><div class="empty-msg">Nenhum cliente com receita registrada ainda.</div></div>';
  }
}
function openCliente(id){
  let cl=id?allClientes().find(x=>x.id===id):null;
  openModal(cl?cl.nome:'Novo cliente',`
    <div class="field"><label>Nome</label><input id="m1" value="${esc(cl?.nome)}"></div>
    <div class="f2"><div class="field"><label>Segmento</label><input id="m2" value="${esc(cl?.segmento)}" placeholder="Saúde, Gastronomia, Creator..."></div>
    <div class="field"><label>Cidade</label><input id="m3" value="${esc(cl?.cidade)}"></div></div>
    <div class="f2"><div class="field"><label>E-mail</label><input id="m4" value="${esc(cl?.email)}"></div>
    <div class="field"><label>Telefone</label><input id="m5" value="${esc(cl?.tel)}"></div></div>
    <div class="field"><label>Instagram</label><input id="m6" value="${esc(cl?.instagram)}" placeholder="@perfil"></div>
    <div class="field"><label>Notas</label><textarea id="m7" rows="3">${esc(cl?.notas)}</textarea></div>
    ${cl?`<div style="font-size:11px;color:var(--t3)">${(x=>`${x.dems} demandas · ${x.projetos} projetos · Receita líq. ${fmtBRL(x.rec)}`)(cliStats(cl.nome))}</div>`:''}`,
  ()=>{const v=k=>document.getElementById(k).value;if(!v('m1').trim())return;
    const data={nome:v('m1').trim(),segmento:v('m2').trim(),cidade:v('m3').trim(),email:v('m4').trim(),tel:v('m5').trim(),instagram:v('m6').trim(),notas:v('m7').trim()};
    if(cl&&!cl.derived)Object.assign(cl,data);
    else S.cbase.push({id:uid('c'),...data});
    save();closeModal();render();});
}

/* ═══ MOTOR DE TEMA ═══ */
const THEME_PRESETS=[
 {id:'lozy',nome:'Lozy Creative',bg:'#EAE3D6',surf:'#F4EFE6',acc:'#4E1A1D'},
 {id:'claro',nome:'Cinza claro',bg:'#d4d4d4',surf:'#cfcfcf',acc:'#161616'},
 {id:'grafite',nome:'Grafite',bg:'#2e2e2e',surf:'#cfcfcf',acc:'#161616'},
 {id:'dark',nome:'Dark clássico',bg:'#0a0a0a',surf:'#141414',acc:'#f5f5f5'},
 {id:'creme',nome:'Creme',bg:'#e9e4da',surf:'#f2ede3',acc:'#1f1b16'},
 {id:'oliva',nome:'Oliva',bg:'#3a3d34',surf:'#d7d9cf',acc:'#20231c'}
];
function hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function toHex(r,g,b){return '#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('');}
function lum(h){const[r,g,b]=hx(h);return(0.299*r+0.587*g+0.114*b)/255;}
function mix(a,b,t){const A=hx(a),B=hx(b);return toHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);}
function applyTheme(){
  const t=S.theme||THEME_PRESETS[0];
  const r=document.documentElement.style;
  const surfDark=lum(t.surf)<0.5, bgDark=lum(t.bg)<0.5;
  const txt=surfDark?'#f0f0f0':'#161616', txtInk=surfDark?'#ffffff':'#000000';
  const lx=bgDark?'#efefef':'#161616';
  r.setProperty('--bg',t.bg);
  r.setProperty('--chrome',mix(t.bg,surfDark||bgDark?'#ffffff':'#000000',bgDark?0.04:0.05*-1+0.05));
  r.setProperty('--chrome',mix(t.bg,bgDark?'#ffffff':'#000000',0.04));
  r.setProperty('--bline',mix(t.bg,bgDark?'#ffffff':'#000000',0.18));
  r.setProperty('--s1',t.surf);r.setProperty('--lt',t.surf);
  r.setProperty('--s2',mix(t.surf,txtInk,0.06));r.setProperty('--lt2',mix(t.surf,txtInk,0.06));
  r.setProperty('--s3',mix(t.surf,txtInk,0.12));
  r.setProperty('--ltb',mix(t.surf,txtInk,0.15));r.setProperty('--b1',mix(t.surf,txtInk,0.15));
  r.setProperty('--b2',mix(t.surf,txtInk,0.21));
  r.setProperty('--b3',mix(t.surf,txtInk,0.32));
  r.setProperty('--t1',txt);r.setProperty('--dk1',txt);
  r.setProperty('--t2',mix(txt,t.surf,0.28));r.setProperty('--dk2',mix(txt,t.surf,0.28));
  r.setProperty('--t3',mix(txt,t.surf,0.48));r.setProperty('--dk3',mix(txt,t.surf,0.48));
  r.setProperty('--lx1',lx);
  r.setProperty('--lx2',mix(lx,t.bg,0.3));
  r.setProperty('--lx3',mix(lx,t.bg,0.5));
  r.setProperty('--acc',t.acc);
  r.setProperty('--accT',lum(t.acc)<0.5?'#f5f5f5':'#161616');
}
function setPreset(id){S.theme={...THEME_PRESETS.find(p=>p.id===id)};save();applyTheme();render();}

    bg:document.getElementById('c-bg').value,
    surf:document.getElementById('c-surf').value,
    acc:document.getElementById('c-acc').value};
  save();applyTheme();render();
}
