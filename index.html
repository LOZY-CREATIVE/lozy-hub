function tableCols(id){
  const def=COLDEFS[id];if(!def)return[];
  S.cols=S.cols||{};
  const saved=S.cols[id];
  if(saved&&saved.length)return saved.map(k=>def.cols.find(c=>c.k===k)).filter(Boolean);
  return def.cols.filter(c=>c.def);
}
function tableSort(id){return (S.sort&&S.sort['tbl_'+id])||null;}
function setTableSort(id,k){
  S.sort=S.sort||{};
  const cur=S.sort['tbl_'+id];
  S.sort['tbl_'+id]=(cur&&cur.k===k)?{k,dir:cur.dir==='asc'?'desc':'asc'}:{k,dir:'asc'};
  save();render();
}
function applyTableSort(id,rows){
  const st=tableSort(id);if(!st)return rows;
  const col=COLDEFS[id].cols.find(c=>c.k===st.k);if(!col)return rows;
  const mul=st.dir==='asc'?1:-1;
  return [...rows].sort((a,b)=>{
    const av=col.get(a),bv=col.get(b);
    if(typeof av==='number'&&typeof bv==='number')return (av-bv)*mul;
    return String(av).localeCompare(String(bv),'pt-BR')*mul;
  });
}
/* Monta a tabela. actionsFn(row) -> html dos botões da última coluna */
function renderDataTable(id,rows,actionsFn){
  const cols=tableCols(id);
  if(!cols.length)return '<div class="empty-msg">Nenhuma coluna selecionada. Use "⚙ Colunas" para escolher.</div>';
  const st=tableSort(id);
  const head=cols.map(c=>`<th style="cursor:pointer;user-select:none" onclick="setTableSort('${id}','${c.k}')">${c.l}${st&&st.k===c.k?(st.dir==='asc'?' ↑':' ↓'):''}</th>`).join('');
  const body=rows.map(r=>`<tr>${cols.map(c=>`<td>${c.cell(r)}</td>`).join('')}${actionsFn?`<td><div class="tacts">${actionsFn(r)}</div></td>`:''}</tr>`).join('');
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head}${actionsFn?'<th></th>':''}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function colBtn(id){return `<button class="btn-sm" onclick="openColPicker('${id}')">⚙ Colunas (${tableCols(id).length})</button>`;}
function csvBtn(id,rows){S._csv=S._csv||{};S._csv[id]=rows;return `<button class="btn-sm" onclick="exportCSV('${id}')">↓ CSV</button>`;}
function exportCSV(id){
  const rows=(S._csv&&S._csv[id])||[];
  const cols=tableCols(id);
  const esc2=v=>{const s=String(v??'').replace(/"/g,'""');return /[";\n]/.test(s)?'"'+s+'"':s;};
  const lines=[cols.map(c=>esc2(c.l)).join(';'),...rows.map(r=>cols.map(c=>esc2(c.get(r))).join(';'))];
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lozy-'+id+'.csv';a.click();
}
function openColPicker(id){
  openModal('Colunas — '+COLDEFS[id].nome,colPickerBody(id),null,true);
  document.getElementById('modal').classList.add('wide');
}
function colPickerBody(id){
  const def=COLDEFS[id];
  const vis=tableCols(id).map(c=>c.k);
  const ordered=[...vis,...def.cols.map(c=>c.k).filter(k=>!vis.includes(k))];
  return `<div style="font-size:11.5px;color:var(--t2);margin-bottom:12px;">Escolha quais colunas aparecem e em que ordem. Clique no cabeçalho da tabela para ordenar por ela.</div>
  <div style="max-height:46vh;overflow-y:auto;">
  ${ordered.map((k,i)=>{const c=def.cols.find(x=>x.k===k);const on=vis.includes(k);
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--ltb);opacity:${on?1:0.5}">
      <button class="tk-check ${on?'done':''}" style="border-color:var(--b3)" onclick="colToggle('${id}','${k}')"></button>
      <span style="flex:1;font-size:12.5px;font-weight:500">${c.l}</span>
      ${on?`<button class="ibtn" onclick="colMove('${id}','${k}',-1)">↑</button><button class="ibtn" onclick="colMove('${id}','${k}',1)">↓</button>`:''}
    </div>`;}).join('')}
  </div>
  <div style="display:flex;gap:8px;margin-top:14px;border-top:1px solid var(--ltb);padding-top:14px;">
    <button class="btn-sm" onclick="colAll('${id}')">Selecionar todas</button>
    <button class="btn-sm" onclick="colReset('${id}')">Restaurar padrão</button>
  </div>`;
}
function colToggle(id,k){
  S.cols=S.cols||{};
  let vis=tableCols(id).map(c=>c.k);
  vis=vis.includes(k)?vis.filter(x=>x!==k):[...vis,k];
  S.cols[id]=vis;save();openColPicker(id);render();
}
function colMove(id,k,dir){
  S.cols=S.cols||{};
  const vis=tableCols(id).map(c=>c.k);
  const i=vis.indexOf(k),j=i+dir;
  if(i<0||j<0||j>=vis.length)return;
  [vis[i],vis[j]]=[vis[j],vis[i]];
  S.cols[id]=vis;save();openColPicker(id);render();
}
function colAll(id){S.cols=S.cols||{};S.cols[id]=COLDEFS[id].cols.map(c=>c.k);save();openColPicker(id);render();}
function colReset(id){S.cols=S.cols||{};delete S.cols[id];save();openColPicker(id);render();}
</script>
<script>
/* ═══ DASHBOARD — MOTOR DE WIDGETS ═══ */
function buildDashCtx(){
  const abertos=S.leads.filter(l=>l.stage!=='Fechado'&&l.stage!=='Perdido');
  const propAg=S.propostas.filter(p=>p.status==='Enviada');
  const demAbertas=S.demandas.filter(d=>d.status!=='Entregue');
  const mk=monthKey(todayStr());
  const recMes=sum(S.fin.filter(f=>f.tipo==='receita'&&f.pago&&mesRef(f)===mk),f=>liq(f));
  const despMes=sum(S.fin.filter(f=>f.tipo==='despesa'&&f.pago&&mesRef(f)===mk),f=>f.valor);
  const lucro=recMes-despMes;
  const quentes=abertos.filter(l=>l.temp==='quente');
  const demsHoje=S.demandas.filter(d=>d.status!=='Entregue'&&demPrazoAtivo(d)&&['atrasada','hoje'].includes(prazoStatus(demPrazoAtivo(d))?.cls))
    .sort((a,b)=>(prazoStatus(demPrazoAtivo(a)).cls==='atrasada'?0:1)-(prazoStatus(demPrazoAtivo(b)).cls==='atrasada'?0:1));
  const aReceber=sum(S.fin.filter(f=>f.tipo==='receita'&&!f.pago),f=>liq(f));
  const aPagar=sum(S.fin.filter(f=>f.tipo==='despesa'&&!f.pago),f=>f.valor);
  const tarefasPend=S.tasks.filter(t=>!['Concluída','Cancelada'].includes(t.status)).length;
  const clientesTotal=(typeof allClientes==='function'?allClientes().length:clientes().length);
  const projetosAtivos=S.projetos.filter(p=>p.fase!=='Entrega').length;
  return{abertos,propAg,demAbertas,recMes,despMes,lucro,quentes,demsHoje,now:new Date(),aReceber,aPagar,tarefasPend,clientesTotal,projetosAtivos};
}

/* Métricas disponíveis para widgets personalizados (e reaproveitadas pelos widgets fixos) */
const METRIC_DEFS={
  pipeline_aberto:{label:'Pipeline aberto',calc:ctx=>({value:fmtBRL(sum(ctx.abertos)),sub:ctx.abertos.length+' oportunidade'+(ctx.abertos.length===1?'':'s')})},
  propostas_aguardando:{label:'Propostas aguardando',calc:ctx=>({value:String(ctx.propAg.length),sub:ctx.propAg.length?fmtBRL(sum(ctx.propAg,p=>p.investimento))+' em análise':'Nenhuma aguardando'})},
  demandas_abertas:{label:'Demandas em aberto',calc:ctx=>({value:String(ctx.demAbertas.length),sub:ctx.demsHoje.length?ctx.demsHoje.length+' para hoje/atrasadas':'nenhuma vencendo hoje'})},
  lucro_mes:{label:'Lucro do mês',calc:ctx=>({value:fmtBRL(ctx.lucro),sub:fmtBRL(ctx.recMes)+' rec · '+fmtBRL(ctx.despMes)+' desp',neg:ctx.lucro<0})},
  receita_mes:{label:'Receita do mês',calc:ctx=>({value:fmtBRL(ctx.recMes)})},
  despesa_mes:{label:'Despesa do mês',calc:ctx=>({value:fmtBRL(ctx.despMes)})},
  a_receber:{label:'A receber',calc:ctx=>({value:fmtBRL(ctx.aReceber)})},
  a_pagar:{label:'A pagar',calc:ctx=>({value:fmtBRL(ctx.aPagar)})},
  leads_quentes:{label:'Leads quentes',calc:ctx=>({value:String(ctx.quentes.length),sub:ctx.quentes.length?fmtBRL(sum(ctx.quentes)):''})},
  tarefas_pendentes:{label:'Tarefas pendentes',calc:ctx=>({value:String(ctx.tarefasPend)})},
  clientes_total:{label:'Total de clientes',calc:ctx=>({value:String(ctx.clientesTotal)})},
  projetos_ativos:{label:'Projetos ativos',calc:ctx=>({value:String(ctx.projetosAtivos)})}
};

/* Widgets fixos (compostos) */
const BUILTIN_DEFS={
  kpi_pipeline:{label:'Pipeline aberto',span:1,goto:'comercial',metric:'pipeline_aberto'},
  kpi_propostas:{label:'Propostas aguardando',span:1,goto:'propostas',metric:'propostas_aguardando'},
  kpi_demandas:{label:'Demandas em aberto',span:1,goto:'demandas',metric:'demandas_abertas'},
  kpi_lucro:{label:'Lucro do mês',span:1,goto:'financeiro',metric:'lucro_mes'},
  chart_rd:{label:'Receita × Despesa',span:2,goto:'financeiro',html:ctx=>`<div class="widget-hd"><span class="widget-ttl">Receita × Despesa</span><span class="widget-more">últimos 6 meses</span></div>${renderChartRD()}`},
  week:{label:'Esta semana',span:2,goto:'agenda',html:ctx=>`<div class="widget-hd"><span class="widget-ttl">Esta semana</span><span class="widget-more" style="text-transform:capitalize">${ctx.now.toLocaleDateString('pt-BR',{month:'long'})}</span></div>${renderWeekCal()}<div style="margin-top:14px">${renderWeekList()}</div>`},
  meudia:{label:'Meu dia',span:2,goto:null,html:ctx=>renderMeuDiaInner(ctx.demsHoje)},
  leads:{label:'Leads quentes',span:2,goto:'comercial',html:ctx=>`<div class="widget-hd"><span class="widget-ttl">Leads quentes</span><span class="widget-more">${ctx.quentes.length?fmtBRL(sum(ctx.quentes)):''}</span></div>${ctx.quentes.length?ctx.quentes.map(l=>`<div class="row-item"><div><div class="ri-name" style="color:var(--dk1)">${esc(l.empresa)}</div><div class="ri-sub">${esc(l.stage)}${l.contato?' · '+esc(l.contato):''}</div></div><div class="ri-val" style="color:var(--dk1)">${fmtBRL(l.valor)}</div></div>`).join(''):'<div class="empty-msg">Nenhum lead quente em aberto.</div>'}`}
};
const DASH_DEFAULT=[{id:'kpi_pipeline',visible:true},{id:'kpi_propostas',visible:true},{id:'kpi_demandas',visible:true},{id:'kpi_lucro',visible:true},{id:'chart_rd',visible:true},{id:'week',visible:true},{id:'meudia',visible:true},{id:'leads',visible:true}];

function kpiHtml(def,ctx){
  const m=METRIC_DEFS[def.metric];const r=m.calc(ctx);
  return `<div class="clabel">${def.label}</div><div class="metric" style="${r.neg?'color:#b91c1c':''}">${r.value}</div>${r.sub?`<div class="metric-s">${r.sub}</div>`:''}`;
}
function renderDashWidgetBlock(item,ctx){
  if(item.type==='custom'){
    const m=METRIC_DEFS[item.metric]||METRIC_DEFS.pipeline_aberto;
    const r=m.calc(ctx);
    return `<div class="wl dw-1"><div class="clabel">${esc(item.label)||m.label}</div><div class="metric" style="${r.neg?'color:#b91c1c':''}">${r.value}</div>${r.sub?`<div class="metric-s">${r.sub}</div>`:''}</div>`;
  }
  const def=BUILTIN_DEFS[item.id];if(!def)return'';
  const inner=def.html?def.html(ctx):kpiHtml(def,ctx);
  const cls='wl dw-'+def.span+(def.goto?' wl-go':'');
  const onclick=def.goto?` onclick="goTo('${def.goto}')"`:'';
  return `<div class="${cls}"${onclick}>${inner}</div>`;
}

function renderDashboard(c){
  if(!S.dash||!S.dash.length)S.dash=DASH_DEFAULT.map(x=>({...x}));
  const ctx=buildDashCtx();
  const items=S.dash.filter(w=>w.visible!==false);
  c.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:10px;">
      <div><div class="eyebrow">${ctx.now.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</div><div class="greeting" style="margin-bottom:0">${greeting()}, Leonardo.</div></div>
      <button class="btn-ghost" onclick="openDashCustomizer()">⚙ Personalizar</button>
    </div>
    <div class="dash-grid">${items.map(it=>renderDashWidgetBlock(it,ctx)).join('')}</div>`;
}

/* ═══ Personalização: reordenar, ocultar, remover, adicionar widgets ═══ */
function openDashCustomizer(){
  openModal('Personalizar dashboard',dashCustomizerBody(),null,true);
  document.getElementById('modal').classList.add('wide');
}
function dashCustomizerBody(){
  const rows=S.dash.map((it,i)=>{
    const label=it.type==='custom'?(it.label||METRIC_DEFS[it.metric]?.label||'Widget'):(BUILTIN_DEFS[it.id]?.label||it.id);
    const hidden=it.visible===false;
    return `<div style="display:flex;align-items:center;gap:6px;padding:8px 2px;border-bottom:1px solid var(--ltb);opacity:${hidden?0.45:1}">
      <span style="flex:1;font-size:12.5px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(label)}</span>
      ${it.type==='custom'?'<span class="bdg">personalizado</span>':''}
      <button class="ibtn" onclick="dashMove(${i},-1)" title="Mover para cima">↑</button>
      <button class="ibtn" onclick="dashMove(${i},1)" title="Mover para baixo">↓</button>
      <button class="ibtn" onclick="dashToggle(${i})" title="${hidden?'Mostrar':'Ocultar'}">${hidden?'○':'●'}</button>
      ${it.type==='custom'?`<button class="ibtn del" onclick="dashDelete(${i})" title="Remover">✕</button>`:''}
    </div>`;
  }).join('');
  return `<div style="font-size:11.5px;color:var(--t2);margin-bottom:12px;">Reordene, oculte ou remova widgets. Widgets personalizados podem ser criados abaixo a partir de qualquer métrica do sistema.</div>
  <div style="max-height:38vh;overflow-y:auto;margin-bottom:16px;">${rows}</div>
  <div style="border-top:1px solid var(--ltb);padding-top:14px;">
    <div style="font-size:11px;color:var(--t3);margin-bottom:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;">+ Criar widget personalizado</div>
    <div class="f2">
      <div class="field"><label>Título (opcional)</label><input id="dw-title" placeholder="Ex: Total de clientes"></div>
      <div class="field"><label>Métrica</label><select id="dw-metric">${Object.entries(METRIC_DEFS).map(([k,m])=>`<option value="${k}">${m.label}</option>`).join('')}</select></div>
    </div>
    <button class="btn-sm" onclick="dashAddCustom()">+ Adicionar ao dashboard</button>
  </div>`;
}
function dashMove(i,dir){
  const j=i+dir;if(j<0||j>=S.dash.length)return;
  [S.dash[i],S.dash[j]]=[S.dash[j],S.dash[i]];
  save();openDashCustomizer();render();
}
function dashToggle(i){S.dash[i].visible=S.dash[i].visible===false?true:false;save();openDashCustomizer();render();}
function dashDelete(i){if(S.dash[i].type!=='custom')return;S.dash.splice(i,1);save();openDashCustomizer();render();}
function dashAddCustom(){
  const title=document.getElementById('dw-title').value.trim();
  const metric=document.getElementById('dw-metric').value;
  S.dash.push({id:uid('cw'),type:'custom',metric,label:title,visible:true});
  save();openDashCustomizer();render();
}

/* ═══ Blocos auxiliares (usados pelos widgets fixos) ═══ */
function renderChartRD(){
  const months=[];const d=new Date();d.setDate(1);
  for(let i=5;i>=0;i--){const m=new Date(d);m.setMonth(m.getMonth()-i);months.push(m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0'));}
  const data=months.map(mk=>({
    mk,
    rec:sum(S.fin.filter(f=>f.tipo==='receita'&&f.pago&&mesRef(f)===mk),f=>liq(f)),
    desp:sum(S.fin.filter(f=>f.tipo==='despesa'&&f.pago&&mesRef(f)===mk),f=>f.valor)
  }));
  const max=Math.max(1,...data.map(x=>Math.max(x.rec,x.desp)));
  return `<div class="chart-bars">${data.map(x=>`<div class="cb-group"><div class="cb rec" style="height:${Math.max(2,x.rec/max*100)}%"></div><div class="cb desp" style="height:${Math.max(2,x.desp/max*100)}%"></div></div>`).join('')}</div>
  <div class="chart-lbls">${data.map(x=>{const[y,m]=x.mk.split('-');return '<span>'+new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</span>';}).join('')}</div>
  <div class="chart-leg"><span class="lg"><i style="background:var(--dk1)"></i>Receita líquida</span><span class="lg"><i style="background:var(--dk3)"></i>Despesa</span></div>`;
}

function weekDays(){
  const now=new Date();now.setHours(0,0,0,0);
  const dow=(now.getDay()+6)%7; /* segunda=0 */
  const mon=new Date(now);mon.setDate(now.getDate()-dow);
  return[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function renderWeekCal(){
  const days=weekDays();const today=todayStr();
  const dows=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];
  const evd=new Set([...S.eventos.map(e=>e.data),...S.demandas.filter(d=>d.status!=='Entregue'&&d.prazo).map(d=>d.prazo)]);
  return '<div class="wk-grid">'+days.map((d,i)=>{
    const ds=dstr(d);
    return `<div class="wk-cell ${ds===today?'today':''} ${evd.has(ds)?'has':''}"><div class="wk-dow">${dows[i]}</div><div class="wk-num">${d.getDate()}</div><div class="wk-dot"></div></div>`;
  }).join('')+'</div>';
}
function renderWeekList(){
  const days=weekDays().map(dstr);
  const evs=[
    ...S.eventos.filter(e=>days.includes(e.data)).map(e=>({d:e.data,t:e.titulo,s:e.hIni||'',tipo:e.tipo})),
    ...S.demandas.filter(d=>d.status!=='Entregue'&&days.includes(d.prazo)).map(d=>({d:d.prazo,t:'Prazo: '+d.titulo,s:'',tipo:'Prazo'}))
  ].sort((a,b)=>a.d.localeCompare(b.d)||a.s.localeCompare(b.s)).slice(0,4);
  if(!evs.length)return '<div class="empty-msg">Semana livre. Clique em qualquer dia da agenda.</div>';
  return evs.map(e=>`<div class="row-item"><div><div class="ri-name" style="color:var(--dk1)">${esc(e.t)}</div><div class="ri-sub">${fmtD(e.d)}${e.s?' · '+e.s:''} · ${e.tipo}</div></div></div>`).join('');
}

function renderMeuDiaInner(demsHoje){
  const tasksHoje=S.tasks.filter(t=>['A fazer','Em andamento'].includes(t.status)&&(!t.prazo||prazoStatus(t.prazo)?.diff<=0));
  const done=S.tasks.filter(t=>t.status==='Concluída').slice(0,3);
  return `<div class="widget-hd"><span class="widget-ttl">Meu dia</span><span class="widget-more">${new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})} · <a class="wgo" onclick="goTo('tarefas')">abrir →</a></span></div>
    <div style="margin-bottom:16px">
      <div class="day-lbl">Tarefas</div>
      <div class="task-input-wrap"><input class="task-input" id="task-input" placeholder="Adicionar tarefa rápida..." onkeydown="if(event.key==='Enter')addQuickTask()"><button class="btn-sm" style="background:var(--dk1);color:#fff;border-color:var(--dk1)" onclick="addQuickTask()">+ Add</button></div>
      ${(tasksHoje.length||done.length)?[...tasksHoje,...done].map(t=>`<div class="task-item">
        <button class="tk-check ${t.status==='Concluída'?'done':''}" onclick="toggleTask('${t.id}')"></button>
        <span class="tk-text ${t.status==='Concluída'?'done':''}">${esc(t.titulo)}</span>
        ${t.prioridade==='Alta'?'<span class="bdg alta" style="border-color:#dc262640">alta</span>':''}
        <button class="tk-del" onclick="delTask('${t.id}')">✕</button>
      </div>`).join(''):'<div class="empty-msg">Sem tarefas para hoje.</div>'}
    </div>
    <div>
      <div class="day-lbl">Demandas para hoje</div>
      ${demsHoje.length?demsHoje.map(d=>{const ps=prazoStatus(demPrazoAtivo(d));return `<div class="dem-item"><div class="dem-dot ${ps.cls}"></div><div class="dem-body"><div class="dem-name">${esc(d.titulo)}</div><div class="dem-meta">${esc(d.cliente||'Sem cliente')} · ${esc(d.tipo)}</div></div><div class="dem-prazo ${ps.cls}">${ps.label}</div></div>`;}).join(''):'<div class="empty-msg">Nenhuma demanda com prazo para hoje.</div>'}
    </div>`;
}
function addQuickTask(){
  const el=document.getElementById('task-input');const v=el?.value.trim();if(!v)return;
  S.tasks.unshift({id:uid('t'),titulo:v,prioridade:'Média',status:'A fazer',prazo:todayStr()});
  save();render();
}
function toggleTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;pushUndo((t.status==='Concluída'?'reabrir':'concluir')+' tarefa "'+t.titulo+'"',['tasks']);taskTransicao(t,t.status==='Concluída'?'A fazer':'Concluída');save();render();}
function delTask(id){softDel('tasks',id);}
</script>
<script>
/* ═══ COMERCIAL ═══ */
function renderComercial(c){
  const t=S.tab.comercial;
  c.innerHTML=`
    <div class="page-hd"><div><div class="page-title">Jornada Comercial</div></div></div>
    ${tabsHtml('comercial',[{id:'jornada',l:'Jornada'},{id:'leads',l:'Leads'},{id:'empresas',l:'Empresas'},{id:'contatos',l:'Contatos'},{id:'followups',l:'Follow-ups'},{id:'agendacom',l:'Agenda Comercial'}])}
    <div id="com-body"></div>`;
  const b=document.getElementById('com-body');
  ({jornada:comJornada,leads:comLeads,empresas:comEmpresas,contatos:comContatos,followups:comFollowups,agendacom:comAgenda}[t])(b);
}

function comJornada(b){
  b.innerHTML='<div class="board">'+STAGES.map(st=>{
    const ls=S.leads.filter(l=>l.stage===st);
    return `<div class="col" data-dg="leads" data-dgval="${esc(st)}"><div class="col-hd"><span class="col-name">${st}</span><span class="col-stat">${ls.length} · ${fmtBRL(sum(ls))}</span></div><div class="col-body">${ls.length?ls.map(leadCard).join(''):'<div class="col-empty">Sem leads</div>'}</div></div>`;
  }).join('')+'</div>';
}
function leadCard(l){
  const i=STAGES.indexOf(l.stage);
  return `<div class="kcard" onpointerdown="dgDown(event,'leads','${l.id}')"><div class="kc-top"><div style="display:flex;align-items:center;gap:6px;min-width:0;flex:1">${dgGrip}<div class="kc-name">${esc(l.empresa)}</div></div><span class="bdg ${l.temp}">${l.temp}</span></div>
  <div class="kc-sub">${esc(l.contato)||'Sem contato'}${l.origem?' · '+esc(l.origem):''}</div>
  <div class="kc-ft"><div class="kc-val">${fmtBRL(l.valor)}</div><div class="kc-acts">
  <button class="ibtn" onclick="openLead('${l.id}')">✎</button>
  <button class="ibtn" ${i===0?'disabled style="opacity:.25"':''} onclick="mvLead('${l.id}',-1)">←</button>
  <button class="ibtn" ${i===STAGES.length-1?'disabled style="opacity:.25"':''} onclick="mvLead('${l.id}',1)">→</button>
  <button class="ibtn del" onclick="delLead('${l.id}')">✕</button></div></div></div>`;
}
function mvLead(id,d){const l=S.leads.find(x=>x.id===id);if(!l)return;const n=STAGES.indexOf(l.stage)+d;if(n<0||n>=STAGES.length)return;pushUndo('mover lead "'+l.empresa+'" para "'+STAGES[n]+'"',['leads','projetos']);l.stage=STAGES[n];
  if(l.stage==='Fechado'&&!S.projetos.some(p=>p.leadId===id)){S.projetos.push({id:uid('p'),nome:l.empresa,cliente:l.empresa,fase:'Briefing',entrega:null,leadId:id});}
  save();render();}
function delLead(id){softDel('leads',id);}

function comLeads(b){
  const q=(S.q.leads||'').toLowerCase();
  const f=S.f.leads||{};
  let ls=S.leads.filter(l=>
    (!q||[l.empresa,l.contato,l.origem,l.segmento,l.cidade].join(' ').toLowerCase().includes(q))&&
    (!f.stage||l.stage===f.stage)&&(!f.temp||l.temp===f.temp)&&(!f.origem||l.origem===f.origem));
  const origens=[...new Set(S.leads.map(l=>l.origem).filter(Boolean))];
  b.innerHTML=`
    <div class="toolbar">
      <input class="search" placeholder="Buscar empresa, contato, e-mail, telefone..." value="${esc(S.q.leads||'')}" oninput="S.q.leads=this.value;render();setTimeout(()=>{const e=document.querySelector('.search');e.focus();e.setSelectionRange(e.value.length,e.value.length)},0)">
      <select class="fsel" onchange="S.f.leads={...S.f.leads,stage:this.value};render()"><option value="">Etapa: Todas</option>${STAGES.map(s=>`<option ${f.stage===s?'selected':''}>${s}</option>`).join('')}</select>
      <select class="fsel" onchange="S.f.leads={...S.f.leads,temp:this.value};render()"><option value="">Temperatura: Todas</option>${['quente','morno','frio'].map(s=>`<option ${f.temp===s?'selected':''}>${s}</option>`).join('')}</select>
      <select class="fsel" onchange="S.f.leads={...S.f.leads,origem:this.value};render()"><option value="">Origem: Todas</option>${origens.map(s=>`<option ${f.origem===s?'selected':''}>${s}</option>`).join('')}</select>
      ${colBtn('leads')}${csvBtn('leads',ls)}
    </div>
    ${ls.length?`<div class="card" style="padding:6px 20px;">${renderDataTable('leads',applyTableSort('leads',ls),l=>`<button class="ibtn" onclick="openLead('${l.id}')">✎</button><button class="ibtn del" onclick="delLead('${l.id}')">✕</button>`)}</div>`:'<div class="card"><div class="empty-msg">Nenhum lead encontrado.</div></div>'}`;
}

function comEmpresas(b){
  const map={};
  S.leads.forEach(l=>{if(!map[l.empresa])map[l.empresa]={nome:l.empresa,segmento:l.segmento,cidade:l.cidade,leads:0,valor:0};map[l.empresa].leads++;map[l.empresa].valor+=Number(l.valor||0);});
  const es=Object.values(map);
  b.innerHTML=`<div class="toolbar"><span style="flex:1"></span>${colBtn('empresas')}${csvBtn('empresas',es)}</div>`+(es.length?`<div class="card" style="padding:6px 20px;">${renderDataTable('empresas',applyTableSort('empresas',es))}</div>`:'<div class="card"><div class="empty-msg">Nenhuma empresa ainda. Elas aparecem automaticamente quando você cadastra leads.</div></div>');
}

function comContatos(b){
  const auto=S.leads.filter(l=>l.contato).map(l=>({id:'auto'+l.id,nome:l.contato,empresa:l.empresa,cargo:'',email:'',tel:'',auto:true}));
  const all=[...S.contatos,...auto.filter(a=>!S.contatos.some(c=>c.nome===a.nome&&c.empresa===a.empresa))];
  b.innerHTML=`<div class="toolbar">${colBtn('contatos')}${csvBtn('contatos',all)}<span style="flex:1"></span><button class="btn-ghost" onclick="openContato()">+ Novo contato</button></div>`+
  (all.length?`<div class="card" style="padding:6px 20px;">${renderDataTable('contatos',applyTableSort('contatos',all),ct=>ct.auto?'':`<button class="ibtn del" onclick="delContato('${ct.id}')">✕</button>`)}</div>`:'<div class="card"><div class="empty-msg">Nenhum contato ainda. Eles aparecem automaticamente quando você cadastra leads.</div></div>');
}
function delContato(id){softDel('contatos',id);}

function comFollowups(b){
  const fs=[...S.followups].sort((a,b)=>(a.feito-b.feito)||String(a.data).localeCompare(b.data));
  b.innerHTML=`<div class="toolbar"><span style="flex:1"></span><button class="btn-ghost" onclick="openFollowup()">+ Novo follow-up</button></div>`+
  (fs.length?`<div class="card" style="padding:8px 20px;">${fs.map(f=>{
    const l=S.leads.find(x=>x.id===f.lead);const ps=f.data?prazoStatus(f.data):null;
    return `<div class="row-item"><div style="display:flex;align-items:center;gap:10px;">
    <button class="tk-check ${f.feito?'done':''}" style="border-color:var(--b3)" onclick="toggleFU('${f.id}')"></button>
    <div><div class="ri-name" style="${f.feito?'color:var(--t3);text-decoration:line-through':''}">${esc(f.titulo)}</div>
    <div class="ri-sub">${l?esc(l.empresa)+' · ':''}${fmtD(f.data)}${ps&&!f.feito&&ps.cls!=='ok'?' · <span style="color:'+(ps.cls==='atrasada'?'var(--red)':'var(--amber)')+'">'+ps.label+'</span>':''}</div></div></div>
    <button class="ibtn del" onclick="delFU('${f.id}')">✕</button></div>`;}).join('')}</div>`
  :'<div class="card"><div class="empty-msg">Nenhum follow-up pendente. Cadastre leads e defina a próxima ação para acompanhar tudo aqui.</div></div>');
}
function toggleFU(id){const f=S.followups.find(x=>x.id===id);if(f){f.feito=!f.feito;save();render();}}
function delFU(id){softDel('followups',id);}

function comAgenda(b){
  const days=weekDays();const today=todayStr();
  const dows=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
  b.innerHTML='<div class="ag-week">'+days.map((d,i)=>{
    const ds=dstr(d);
    const items=[
      ...S.followups.filter(f=>f.data===ds&&!f.feito).map(f=>({t:f.titulo,tipo:'followup'})),
      ...S.leads.filter(l=>l.proxData===ds).map(l=>({t:esc(l.proxAcao||'Ação')+' — '+esc(l.empresa),tipo:'lead'}))
    ];
    return `<div class="ag-day ${ds===today?'today':''}"><div class="ag-dhd">${dows[i]}</div><div class="ag-dnum">${d.getDate()}</div>
    ${items.map(it=>`<div class="ag-ev ev-reuniao"><div class="t">${it.t}</div></div>`).join('')}</div>`;
  }).join('')+'</div>';
}

/* lead modal (novo/editar) */
function openLead(id){
  const l=id?S.leads.find(x=>x.id===id):null;
  openModal(l?'Editar lead':'Novo lead',`
    <div class="field"><label>Empresa / marca</label><input id="m1" value="${esc(l?.empresa)}" placeholder="Ex: Clínica Aurora"></div>
    <div class="f2"><div class="field"><label>Contato</label><input id="m2" value="${esc(l?.contato)}"></div>
    <div class="field"><label>Valor estimado (R$)</label><input id="m3" type="number" value="${l?.valor??''}"></div></div>
    <div class="f2"><div class="field"><label>Origem</label><input id="m4" value="${esc(l?.origem)}" placeholder="Indicação, Instagram..."></div>
    <div class="field"><label>Temperatura</label><select id="m5">${['morno','quente','frio'].map(t=>`<option ${l?.temp===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
    <div class="f2"><div class="field"><label>Segmento</label><input id="m6" value="${esc(l?.segmento)}" placeholder="Saúde, Gastronomia..."></div>
    <div class="field"><label>Cidade</label><input id="m7" value="${esc(l?.cidade)}"></div></div>
    <div class="f2"><div class="field"><label>Próxima ação</label><input id="m8" value="${esc(l?.proxAcao)}" placeholder="Ligar, enviar proposta..."></div>
    <div class="field"><label>Data da ação</label><input id="m9" type="date" value="${l?.proxData||''}"></div></div>
    ${l?`<div class="field"><label>Etapa</label><select id="m10">${STAGES.map(s=>`<option ${l.stage===s?'selected':''}>${s}</option>`).join('')}</select></div>`:''}`,
  ()=>{
    const v=k=>document.getElementById(k).value;
    if(!v('m1').trim())return;
    const data={empresa:v('m1').trim(),contato:v('m2').trim(),valor:Number(v('m3'))||0,origem:v('m4').trim(),temp:v('m5'),segmento:v('m6').trim(),cidade:v('m7').trim(),proxAcao:v('m8').trim(),proxData:v('m9')||null};
    if(l){Object.assign(l,data);if(document.getElementById('m10'))l.stage=v('m10');}
    else S.leads.push({id:uid('l'),stage:'Novo Lead',...data});
    if(data.proxAcao&&data.proxData&&!S.followups.some(f=>f.lead===(l?l.id:null)&&f.titulo===data.proxAcao)){
      S.followups.push({id:uid('f'),titulo:data.proxAcao,data:data.proxData,lead:l?l.id:S.leads[S.leads.length-1].id,feito:false});
    }
    save();closeModal();render();
  });
}
function openContato(){
  openModal('Novo contato',`
    <div class="field"><label>Nome</label><input id="m1"></div>
    <div class="field"><label>Empresa</label><input id="m2"></div>
    <div class="f2"><div class="field"><label>Cargo</label><input id="m3"></div><div class="field"><label>Telefone</label><input id="m4"></div></div>
    <div class="field"><label>E-mail</label><input id="m5" type="email"></div>`,
  ()=>{const v=k=>document.getElementById(k).value;if(!v('m1').trim())return;
    S.contatos.push({id:uid('c'),nome:v('m1').trim(),empresa:v('m2').trim(),cargo:v('m3').trim(),tel:v('m4').trim(),email:v('m5').trim()});
    save();closeModal();render();});
}
function openFollowup(){
  openModal('Novo follow-up',`
    <div class="field"><label>Ação</label><input id="m1" placeholder="Ligar para..., enviar proposta..."></div>
    <div class="field"><label>Data</label><input id="m2" type="date" value="${todayStr()}"></div>
    <div class="field"><label>Lead vinculado</label><select id="m3"><option value="">Nenhum</option>${S.leads.map(l=>`<option value="${l.id}">${esc(l.empresa)}</option>`).join('')}</select></div>`,
  ()=>{const v=k=>document.getElementById(k).value;if(!v('m1').trim())return;
    S.followups.push({id:uid('f'),titulo:v('m1').trim(),data:v('m2'),lead:v('m3')||null,feito:false});
    save();closeModal();render();});
}
</script>
<script>
/* ═══ DEMANDAS (lógica Central Lozy) ═══ */
const DCOLORS={'Em planejamento':'#6e6e6e','Em edição':'#8C4530','Com o cliente':'#4E1A1D','Entregue':'#15803d'};
const hexA=(h,a)=>h+Math.round(a*255).toString(16).padStart(2,'0');
const PRAZO_F=[['atrasadas','Atrasadas'],['hoje','Hoje'],['semana','Próximos 7 dias'],['semprazo','Sem prazo']];
function matchPrazo(prazo,filtro,concluida){
  if(!filtro)return true;
  if(filtro==='semprazo')return !prazo;
  if(!prazo)return false;
  const ps=prazoStatus(prazo);
  if(filtro==='atrasadas')return ps.cls==='atrasada'&&!concluida;
  if(filtro==='hoje')return ps.cls==='hoje';
  if(filtro==='semana')return ps.diff>=0&&ps.diff<=7;
  return true;
}
function prazoBuckets(arr,get,isDone){
  const B={atr:[],hoje:[],sem:[],dep:[],sp:[],done:[]};
  arr.forEach(x=>{
    if(isDone&&isDone(x))return B.done.push(x);
    const p=get(x);
    if(!p)return B.sp.push(x);
    const ps=prazoStatus(p);
    if(ps.cls==='atrasada')B.atr.push(x);
    else if(ps.cls==='hoje')B.hoje.push(x);
    else if(ps.diff<=7)B.sem.push(x);
    else B.dep.push(x);});
  return[['Atrasadas',B.atr,'var(--red)'],['Hoje',B.hoje,'var(--amber)'],['Próximos 7 dias',B.sem,null],['Depois',B.dep,null],['Sem prazo',B.sp,null],['Concluídas',B.done,'var(--green)']];
}
function nextDemUid(){const mx=S.demandas.reduce((m,d)=>Math.max(m,parseInt((d.uid||'').replace('DEM-',''))||0),0);return 'DEM-'+String(mx+1).padStart(3,'0');}
function demMargem(d){return Number(d.receita||0)-Number(d.custo||0);}
function filhas(id){return S.demandas.filter(x=>x.maeId===id);}

function renderDemandas(c){
  c.innerHTML=`
    <div class="page-hd"><div><div class="page-title">Demandas</div></div></div>
    ${tabsHtml('demandas',[{id:'lista',l:'Lista'},{id:'porcliente',l:'Por cliente'},{id:'porstatus',l:'Por status'},{id:'portipo',l:'Por tipo'},{id:'porprazo',l:'Por prazo'}])}
    <div id="dem-body"></div>`;
  const b=document.getElementById('dem-body');
  const q=(S.q.dem||'').toLowerCase();const f=S.f.dem||{};
  let ds=S.demandas.filter(d=>
    (!q||[d.titulo,d.cliente,d.uid].join(' ').toLowerCase().includes(q))&&
    (!f.cliente||d.cliente===f.cliente)&&(!f.tipo||d.tipo===f.tipo)&&(!f.status||d.status===f.status)&&matchPrazo(demPrazoAtivo(d),f.prazo,d.status==='Entregue'));
  ds=[...ds].sort((a,b)=>{const pa=demPrazoAtivo(a),pb=demPrazoAtivo(b);if(!pa&&!pb)return 0;if(!pa)return 1;if(!pb)return -1;return pa.localeCompare(pb);});
  const toolbar=`<div class="toolbar">
    <input class="search" placeholder="Buscar por título, cliente ou DEM-ID..." value="${esc(S.q.dem||'')}" oninput="S.q.dem=this.value;render();setTimeout(()=>{const e=document.querySelector('.search');e.focus();e.setSelectionRange(e.value.length,e.value.length)},0)">
    <select class="fsel" onchange="S.f.dem={...S.f.dem,cliente:this.value};render()"><option value="">Cliente: Todos</option>${clientes().map(cl=>`<option ${f.cliente===cl?'selected':''}>${cl}</option>`).join('')}</select>
    <select class="fsel" onchange="S.f.dem={...S.f.dem,tipo:this.value};render()"><option value="">Tipo: Todos</option>${DTIPOS.map(t=>`<option ${f.tipo===t?'selected':''}>${t}</option>`).join('')}</select>
    <select class="fsel" onchange="S.f.dem={...S.f.dem,status:this.value};render()"><option value="">Status: Todos</option>${DSTATUS.map(t=>`<option ${f.status===t?'selected':''}>${t}</option>`).join('')}</select>
    <select class="fsel" onchange="S.f.dem={...S.f.dem,prazo:this.value};render()"><option value="">Prazo: Todos</option>${PRAZO_F.map(p=>`<option value="${p[0]}" ${f.prazo===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select>
    ${colBtn('demandas')}${csvBtn('demandas',ds)}
  </div>`;
  const t=S.tab.demandas;
  if(t==='lista'){
    b.innerHTML=toolbar+(ds.length?`<div class="card" style="padding:6px 20px;">${renderDataTable('demandas',applyTableSort('demandas',ds),demActs)}</div>`:'<div class="card"><div class="empty-msg">Nenhuma demanda encontrada.</div></div>');
  }else if(t==='porcliente'){
    const grupos={};ds.forEach(d=>{const k=d.cliente||'Sem cliente';(grupos[k]=grupos[k]||[]).push(d);});
    b.innerHTML=toolbar+(Object.keys(grupos).length?Object.entries(grupos).map(([cl,arr])=>{
      const rec=sum(arr,d=>d.receita),cus=sum(arr,d=>d.custo);
      return `<div class="grp"><div class="grp-hd"><span class="grp-name">${esc(cl)}</span><span class="grp-stat">${arr.length} demanda${arr.length===1?'':'s'} · Receita ${fmtBRL(rec)} · Custo ${fmtBRL(cus)} · <b style="color:${rec-cus<0?'var(--red)':'var(--green)'}">Margem ${fmtBRL(rec-cus)}</b></span></div>
      <div class="card" style="padding:6px 20px;">${renderDataTable('demandas',applyTableSort('demandas',arr),demActs)}</div></div>`;
    }).join(''):'<div class="card"><div class="empty-msg">Nenhuma demanda encontrada.</div></div>');
  }else if(t==='portipo'){
    b.innerHTML=toolbar+DTIPOS.map(tp=>{
      const arr=ds.filter(d=>d.tipo===tp);if(!arr.length)return '';
      const rec=sum(arr,d=>d.receita),cus=sum(arr,d=>d.custo);
      return `<div class="grp"><div class="grp-hd"><span class="grp-name">${tp}</span><span class="grp-stat">${arr.length} · Receita ${fmtBRL(rec)} · Margem ${fmtBRL(rec-cus)}</span></div>
      <div class="card" style="padding:6px 20px;">${renderDataTable('demandas',applyTableSort('demandas',arr),demActs)}</div></div>`;
    }).join('')||'<div class="card"><div class="empty-msg">Nenhuma demanda encontrada.</div></div>';
  }else if(t==='porprazo'){
    const buckets=prazoBuckets(ds,d=>demPrazoAtivo(d),d=>d.status==='Entregue');
    b.innerHTML=toolbar+buckets.map(([nome,arr,cor])=>{
      if(!arr.length)return '';
      return `<div class="grp"><div class="grp-hd"><span class="grp-name" style="color:${cor||'var(--lx1)'}">${nome}</span><span class="grp-stat">${arr.length}</span></div>
      <div class="card" style="padding:6px 20px;">${renderDataTable('demandas',applyTableSort('demandas',arr),demActs)}</div></div>`;
    }).join('')||'<div class="card"><div class="empty-msg">Nenhuma demanda encontrada.</div></div>';
  }else{
    b.innerHTML=toolbar+'<div class="board">'+DSTATUS.map(st=>{
      const arr=ds.filter(d=>d.status===st);const cor=DCOLORS[st]||'#6e6e6e';
      return `<div class="col" data-dg="demandas" data-dgval="${esc(st)}" style="min-width:280px;max-width:280px;"><div class="col-hd"><span class="col-pill" style="background:${hexA(cor,0.14)};color:${cor}">${st}<span style="opacity:.75;font-weight:500">${arr.length}</span></span><span class="col-stat">${fmtBRL(sum(arr,d=>d.receita))}</span></div><div class="col-body">
      ${arr.length?arr.map(d=>{const ps=demandaAtraso(d);const dataExib=d.status==='Entregue'?(d.entregueEm||d.prazo):demPrazoAtivo(d);const fs=filhas(d.id);
      return `<div class="kcard kc-tint" style="border-left-color:${DCOLORS[d.status]||'#6e6e6e'}" onpointerdown="dgDown(event,'demandas','${d.id}')"><div class="kc-top"><div style="display:flex;align-items:center;gap:6px;min-width:0;flex:1">${dgGrip}<div class="kc-name">${esc(d.titulo)}</div></div><span class="bdg">${d.uid}</span></div>
      <div class="kc-sub">${esc(d.cliente||'Sem cliente')} · ${d.tipo}${fs.length?' · '+fs.length+' entregas':''}${d.maeId?' · filha':''}</div>
      <div class="kc-ft"><div class="kc-val" style="color:${ps&&ps.cls==='atrasada'?'var(--red)':ps&&ps.cls==='hoje'?'var(--amber)':'var(--t2)'};font-size:11.5px">${dataExib?fmtD(dataExib)+(ps?' · '+ps.label:'')+(d.prazoAjuste&&d.status!=='Entregue'?' · ajuste':''):'Sem prazo'}</div>
      <div class="kc-acts"><button class="ibtn" title="abrir" onclick="openCard('demandas','${d.id}')">⤢</button><button class="ibtn" onclick="advDem('${d.id}')">→</button><button class="ibtn del" onclick="delDem('${d.id}')">✕</button></div></div></div>`;}).join(''):'<div class="col-empty">Vazio</div>'}</div></div>`;
    }).join('')+'</div>';
  }
}
function demActs(d){
  return `<button class="ibtn" title="abrir" onclick="openCard('demandas','${d.id}')">⤢</button><button class="ibtn" title="avançar status" onclick="advDem('${d.id}')">→</button><button class="ibtn del" onclick="delDem('${d.id}')">✕</button>`;
}
function demRow(d){
  const ps=demandaAtraso(d);const dataExib=d.status==='Entregue'?(d.entregueEm||d.prazo):demPrazoAtivo(d);const m=demMargem(d);const fs=filhas(d.id);
  const scls=d.status==='Entregue'?(ps?'s-red':'s-green'):(ps&&ps.cls==='atrasada'?'s-red':d.status==='Em planejamento'?'s-gray':'s-amber');
  return `<tr><td><span class="bdg">${d.uid}</span></td>
  <td style="font-weight:500">${esc(d.titulo)}${fs.length?` <span class="bdg" title="entregas derivadas">${fs.length}▾</span>`:''}${d.maeId?' <span class="bdg">filha</span>':''}</td>
  <td style="color:var(--t2)">${esc(d.cliente)||'—'}</td><td><span class="bdg">${d.tipo}</span></td>
  <td style="color:${ps?(ps.cls==='atrasada'?'var(--red)':ps.cls==='hoje'?'var(--amber)':'var(--t2)'):'var(--t3)'};font-size:12px">${fmtD(dataExib)}${ps?' · '+ps.label:''}</td>
  <td><span class="sdot ${scls}"></span><span style="font-size:12px;color:var(--t2)">${d.status}</span></td>
  <td>${fmtBRL(d.receita)}</td><td style="color:${m<0?'var(--red)':m>0?'var(--green)':'var(--t3)'}">${fmtBRL(m)}</td>
  <td><div class="tacts"><button class="ibtn" title="abrir" onclick="openCard('demandas','${d.id}')">⤢</button><button class="ibtn" title="avançar status" onclick="advDem('${d.id}')">→</button><button class="ibtn del" onclick="delDem('${d.id}')">✕</button></div></td></tr>`;
}
function advDem(id){const d=S.demandas.find(x=>x.id===id);if(!d)return;const novo=DSTATUS[(DSTATUS.indexOf(d.status)+1)%DSTATUS.length];pushUndo('avançar '+d.uid+' para "'+novo+'"',['demandas']);demTransicao(d,novo);save();render();toast(d.uid+' → '+novo,'Desfazer','doUndo()',5000);}
function delDem(id){softDel('demandas',id);}
function openDem(id){
  const d=id?S.demandas.find(x=>x.id===id):null;
  const maes=S.demandas.filter(x=>!x.maeId&&x.id!==id);
  openModal(d?('Editar '+d.uid):'Nova demanda',`
    <div class="field"><label>Título</label><input id="m1" value="${esc(d?.titulo)}" placeholder="Ex: Editar 4 reels de julho"></div>
    <div class="f2"><div class="field"><label>Cliente</label><input id="m2" list="cl-list" value="${esc(d?.cliente)}"><datalist id="cl-list">${clientes().map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></div>
    <div class="field"><label>Tipo</label><select id="m3">${DTIPOS.map(t=>`<option ${d?.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
    <div class="f2"><div class="field"><label>Prazo (V1)</label><input id="m4" type="date" value="${d?.prazo||''}"></div>
    <div class="field"><label>Status</label><select id="m5">${DSTATUS.map(t=>`<option ${d?.status===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
    <div class="f2"><div class="field"><label>Prazo de ajuste (revisão)</label><input id="m10" type="date" value="${d?.prazoAjuste||''}"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   DATAS DE PARCELAMENTO — regra oficial Lozy
   Parcela 1  = data real da compra, no cartão em que foi feita.
   Parcela n  = dia de fechamento da fatura daquele cartão.
   O mês da parcela n é ancorado na COMPETÊNCIA da compra, não no
   mês do calendário: comprar depois do fechamento joga a compra
   para a fatura seguinte, e as parcelas seguem a partir dali.
   Sem isso, uma compra em 27/10 no Nubank (fecha dia 9) colocaria
   a parcela 1 e a parcela 2 na mesma competência de novembro.
   ═══════════════════════════════════════════════════════════ */
function contaFech(nome){const c=CONTAS.find(x=>x.nome===nome);return c&&c.fech?c.fech:null;}
function parcDatas(dataCompra,nParcelas,conta){
  if(!dataCompra)return [];
  const out=[dataCompra];
  const fech=contaFech(conta);
  if(!fech){for(let i=1;i<nParcelas;i++)out.push(addM(dataCompra,i));return out;}
  const y=+dataCompra.slice(0,4),m=+dataCompra.slice(5,7),d=+dataCompra.slice(8,10);
  const base=y*12+(m-1)+(d>fech?1:0);
  for(let i=1;i<nParcelas;i++){
    const t=base+i,yy=Math.floor(t/12),mm=t%12+1;
    const last=new Date(yy,mm,0).getDate();
    out.push(yy+'-'+String(mm).padStart(2,'0')+'-'+String(Math.min(fech,last)).padStart(2,'0'));
  }
  return out;
}
function parcAudit(){
  return S.parc.map(p=>{
    const regs=S.fin.filter(l=>l.grupoId===p.grupoId).sort((a,b)=>(a.parcelaN||0)-(b.parcelaN||0));
    const compra=p.dataCompra||(regs[0]&&regs[0].data)||p.primeira||'';
    const esp=compra?parcDatas(compra,p.nParcelas,p.conta):[];
    const fora=regs.filter(r=>{const e=esp[(r.parcelaN||1)-1];return e&&r.data!==e;}).length;
    const dubio=!compra||compra.slice(8,10)==='01';
    return {p,regs,compra,esp,fora,dubio,ok:!fora&&!dubio};
  });
}
function regenParcelas(grupoId,dataCompra){
  const p=S.parc.find(x=>x.grupoId===grupoId);
  if(!p||!dataCompra)return 0;
  const datas=parcDatas(dataCompra,p.nParcelas,p.conta);
  let n=0;
  S.fin.filter(l=>l.grupoId===p.grupoId).forEach(r=>{
    const e=datas[(r.parcelaN||1)-1];
    if(e&&r.data!==e){r.data=e;n++;}
  });
  p.dataCompra=dataCompra;p.primeira=dataCompra;
  return n;
}

  const secRec=B.receitas.map(r=>linha('ip_'+(i++),`<b>${esc(r.desc)}</b> — receita`,`${fmtBRL(r.valor)} · ${fmtDcurta(r.data)} · ${r.status}`,true)).join('');
  const secDup=B.dup.map(d=>linha('ip_'+(i++),`<b>${esc(d.desc)}</b>`,`${fmtBRL(d.valor)} · ${fmtDcurta(d.data)} · já existe uma parcela/cobrança idêntica no Hub`,false)).join('');

    </div>`,()=>{
      let idx=0;const marcado=()=>{const el=document.getElementById('ip_'+idx);idx++;return el&&el.checked;};
      const novosParc=[],novosFin=[];
      B.parc.forEach(p=>{if(marcado()){
        const gid=uid('g');
        novosParc.push({id:'np_'+gid,grupoId:gid,nome:p.nome,nParcelas:p.nParcelas,valorTotal:p.valorTotal,primeira:p.compra,dataCompra:p.compra,categoria:p.categoria,conta:p.conta,natureza:'Fixo'});

      B.receitas.forEach(r=>{if(marcado())novosFin.push({id:uid('f'),tipo:'receita',desc:r.desc,valor:r.valor,data:r.data,tipoReceita:r.tipoReceita,aliquota:r.aliquota,forma:r.forma,conta:r.conta,cliente:r.desc,pago:r.status==='Recebido'});});
      B.dup.forEach(()=>{marcado();});
      if(!novosParc.length&&!novosFin.length)return closeModal();
      pushUndo('importar '+novosFin.length+' lançamento(s) do Notion',['fin','parc']);
      S.parc.push(...novosParc);
      S.fin.push(...novosFin);
      S.prefs.importados=[...new Set([...(S.prefs.importados||[]),'20260802'])];

    });
}

/* ═══════════════════════════════════════════════════════════
   AUDITORIA DE IDs — reparo do bug de colisão do uid() antigo.
   Duas situações distintas, tratadas diferente:
   (a) mesmo id + mesmo conteúdo → duplicata real (o push aconteceu
       duas vezes). Remove a(s) cópia(s) extra(s), preserva a 1ª.
   (b) mesmo id + conteúdo diferente → colisão pura (registros
       reais distintos que ganharam o mesmo id por azar). Não apaga
       nada — só troca o id das cópias extras por um novo, único.
   ═══════════════════════════════════════════════════════════ */
const AUDIT_KEYS=['fin','demandas','tasks','leads','contatos','followups','projetos','eventos','propostas','cbase','parc','assin'];
function chaveConteudo(r){return JSON.stringify(['desc','titulo','nome','empresa','valor','data','tipo','conta','cliente'].map(c=>r[c]));}
function auditIds(){
  const grupos=[];
  AUDIT_KEYS.forEach(k=>{
    const arr=S[k];if(!Array.isArray(arr))return;
    /* 1) duplicata por conteúdo — vale mesmo se o id já for diferente
       (pode vir de origem anterior ao meu bug, ex: import duplo do Notion) */
    const porConteudo={};
    arr.forEach(r=>{if(!r)return;const ck=chaveConteudo(r);(porConteudo[ck]=porConteudo[ck]||[]).push(r);});
    const sobreviventes=[];
    Object.values(porConteudo).forEach(recs=>{
      if(recs.length>1)grupos.push({kind:k,recs,duplicataReal:true});
      sobreviventes.push(recs[0]); /* só 1 representante por conteúdo segue pro passo 2 */
    });
    /* 2) entre o que sobrou (conteúdo já único), ainda pode haver 2 registros
       DIFERENTES que colidiram no id por causa do bug do uid() antigo */
    const porId={};
    sobreviventes.forEach(r=>{if(r.id)(porId[r.id]=porId[r.id]||[]).push(r);});
    Object.values(porId).forEach(recs=>{if(recs.length>1)grupos.push({kind:k,recs,duplicataReal:false});});
  });
  return grupos;
}
function nomeRegistro(r){return r.desc||r.titulo||r.nome||r.empresa||'registro';}
function openAuditoriaIds(){
  const grupos=auditIds();
  if(!grupos.length){
    openModal('Auditoria de IDs','<div style="font-size:12px;color:var(--t2);">Nenhuma colisão de ID encontrada. Os dados estão íntegros.</div>',null,true);
    return;
  }
  const dup=grupos.filter(g=>g.duplicataReal);
  const col=grupos.filter(g=>!g.duplicataReal);
  const valorDup=dup.reduce((a,g)=>a+g.recs.slice(1).reduce((s,r)=>s+(Number(r.valor)||0),0),0);
  openModal('Auditoria de IDs — '+grupos.length+' colisão(ões) encontrada(s)',`
    <div style="font-size:12px;color:var(--t2);line-height:1.6;margin-bottom:12px;">
      Um bug no gerador de ID (corrigido agora) fez alguns lançamentos importados em lote ganharem o
      <b>mesmo identificador</b>. Isso não altera o que você já viu na tela, mas trava editar/excluir a
      cópia "escondida" por trás. Dividido em dois grupos:
    </div>
    ${dup.length?`<div style="font-size:11px;font-weight:600;color:var(--red);text-transform:uppercase;letter-spacing:.03em;margin:10px 0 4px;">Duplicata real — mesmo dado, lançado 2x (${dup.length}) · soma das cópias extras: ${fmtBRL(valorDup)}</div>
    ${dup.map((g,i)=>`<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--b1);">
      <input type="checkbox" id="ad_${i}" checked style="margin-top:3px;flex-shrink:0;">
      <label for="ad_${i}" style="flex:1;font-size:12px;cursor:pointer;"><b>${esc(nomeRegistro(g.recs[0]))}</b> — ${trashLabel(g.kind)}<br>
      <span style="color:var(--t3);font-size:10.5px;">${g.recs.length}× igual · ${g.recs[0].valor?fmtBRL(g.recs[0].valor)+' · ':''}${g.recs[0].data||''} — mantém 1, remove ${g.recs.length-1}</span></label>
    </div>`).join('')}`:''}
    ${col.length?`<div style="font-size:11px;font-weight:600;color:var(--amber);text-transform:uppercase;letter-spacing:.03em;margin:16px 0 4px;">Colisão sem duplicar dado — registros diferentes, mesmo ID por acaso (${col.length})</div>
    <div style="font-size:11.5px;color:var(--t2);margin-bottom:6px;">Corrigidos automaticamente ao confirmar — nenhum dado é removido, só o ID.</div>
    ${col.map(g=>`<div style="padding:5px 0;font-size:11.5px;color:var(--t2);border-bottom:1px solid var(--b1);">${g.recs.map(r=>esc(nomeRegistro(r))+(r.valor?' ('+fmtBRL(r.valor)+')':'')).join(' · ')}</div>`).join('')}`:''}
  `,()=>{
    const keys=new Set();
    const toRemove=[]; // {kind,id do registro a remover via objeto}
    dup.forEach((g,i)=>{
      keys.add(g.kind);
      if(document.getElementById('ad_'+i).checked) g.recs.slice(1).forEach(r=>toRemove.push({kind:g.kind,ref:r}));
    });
    col.forEach(g=>keys.add(g.kind));
    pushUndo('reparar '+grupos.length+' colisão(ões) de ID',[...keys]);
    // remove duplicatas reais confirmadas (por referência de objeto, não por id — evita remover a cópia errada)
    toRemove.forEach(({kind,ref})=>{const arr=S[kind];const idx=arr.indexOf(ref);if(idx>-1)arr.splice(idx,1);});
    // corrige colisões sem duplicar dado: reatribui id novo a todas as cópias exceto a 1ª
    col.forEach(g=>{g.recs.slice(1).forEach(r=>{r.id=uid(String(r.id).match(/^[a-z]+/)?.[0]||'x');});});
    save();closeModal();render();
    toast((toRemove.length?toRemove.length+' duplicata(s) removida(s)':'')+(toRemove.length&&col.length?' · ':'')+(col.length?col.length+' ID(s) corrigido(s)':'')+'.','Desfazer','doUndo()');
  });
}

/* ═══ BACKUP COMPLETO — snapshot fiel do estado real, pra auditoria/reconciliação ═══
   Separado em função pura (buildBackupData) + wrapper de download (exportBackup)
   de propósito: a função pura é testável sem precisar simular clique de arquivo. */
function buildBackupData(){
  const keys=['leads','contatos','followups','demandas','tasks','projetos','fin','eventos','propostas','cbase','parc','assin','trash'];
  const out={_exportedAt:new Date().toISOString(),_countsSnapshot:{}};
  keys.forEach(k=>{out[k]=S[k]||[];out._countsSnapshot[k]=(S[k]||[]).length;});
  return out;
}
function exportBackup(){
  const data=buildBackupData();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='lozy-hub-backup-'+todayStr()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast('Backup baixado — '+data._countsSnapshot.fin+' lançamentos, '+data._countsSnapshot.parc+' parcelamentos.');
}

}
function relTime(iso){
  if(!iso)return 'nunca';
  const d=new Date(iso);const diffMin=Math.round((Date.now()-d.getTime())/60000);
  if(diffMin<1)return 'agora mesmo';
  if(diffMin<60)return 'há '+diffMin+' min';
  const diffH=Math.round(diffMin/60);
  if(diffH<24)return 'há '+diffH+'h';
  const diffD=Math.round(diffH/24);
  if(diffD===1)return 'ontem';
  if(diffD<7)return 'há '+diffD+' dias';
  return d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

      <div class="card"><div class="clabel">Saldo realizado</div><div class="metric" style="color:${saldo<0?'var(--red)':'var(--t1)'}">${fmtBRL(saldo)}</div><div class="metric-s">previsto ${fmtBRL(recebido+aReceber-pago-aPagar)}</div></div>
      <div class="card"><div class="clabel">Margem realizada</div><div class="metric">${margem.toFixed(1)}%</div><div class="metric-s" style="text-transform:capitalize">${mesLabel}</div></div>
    </div>
    <div class="g2">
      <div class="card"><div class="widget-hd"><span class="widget-ttl">Onde sai o dinheiro</span><span class="widget-more">despesa por categoria · mês ref.</span></div>
      ${Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([cat,v])=>`
        <div style="display:flex;align-items:center;gap:12px;padding:7px 0;">
        <div style="width:110px;font-size:12px;color:var(--t2);flex-shrink:0;">${cat}</div>

/* ── Lançamentos: filtros completos + ordenação ── */
/* Drill-down: sai de um card da Visão Geral e cai em Lançamentos já filtrado
   pelos mesmos critérios que compuseram aquele número (tipo + pago + mesRef). */
function finDrill(tipo,pago,mk){
  S.tab.financeiro='lanc';
  S.f.finLanc={tipo,status:pago?'pago':'pend',mesRef:mk};
  save();render();
}
function finLanc(b){
  const q=(S.q.fin||'').toLowerCase();const f=S.f.finLanc||{};
  const srt=S.sort.finLanc||{campo:'data',dir:'desc'};
  const hoje=todayStr();
  const nFut=S.fin.filter(l=>(l.data||'')>hoje).length;
  let ls=S.fin.filter(l=>
    (l.data||'')<=hoje&&
    (!q||[l.desc,l.cliente,l.categoria,l.tipoReceita].join(' ').toLowerCase().includes(q))&&
    (!f.tipo||l.tipo===f.tipo)&&
    (!f.status||(f.status==='pago'?l.pago:!l.pago))&&
    (!f.cat||l.tipoReceita===f.cat||l.categoria===f.cat)&&
    (!f.nat||l.natureza===f.nat)&&
    (!f.mec||l.mecanismo===f.mec)&&
    (!f.conta||l.conta===f.conta)&&
    (!f.cliente||l.cliente===f.cliente)&&
    (!f.mesRef||mesRef(l)===f.mesRef)&&
    (!f.de||(l.data||'')>=f.de)&&
    (!f.ate||(l.data||'')<=f.ate));
  ls=[...ls].sort((a,b)=>{
    let av,bv;
    if(srt.campo==='valor'){av=a.tipo==='receita'?liq(a):a.valor;bv=b.tipo==='receita'?liq(b):b.valor;}
    else if(srt.campo==='desc'){av=(a.desc||'').toLowerCase();bv=(b.desc||'').toLowerCase();}
    else{av=a.data||'';bv=b.data||'';}
    const cmp=av>bv?1:av<bv?-1:0;
    return srt.dir==='asc'?cmp:-cmp;
  });
  const rec=sum(ls.filter(x=>x.tipo==='receita'),x=>liq(x)),desp=sum(ls.filter(x=>x.tipo==='despesa'),x=>x.valor);
  const CATU=[...new Set([...RTIPOS,...FCATS])];
  b.innerHTML=`
    <div class="toolbar">
      <input class="search" placeholder="Buscar descrição, cliente, categoria..." value="${esc(S.q.fin||'')}" oninput="S.q.fin=this.value;render();setTimeout(()=>{const e=document.querySelector('.search');e.focus();e.setSelectionRange(e.value.length,e.value.length)},0)">
      <select class="fsel" onchange="S.f.finLanc={...S.f.finLanc,tipo:this.value};render()"><option value="">Tipo: Todos</option><option value="receita" ${f.tipo==='receita'?'selected':''}>Receitas</option><option value="despesa" ${f.tipo==='despesa'?'selected':''}>Despesas</option></select>
      <select class="fsel" onchange="S.f.finLanc={...S.f.finLanc,status:this.value};render()"><option value="">Status: Todos</option><option value="pago" ${f.status==='pago'?'selected':''}>Pago/Recebido</option><option value="pend" ${f.status==='pend'?'selected':''}>Pendente</option></select>
      <select class="fsel" onchange="S.f.finLanc={...S.f.finLanc,cat:this.value};render()"><option value="">Categoria: Todas</option>${CATU.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select>
      <select class="fsel" onchange="S.f.finLanc={...S.f.finLanc,nat:this.value};render()"><option value="">Natureza: Todas</option>${NATUREZAS.map(n=>`<option ${f.nat===n?'selected':''}>${n}</option>`).join('')}</select>
      <select class="fsel" onchange="S.f.finLanc={...S.f.finLanc,mec:this.value};render()"><option value="">Mecanismo: Todos</option>${MECANISMOS.map(m=>`<option ${f.mec===m?'selected':''}>${m}</option>`).join('')}</select>
      <select class="fsel" onchange="S.f.finLanc={...S.f.finLanc,conta:this.value};render()"><option value="">Conta: Todas</option>${CONTAS.map(c=>`<option ${f.conta===c.nome?'selected':''}>${c.nome}</option>`).join('')}</select>
      <select class="fsel" onchange="S.f.finLanc={...S.f.finLanc,cliente:this.value};render()"><option value="">Cliente: Todos</option>${clientes().map(c=>`<option ${f.cliente===c?'selected':''}>${c}</option>`).join('')}</select>
      <input class="fsel" type="month" title="Mês de referência (considera fechamento de fatura)" value="${f.mesRef||''}" onchange="S.f.finLanc={...S.f.finLanc,mesRef:this.value};render()">
      <input class="fsel" type="date" title="De" value="${f.de||''}" onchange="S.f.finLanc={...S.f.finLanc,de:this.value};render()">
      <input class="fsel" type="date" title="Até" value="${f.ate||''}" onchange="S.f.finLanc={...S.f.finLanc,ate:this.value};render()">
      ${(f.tipo||f.status||f.cat||f.nat||f.mec||f.conta||f.cliente||f.mesRef||f.de||f.ate)?'<button class="btn-sm" onclick="S.f.finLanc={};render()">Limpar filtros</button>':''}
      ${colBtn('fin_lanc')}${csvBtn('fin_lanc',ls)}
    </div>
    <div style="font-size:11.5px;color:var(--lx3);margin-bottom:10px;">${ls.length} lançamentos realizados · Receita líq. <span style="color:var(--green)">${fmtBRL(rec)}</span> · Despesa <span style="color:var(--red)">${fmtBRL(desp)}</span> · Saldo <b style="color:${rec-desp<0?'var(--red)':'var(--green)'}">${fmtBRL(rec-desp)}</b>${nFut?` · <a style="color:var(--acc);cursor:pointer;text-decoration:underline" onclick="S.tab.financeiro='futuros';render()">${nFut} lançamento(s) futuro(s)</a>`:''}</div>
    ${ls.length?`<div class="card" style="padding:6px 20px;">${renderDataTable('fin_lanc',applyTableSort('fin_lanc',ls),r=>`<button class="ibtn" title="abrir" onclick="openCard('fin','${r.id}')">⤢</button><button class="ibtn del" onclick="delLanc('${r.id}')">✕</button>`)}</div>`:'<div class="card"><div class="empty-msg">Nenhum lançamento encontrado com esses filtros.</div></div>'}`;
}

/* ── Contas: filtro + ordenação, independente dos Lançamentos ── */
/* ── Futuros: tudo com data à frente de hoje (parcelas e assinaturas a vencer) ── */
function finFuturos(b){
  const hoje=todayStr();
  const q=(S.q.finFut||'').toLowerCase();const f=S.f.finFut||{};
  let ls=S.fin.filter(l=>(l.data||'')>hoje&&
    (!q||[l.desc,l.cliente,l.categoria,l.tipoReceita].join(' ').toLowerCase().includes(q))&&
    (!f.tipo||l.tipo===f.tipo)&&
    (!f.mec||l.mecanismo===f.mec)&&
    (!f.conta||l.conta===f.conta));
  ls=[...ls].sort((a,b2)=>(a.data||'')>(b2.data||'')?1:-1);
  const rec=sum(ls.filter(x=>x.tipo==='receita'),x=>liq(x)),desp=sum(ls.filter(x=>x.tipo==='despesa'),x=>x.valor);
  const meses={};
  ls.forEach(l=>{const k=mesRef(l)||monthKey(l.data);if(!meses[k])meses[k]={rec:0,desp:0,n:0};
    meses[k].n++;if(l.tipo==='receita')meses[k].rec+=liq(l);else meses[k].desp+=l.valor;});
  const mk=Object.keys(meses).sort().slice(0,8);
  b.innerHTML=`
    <div class="card" style="margin-bottom:12px;font-size:12px;color:var(--t2);line-height:1.7;">
      O que ainda não aconteceu: parcelas e assinaturas com vencimento à frente de hoje.
      A aba <b>Lançamentos</b> mostra só o realizado e o atrasado — é lá que o passado fecha.
    </div>
    ${mk.length?`<div class="board" style="margin-bottom:14px;">${mk.map(k=>{
      const m=meses[k];const [y,mm]=k.split('-');
      return `<div class="col" style="min-width:150px;max-width:150px;"><div class="col-hd"><span class="col-name" style="text-transform:capitalize">${new Date(+y,+mm-1,1).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'})}</span></div>
        <div style="padding:4px 0 8px;">
          ${m.rec?`<div style="font-size:12px;color:var(--green)">+${fmtBRL(m.rec)}</div>`:''}
          ${m.desp?`<div style="font-size:12px;color:var(--red)">−${fmtBRL(m.desp)}</div>`:''}
          <div style="font-size:10.5px;color:var(--t3);margin-top:3px;">${m.n} lanç.</div>
        </div></div>`;}).join('')}</div>`:''}
    <div class="toolbar">
      <input class="search" placeholder="Buscar descrição, cliente, categoria..." value="${esc(S.q.finFut||'')}" oninput="S.q.finFut=this.value;render();setTimeout(()=>{const e=document.querySelector('.search');e.focus();e.setSelectionRange(e.value.length,e.value.length)},0)">
      <select class="fsel" onchange="S.f.finFut={...S.f.finFut,tipo:this.value};render()"><option value="">Tipo: Todos</option><option value="receita" ${f.tipo==='receita'?'selected':''}>Receitas</option><option value="despesa" ${f.tipo==='despesa'?'selected':''}>Despesas</option></select>
      <select class="fsel" onchange="S.f.finFut={...S.f.finFut,mec:this.value};render()"><option value="">Mecanismo: Todos</option>${MECANISMOS.map(m=>`<option ${f.mec===m?'selected':''}>${m}</option>`).join('')}</select>
      <select class="fsel" onchange="S.f.finFut={...S.f.finFut,conta:this.value};render()"><option value="">Conta: Todas</option>${CONTAS.map(c=>`<option ${f.conta===c.nome?'selected':''}>${c.nome}</option>`).join('')}</select>
      ${(f.tipo||f.mec||f.conta)?'<button class="btn-sm" onclick="S.f.finFut={};render()">Limpar filtros</button>':''}
      ${csvBtn('fin_lanc',ls)}
    </div>
    <div style="font-size:11.5px;color:var(--lx3);margin-bottom:10px;">${ls.length} a vencer · Receita prevista <span style="color:var(--green)">${fmtBRL(rec)}</span> · Despesa prevista <span style="color:var(--red)">${fmtBRL(desp)}</span> · Saldo previsto <b style="color:${rec-desp<0?'var(--red)':'var(--green)'}">${fmtBRL(rec-desp)}</b></div>
    ${ls.length?`<div class="card" style="padding:6px 20px;">${renderDataTable('fin_lanc',ls,r=>`<button class="ibtn" title="abrir" onclick="openCard('fin','${r.id}')">⤢</button><button class="ibtn del" onclick="delLanc('${r.id}')">✕</button>`)}</div>`:'<div class="card"><div class="empty-msg">Nenhum lançamento futuro.</div></div>'}`;
}

function finContas(b){
  const f=S.f.finContas||{};
  const srt=S.sort.finContas||{campo:'data',dir:'asc'};
  const aRec=S.fin.filter(f=>f.tipo==='receita'&&!f.pago);
  const aPag=S.fin.filter(f=>f.tipo==='despesa'&&!f.pago);
  const cls=arr=>{
    const atr=arr.filter(x=>x.data&&prazoStatus(x.data)?.cls==='atrasada');
    const hoje=arr.filter(x=>x.data&&prazoStatus(x.data)?.cls==='hoje');
    const sete=arr.filter(x=>x.data&&prazoStatus(x.data)?.diff>0&&prazoStatus(x.data).diff<=7);
    return{atr,hoje,sete};
  };
  const r=cls(aRec),p=cls(aPag);
  const passFilter=x=>(!f.cliente||x.cliente===f.cliente)&&(!f.cat||x.tipoReceita===f.cat||x.categoria===f.cat);
  const sorter=(a,b)=>{
    let av,bv;
    if(srt.campo==='valor'){av=a.tipo==='receita'?liq(a):a.valor;bv=b.tipo==='receita'?liq(b):b.valor;}
    else if(srt.campo==='cliente'){av=(a.cliente||'').toLowerCase();bv=(b.cliente||'').toLowerCase();}
    else{av=a.data||'';bv=b.data||'';}
    const cmp=av>bv?1:av<bv?-1:0;
    return srt.dir==='asc'?cmp:-cmp;
  };
  const CATU=[...new Set([...RTIPOS,...FCATS])];
  const toolbar=`<div class="toolbar">
    <select class="fsel" onchange="S.f.finContas={...S.f.finContas,cliente:this.value};render()"><option value="">Cliente: Todos</option>${clientes().map(c=>`<option ${f.cliente===c?'selected':''}>${c}</option>`).join('')}</select>
    <select class="fsel" onchange="S.f.finContas={...S.f.finContas,cat:this.value};render()"><option value="">Categoria: Todas</option>${CATU.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    <select class="fsel" onchange="S.sort.finContas={...srt,campo:this.value};render()"><option value="data" ${srt.campo==='data'?'selected':''}>Ordenar: Vencimento</option><option value="valor" ${srt.campo==='valor'?'selected':''}>Ordenar: Valor</option><option value="cliente" ${srt.campo==='cliente'?'selected':''}>Ordenar: Cliente</option></select>
    <button class="ibtn" title="Inverter ordem" onclick="S.sort.finContas={...srt,dir:srt.dir==='asc'?'desc':'asc'};render()">${srt.dir==='asc'?'↑':'↓'}</button>
    ${(f.cliente||f.cat)?'<button class="btn-sm" onclick="S.f.finContas={};render()">Limpar filtros</button>':''}
  </div>`;
  const box=(titulo,total,c,tipo,full)=>{
    const list=full.filter(passFilter).sort(sorter).slice(0,12);
    const hoje=todayStr();
    const lim=addM(hoje,1);
    const curto=full.filter(x=>!x.data||x.data<=lim);
    const futuro=full.filter(x=>x.data&&x.data>lim);
    const vf=sum(futuro,x=>tipo==='r'?liq(x):x.valor);
    return `
    <div class="card"><div class="widget-hd"><span class="widget-ttl">${titulo}</span>
    <span class="widget-more"><span style="color:var(--red)">Atrasado ${c.atr.length} · ${fmtBRL(sum(c.atr,x=>tipo==='r'?liq(x):x.valor))}</span> &nbsp; <span style="color:var(--amber)">Hoje ${c.hoje.length}</span> &nbsp; <span style="color:var(--blue)">7 dias ${c.sete.length}</span></span></div>
    <div class="metric" style="margin-bottom:2px">${fmtBRL(sum(curto,x=>tipo==='r'?liq(x):x.valor))}</div>
    <div class="metric-s" style="margin-bottom:10px">até 30 dias${vf?` · <span style="color:var(--t3)">+ ${fmtBRL(vf)} em compromissos futuros (${futuro.length})</span>`:''}</div>
    ${list.length?list.map(x=>{const ps=prazoStatus(x.data);
    return `<div class="row-item"><div><div class="ri-name">${esc(x.desc)}</div><div class="ri-sub">${esc(x.cliente)||'—'} · ${fmtD(x.data)} · <span style="color:${ps.cls==='atrasada'?'var(--red)':ps.cls==='hoje'?'var(--amber)':'var(--t3)'}">${ps.label}</span></div></div>
    <div style="display:flex;align-items:center;gap:8px"><span class="ri-val">${fmtBRL(tipo==='r'?liq(x):x.valor)}</span><button class="btn-sm" onclick="togglePago('${x.id}')">${tipo==='r'?'Receber':'Pagar'}</button></div></div>`;}).join(''):'<div class="empty-msg">Nada encontrado com esses filtros.</div>'}
    </div>`;
  };
  b.innerHTML=toolbar+`<div class="g2">${box('A receber',sum(aRec,x=>liq(x)),r,'r',aRec)}${box('A pagar',sum(aPag,x=>x.valor),p,'p',aPag)}</div>`;
}

/* ── Por cliente: ordenação ── */
function finPorCliente(b){
  const srt=S.sort.finCli||{campo:'resultado',dir:'desc'};
  const map={};
  S.fin.forEach(f=>{const k=f.cliente||'Sem cliente';map[k]=map[k]||{rec:0,desp:0};if(f.tipo==='receita')map[k].rec+=liq(f);else map[k].desp+=Number(f.valor||0);});
  const es=Object.entries(map).map(([cl,v])=>({cl,...v,res:v.rec-v.desp,margem:v.rec?(v.rec-v.desp)/v.rec*100:0}));
  es.sort((a,b)=>{
    let av,bv;
    if(srt.campo==='receita'){av=a.rec;bv=b.rec;}
    else if(srt.campo==='despesa'){av=a.desp;bv=b.desp;}
    else if(srt.campo==='margem'){av=a.margem;bv=b.margem;}
    else if(srt.campo==='cliente'){av=a.cl.toLowerCase();bv=b.cl.toLowerCase();}
    else{av=a.res;bv=b.res;}
    const cmp=av>bv?1:av<bv?-1:0;
    return srt.dir==='asc'?cmp:-cmp;
  });
  b.innerHTML=`<div class="toolbar">
    <select class="fsel" onchange="S.sort.finCli={...srt,campo:this.value};render()">
      <option value="resultado" ${srt.campo==='resultado'?'selected':''}>Ordenar: Resultado</option>
      <option value="receita" ${srt.campo==='receita'?'selected':''}>Ordenar: Receita</option>
      <option value="despesa" ${srt.campo==='despesa'?'selected':''}>Ordenar: Despesa</option>
      <option value="margem" ${srt.campo==='margem'?'selected':''}>Ordenar: Margem</option>
      <option value="cliente" ${srt.campo==='cliente'?'selected':''}>Ordenar: Cliente</option>
    </select>
    <button class="ibtn" title="Inverter ordem" onclick="S.sort.finCli={...srt,dir:srt.dir==='asc'?'desc':'asc'};render()">${srt.dir==='asc'?'↑':'↓'}</button>
    ${colBtn('fin_cliente')}${csvBtn('fin_cliente',es)}
  </div>`+
  (es.length?`<div class="card" style="padding:6px 20px;">${renderDataTable('fin_cliente',applyTableSort('fin_cliente',es))}</div>`:'<div class="card"><div class="empty-msg">Nenhum projeto com lançamentos ainda. Vincule receitas e despesas a clientes para ver rentabilidade.</div></div>');
}

/* ═══ ANÁLISES — motor de pivô + gráfico livre sobre S.fin ═══
   Dimensões e medidas centralizadas (mesmo espírito do COLDEFS), um
   pivô simples (agrupar + agregar) e um wrapper fino sobre Chart.js.
   Filtros e config de visualização ficam em S.f.finAn (mesmo padrão de
   S.f.finLanc); presets salvos persistem em S.finPresets. */
const finLiqOrValor=r=>r.tipo==='receita'?liq(r):Number(r.valor||0);
const FIN_DIMS={
  mes:{label:'Mês (referência — competência/fatura)',get:l=>mesRef(l),chrono:true},
  mesData:{label:'Mês (data — vencimento/pagamento)',get:l=>monthKey(l.data),chrono:true},
  cliente:{label:'Cliente',get:l=>l.cliente||'Sem cliente'},
  categoria:{label:'Categoria / Tipo',get:l=>l.tipo==='receita'?(l.tipoReceita||'Outros'):(l.categoria||'Outros')},
  natureza:{label:'Natureza',get:l=>l.natureza||'—'},
  mecanismo:{label:'Mecanismo',get:l=>l.mecanismo||'—'},
  conta:{label:'Conta',get:l=>l.conta||'—'},
  forma:{label:'Forma de pagamento',get:l=>l.forma||'—'},
  status:{label:'Status',get:l=>l.pago?'Pago/Recebido':'Pendente'},
  tipo:{label:'Receita/Despesa',get:l=>l.tipo==='receita'?'Receita':'Despesa'}
};
const FIN_MEDS={
  valorLiq:{label:'Valor (líq. receita / bruto despesa)',calc:rows=>sum(rows,finLiqOrValor)},
  valorBruto:{label:'Valor bruto',calc:rows=>sum(rows,r=>Number(r.valor||0))},
  contagem:{label:'Nº de lançamentos',calc:rows=>rows.length},
  ticketMedio:{label:'Ticket médio',calc:rows=>rows.length?sum(rows,finLiqOrValor)/rows.length:0}
};
const FIN_PRESETS_DEFAULT=[
  {nome:'Receita líquida por mês',dim:'mes',med:'valorLiq',chart:'line',filtros:{tipo:'receita'}},
  {nome:'Despesa por categoria',dim:'categoria',med:'valorLiq',chart:'doughnut',filtros:{tipo:'despesa'}},
  {nome:'Resultado por cliente',dim:'cliente',med:'valorLiq',chart:'bar',filtros:{}}
];
function finAnFiltered(){
  const flt=(S.f.finAn&&S.f.finAn.filtros)||{};
  return S.fin.filter(l=>
    (!flt.tipo||l.tipo===flt.tipo)&&
    (!flt.status||(flt.status==='pago'?l.pago:!l.pago))&&
    (!flt.cat||l.tipoReceita===flt.cat||l.categoria===flt.cat)&&
    (!flt.nat||l.natureza===flt.nat)&&
    (!flt.mec||l.mecanismo===flt.mec)&&
    (!flt.conta||l.conta===flt.conta)&&
    (!flt.cliente||l.cliente===flt.cliente)&&
    (!flt.de||mesRef(l)>=flt.de)&&
    (!flt.ate||mesRef(l)<=flt.ate));
}
function finPivot(rows,dimKey){
  const dim=FIN_DIMS[dimKey]||FIN_DIMS.mes;
  const groups={};
  rows.forEach(r=>{const k=dim.get(r);(groups[k]=groups[k]||[]).push(r);});
  const entries=Object.entries(groups);
  if(dim.chrono)entries.sort((a,b)=>a[0].localeCompare(b[0]));
  return entries;
}
function finAnData(dimKey,medKey,rows){
  const med=FIN_MEDS[medKey]||FIN_MEDS.valorLiq;
  let out=finPivot(rows,dimKey).map(([label,rs])=>({label,value:med.calc(rs)}));
  if(!(FIN_DIMS[dimKey]||FIN_DIMS.mes).chrono)out=out.sort((a,b)=>b.value-a.value);
  return out;
}
let finChartObj=null;
function finRenderChart(){
  const el=document.getElementById('fin-an-canvas');
  if(!el||typeof Chart==='undefined')return;
  const a=S.f.finAn||{};
  const dimKey=a.dim||'mes',medKey=a.med||'valorLiq',chartType=a.chart||'line';
  const data=finAnData(dimKey,medKey,finAnFiltered());
  if(finChartObj){finChartObj.destroy();finChartObj=null;}
  const cores=['#4E1A1D','#8C4A3A','#B98A5E','#6E6E6E','#2563EB','#15803D','#D97706','#DC2626','#7C3AED','#0891B2'];
  const isPie=chartType==='pie'||chartType==='doughnut';
  finChartObj=new Chart(el,{
    type:chartType,
    data:{labels:data.map(d=>d.label),datasets:[{
      label:FIN_MEDS[medKey].label,
      data:data.map(d=>d.value),
      backgroundColor:isPie?data.map((_,i)=>cores[i%cores.length]):hexA('#4E1A1D',0.75),
      borderColor:isPie?'#fff':'#4E1A1D',
      borderWidth:isPie?2:1,
      tension:.3,

function parcInfo(p){
  const regs=S.fin.filter(f=>f.grupoId===p.grupoId).sort((a,b)=>String(a.data).localeCompare(b.data));
  const pagos=regs.filter(x=>x.pago);
  const valorParcela=p.valorTotal/p.nParcelas;
  const n=pagos.length;
  const quitado=n>=p.nParcelas;
  /* próxima = 1º registro não pago; se não houver registro, será criado */
  const pendente=regs.find(x=>!x.pago)||null;
  const ultima=regs.length?regs[regs.length-1].data:null;
  const proxData=quitado?null:(pendente?pendente.data:(ultima?addM(ultima,1):p.primeira));
  const pagoTotal=sum(pagos,x=>x.valor);
  return{pagas:n,valorParcela,quitado,proxData,pendente,pagoTotal,restante:Math.max(0,p.valorTotal-pagoTotal)};
}
function assinInfo(a){
  const regs=S.fin.filter(f=>f.assinId===a.id).sort((x,y)=>String(x.data).localeCompare(y.data));
  const pagos=regs.filter(x=>x.pago);
  const pendente=regs.find(x=>!x.pago)||null;
  const ultima=pagos.length?pagos[pagos.length-1].data:null;
  return{cobrancas:pagos.length,ultima,pendente,prox:pendente?pendente.data:(ultima?addM(ultima,1):todayStr())};
}
function lancarParcela(pid){
  const p=S.parc.find(x=>x.id===pid);if(!p)return;
  const i=parcInfo(p);if(i.quitado)return;

  S.fin.push({id:uid('f'),tipo:'despesa',desc:p.nome,valor:Math.round(i.valorParcela*100)/100,data:i.proxData,
    categoria:p.categoria,natureza:p.natureza||'Fixo',mecanismo:'Parcelamento',forma:p.conta==='Conta PJ'?'PIX':'Crédito',
