<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lozy Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4E1A1D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lozy">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  /* fundo: escuro suave, sem preto */
  --bg:#d4d4d4;--chrome:#cdcdcd;--bline:#adadad;--acc:#161616;--accT:#f5f5f5;
  /* superfícies claras (paleta aprovada do dashboard) */
  --s1:#cfcfcf;--s2:#c2c2c2;--s3:#b5b5b5;
  --b1:#b6b6b6;--b2:#a8a8a8;--b3:#8f8f8f;
  /* texto sobre superfícies claras */
  --t1:#161616;--t2:#454545;--t3:#6e6e6e;
  /* texto sobre o fundo escuro */
  --lx1:#161616;--lx2:#454545;--lx3:#6e6e6e;
  /* aliases legados (widgets claros) */
  --lt:#cfcfcf;--lt2:#c2c2c2;--ltb:#b0b0b0;--dk1:#161616;--dk2:#454545;--dk3:#6e6e6e;
  --green:#16a34a;--red:#dc2626;--amber:#d97706;--blue:#2563eb;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--lx1);font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;}
button,input,select,textarea{font-family:inherit;letter-spacing:inherit;font-size:inherit;}
#app{display:flex;min-height:100vh;}
/* SIDEBAR */
#sidebar{width:64px;flex-shrink:0;border-right:1px solid var(--bline);display:flex;flex-direction:column;padding:14px 10px;gap:2px;position:sticky;top:0;height:100vh;background:var(--chrome);z-index:20;transition:width .18s ease;overflow-y:auto;overflow-x:hidden;}
#sidebar.exp{width:216px;}
.sb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-shrink:0;}
#sidebar:not(.exp) .sb-head{flex-direction:column;gap:8px;}
.sb-tgl{width:24px;height:24px;border-radius:7px;border:1px solid var(--bline);background:transparent;color:var(--lx3);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .13s;flex-shrink:0;}
.sb-tgl:hover{color:var(--lx1);}
.nav-grp{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--lx3);margin:14px 8px 6px;font-weight:600;white-space:nowrap;}
.nav-sep{height:12px;}
.nlbl{font-size:12.5px;font-weight:500;white-space:nowrap;}
.soon{font-style:normal;font-size:8.5px;border:1px solid var(--bline);border-radius:999px;padding:1px 6px;color:var(--lx3);margin-left:4px;vertical-align:1px;}
.logo{width:32px;height:32px;border-radius:9px;background:var(--acc);color:var(--accT);display:flex;align-items:center;justify-content:center;font-weight:650;font-size:14px;margin-bottom:16px;flex-shrink:0;}
.snav{width:100%;height:34px;border-radius:9px;border:none;background:transparent;color:var(--lx3);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;position:relative;transition:all .13s;flex-shrink:0;}
#sidebar.exp .snav{justify-content:flex-start;padding:0 10px;}
.snav svg{width:16px;height:16px;}
.snav:hover{background:rgba(0,0,0,.06);color:var(--lx2);}
.snav.active{background:rgba(0,0,0,.1);color:var(--lx1);}
.snav .tip{position:absolute;left:46px;top:50%;transform:translateY(-50%);background:#efefef;border:1px solid #a6a6a6;padding:5px 10px;border-radius:7px;font-size:11.5px;color:#161616;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.15);}
.snav:hover .tip{opacity:1;}
.snav-spacer{flex:1;}
.avatar{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.06);border:1px solid var(--bline);color:var(--lx2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;}
/* TOPBAR */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;justify-content:flex-end;padding:0 26px;height:50px;border-bottom:1px solid var(--bline);position:sticky;top:0;background:rgba(212,212,212,.9);backdrop-filter:blur(14px);z-index:10;}
.tb-r{display:flex;align-items:center;gap:8px;}
.badge-ver{font-size:11px;color:var(--lx3);border:1px solid var(--bline);border-radius:999px;padding:3px 9px;}
/* BUTTONS */
.btn{background:var(--acc);color:var(--accT);border:none;border-radius:999px;padding:7px 15px;font-size:12.5px;font-weight:550;cursor:pointer;transition:opacity .15s;white-space:nowrap;}
.btn:hover{opacity:.85;}
.btn-ghost{background:transparent;color:var(--lx2);border:1px solid #9a9a9a;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:500;cursor:pointer;transition:all .13s;white-space:nowrap;}
.btn-ghost:hover{color:var(--lx1);border-color:#7a7a7a;}
.btn-sm{background:transparent;color:var(--t2);border:1px solid #9a9a9a;border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:500;cursor:pointer;transition:all .13s;}
.btn-sm:hover{color:var(--t1);border-color:#7a7a7a;}
.ibtn{width:22px;height:22px;border-radius:6px;border:1px solid #9a9a9a;background:transparent;color:var(--t3);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0;}
.ibtn:hover{color:var(--t1);background:rgba(0,0,0,.07);}
.ibtn.del:hover{color:var(--red);}
/* CONTENT */
#content{padding:26px 26px 90px;flex:1;}
.page-hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
.page-title{font-size:19px;font-weight:600;letter-spacing:-0.02em;color:var(--lx1);}
.page-sub{font-size:12px;color:var(--lx3);margin-top:3px;}
/* TABS — pill clara com ativo invertido */
.tabs{display:flex;gap:4px;border:1px solid var(--ltb);border-radius:12px;padding:4px;background:var(--s1);margin-bottom:18px;overflow-x:auto;width:max-content;max-width:100%;}
.tab{border:none;background:transparent;color:var(--t3);font-size:12px;font-weight:500;padding:6px 13px;border-radius:8px;cursor:pointer;transition:all .13s;white-space:nowrap;}
.tab:hover{color:var(--t1);}
.tab.active{background:var(--acc);color:var(--accT);}
/* TOOLBAR */
.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search{flex:1;min-width:180px;background:var(--s1);border:1px solid var(--ltb);border-radius:9px;padding:8px 12px;color:var(--t1);font-size:12.5px;}
.search::placeholder{color:var(--t3);}
.search:focus{outline:none;border-color:var(--b3);}
.fsel{background:var(--s1);border:1px solid var(--ltb);border-radius:9px;padding:8px 10px;color:var(--t2);font-size:12px;cursor:pointer;}
.fsel:focus{outline:none;border-color:var(--b3);}
/* CARDS — todos claros agora */
.card{background:var(--s1);border:1px solid var(--ltb);border-radius:var(--r);padding:20px;color:var(--t1);transition:border-color .2s;}
.card:hover{border-color:var(--b3);}
.wl{background:var(--lt);border:1px solid var(--ltb);border-radius:var(--r);padding:20px;color:var(--dk1);}
.wl .clabel{color:var(--dk3);}
.wl .metric{color:var(--dk1);}
.wl .metric-s{color:var(--dk2);}
.wl .widget-ttl{color:var(--dk1);}
.wl .widget-more{color:var(--dk3);}
.wl .empty-msg{color:var(--dk3);}
.clabel{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-bottom:9px;}
.metric{font-size:22px;font-weight:600;letter-spacing:-0.025em;}
.metric-s{font-size:12px;color:var(--t3);margin-top:4px;}
.widget-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;}
.widget-ttl{font-size:12.5px;font-weight:550;}
.widget-more{font-size:11.5px;color:var(--t3);}
.empty-msg{font-size:12px;color:var(--t3);padding:8px 0;}
/* DASH GRID (widgets) */
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;}
.dw-1{grid-column:span 1;}
.dw-2{grid-column:span 2;}
@media(max-width:520px){.dw-2{grid-column:span 1;}}
/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;}
.g-mc{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-bottom:12px;}
.eyebrow{font-size:11px;color:var(--lx3);text-transform:capitalize;margin-bottom:5px;}
.greeting{font-size:22px;font-weight:600;letter-spacing:-0.025em;margin-bottom:24px;color:var(--lx1);}
/* WEEK CAL */
.wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.wk-cell{border-radius:10px;padding:8px 4px;text-align:center;background:var(--lt2);}
.wk-dow{font-size:9px;color:var(--dk3);text-transform:uppercase;font-weight:550;letter-spacing:.05em;}
.wk-num{font-size:14px;font-weight:600;color:var(--dk1);margin-top:2px;}
.wk-cell.today{background:var(--acc);}
.wk-cell.today .wk-dow{color:#9a9a9a;}
.wk-cell.today .wk-num{color:var(--accT);}
.wk-dot{width:4px;height:4px;border-radius:50%;background:var(--dk2);margin:3px auto 0;visibility:hidden;}
.wk-cell.has .wk-dot{visibility:visible;}
.wk-cell.today .wk-dot{background:#bbb;}
/* CHART */
.chart-bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px;}
.cb-group{flex:1;display:flex;align-items:flex-end;gap:3px;height:100%;}
.cb{flex:1;border-radius:4px 4px 2px 2px;min-height:2px;}
.cb.rec{background:var(--dk1);}
.cb.desp{background:#7a7a7a;}
.chart-lbls{display:flex;gap:10px;margin-top:8px;}
.chart-lbls span{flex:1;text-align:center;font-size:10px;color:var(--dk3);text-transform:uppercase;}
.chart-leg{display:flex;gap:14px;margin-top:10px;}
.chart-leg .lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dk2);}
.chart-leg i{width:10px;height:10px;border-radius:3px;display:inline-block;}
/* ROWS / TABLES */
.row-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ltb);}
.row-item:last-child{border-bottom:none;}
.ri-name{font-size:12.5px;font-weight:500;}
.ri-sub{font-size:11.5px;color:var(--t3);margin-top:1px;}
.ri-val{font-size:12.5px;font-weight:550;flex-shrink:0;margin-left:12px;}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tbl-wrap::-webkit-scrollbar{height:5px;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:10.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;padding:0 10px 10px 0;text-align:left;border-bottom:1px solid var(--b1);}
.tbl td{padding:11px 10px 11px 0;border-bottom:1px solid var(--b1);vertical-align:middle;font-size:12.5px;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:rgba(0,0,0,.035);}
.tacts{display:flex;gap:4px;opacity:0;transition:opacity .13s;}
tr:hover .tacts{opacity:1;}
/* BADGES / DOTS */
.bdg{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid #a2a2a2;color:#555;font-weight:500;white-space:nowrap;}
.bdg.quente{color:var(--red);}.bdg.morno{color:var(--amber);}.bdg.frio{color:var(--blue);}
.bdg.alta{color:var(--red);}.bdg.media{color:var(--amber);}.bdg.baixa{color:var(--blue);}
.sdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;flex-shrink:0;}
.s-gray{background:#8a8a8a;}.s-amber{background:var(--amber);}.s-green{background:var(--green);}.s-red{background:var(--red);}.s-blue{background:var(--blue);}
/* KANBAN — cards claros sobre fundo */
#board,.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:14px;}
.col{min-width:232px;max-width:232px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;}
.col-hd{display:flex;justify-content:space-between;align-items:center;padding:0 2px;}
.col-name{font-size:12px;font-weight:550;color:var(--lx2);}
.col-stat{font-size:11px;color:var(--lx3);}
.col-body{display:flex;flex-direction:column;gap:8px;min-height:40px;}
.kcard{background:var(--s1);border:1px solid var(--ltb);border-radius:12px;padding:13px 14px;color:var(--t1);transition:border-color .15s;}
.kcard:hover{border-color:var(--b3);}
.kc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:2px;}
.kc-name{font-size:12.5px;font-weight:550;}
.kc-sub{font-size:11.5px;color:var(--t3);margin-bottom:10px;}
.kc-ft{display:flex;justify-content:space-between;align-items:center;}
.kc-val{font-size:12.5px;font-weight:550;}
.kc-acts{display:flex;gap:4px;opacity:0;transition:opacity .13s;}
.kcard:hover .kc-acts{opacity:1;}
.col-empty{border:1px dashed #a0a0a0;border-radius:10px;padding:16px 10px;text-align:center;font-size:11px;color:var(--lx3);}
/* MEU DIA */
.day-lbl{font-size:10.5px;color:var(--dk3);text-transform:uppercase;letter-spacing:.08em;font-weight:550;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--ltb);}
.task-input-wrap{display:flex;gap:8px;margin-bottom:10px;}
.task-input{flex:1;background:rgba(255,255,255,.55);border:1px solid var(--ltb);border-radius:8px;padding:8px 11px;color:var(--dk1);font-size:12.5px;}
.task-input::placeholder{color:var(--dk3);}
.task-input:focus{outline:none;border-color:var(--dk3);}
.task-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--ltb);}
.task-item:last-child{border-bottom:none;}
.tk-check{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--dk3);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .13s;}
.tk-check.done{background:var(--acc);border-color:var(--acc);}
.tk-check.done::after{content:'✓';font-size:9px;color:var(--accT);font-weight:700;}
.tk-text{flex:1;font-size:12.5px;color:var(--dk1);}
.tk-text.done{color:var(--dk3);text-decoration:line-through;}
.tk-del{width:20px;height:20px;border:none;background:transparent;color:var(--dk3);cursor:pointer;font-size:12px;opacity:0;transition:opacity .13s;}
.task-item:hover .tk-del{opacity:1;}
.tk-del:hover{color:#b91c1c;}
.dem-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--ltb);}
.dem-item:last-child{border-bottom:none;}
.dem-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.dem-dot.atrasada{background:#dc2626;}
.dem-dot.hoje{background:#d97706;}
.dem-body{flex:1;min-width:0;}
.dem-name{font-size:12.5px;font-weight:500;color:var(--dk1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dem-meta{font-size:11.5px;color:var(--dk3);}
.dem-prazo{font-size:11px;flex-shrink:0;margin-left:8px;font-weight:550;}
.dem-prazo.atrasada{color:#dc2626;}
.dem-prazo.hoje{color:#d97706;}
/* GROUP VIEW */
.grp{margin-bottom:18px;}
.grp-hd{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid #a0a0a0;margin-bottom:4px;}
.grp-name{font-size:12.5px;font-weight:600;color:var(--lx1);}
.grp-stat{font-size:11px;color:var(--lx3);}
/* AGENDA */
.ag-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.ag-day{background:var(--s1);border:1px solid var(--ltb);border-radius:12px;min-height:150px;padding:10px;color:var(--t1);}
.ag-day.today{border-color:var(--acc);border-width:1.5px;}
.ag-dhd{font-size:10px;color:var(--t3);text-transform:uppercase;font-weight:550;}
.ag-dnum{font-size:15px;font-weight:600;margin:1px 0 8px;}
.ag-ev{background:var(--s2);border:1px solid var(--b2);border-radius:7px;padding:6px 8px;margin-bottom:5px;font-size:11px;transition:border-color .15s,transform .15s;}
.ag-ev .t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ag-ev:hover{border-color:var(--acc);transform:translateY(-1px);}
.ag-ev .h{color:var(--t3);font-size:10px;margin-top:1px;}
.ag-ev a{color:var(--t3);text-decoration:none;font-size:10px;}
.ag-ev a:hover{color:var(--t1);}
.ev-reuniao{border-left:2px solid var(--blue);}
.ev-gravacao{border-left:2px solid var(--red);}
.ev-edicao{border-left:2px solid var(--amber);}
.ev-entrega{border-left:2px solid var(--green);}
.ev-outro{border-left:2px solid #8a8a8a;}
.ev-prazo{border-left:2px solid #9333ea;}
/* WIZARD */
.wiz-steps{display:flex;align-items:center;gap:6px;margin-bottom:22px;flex-wrap:wrap;}
.wstep{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--lx3);padding:5px 12px;border-radius:999px;border:1px solid #9a9a9a;}
.wstep.done{color:#15803d;border-color:#8fbf9f;}
.wstep.cur{color:var(--lx1);border-color:#8a8a8a;background:rgba(0,0,0,.05);}
.wstep .n{width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;font-size:9.5px;}
.wiz-body{max-width:640px;}
.wiz-nav{display:flex;justify-content:space-between;margin-top:22px;max-width:640px;}
.entrega-row{display:grid;grid-template-columns:1fr 64px 100px 30px;gap:8px;margin-bottom:8px;align-items:center;}
.preset-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.ppill{font-size:10.5px;padding:4px 10px;border-radius:999px;border:1px solid #9a9a9a;background:transparent;color:var(--t2);cursor:pointer;transition:all .12s;}
.ppill:hover{color:var(--t1);border-color:#7a7a7a;background:rgba(0,0,0,.05);}
.inv-box{background:var(--s2);border:1px solid var(--b2);border-radius:12px;padding:16px;margin-top:14px;}
.inv-line{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;color:var(--t2);}
.inv-line.total{border-top:1px solid var(--b3);margin-top:6px;padding-top:10px;font-weight:600;color:var(--t1);font-size:14px;}
/* MODAL */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
#overlay.show{display:flex;}
#modal{background:var(--s1);border:1px solid var(--b2);border-radius:16px;width:100%;max-width:400px;padding:24px;max-height:88vh;overflow-y:auto;color:var(--t1);}
#modal.wide{max-width:760px;}
#modal h2{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--t1);}
.field{margin-bottom:12px;}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field label{display:block;font-size:11px;color:var(--t3);margin-bottom:5px;font-weight:500;}
.field input,.field select,.field textarea{width:100%;background:rgba(255,255,255,.55);border:1px solid var(--b2);border-radius:8px;padding:9px 11px;color:var(--t1);font-size:13px;transition:border-color .13s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--t3);}
.field input::placeholder,.field textarea::placeholder{color:var(--t3);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
/* PLACEHOLDER */
.ph-wrap{max-width:420px;padding:30px 0;}
.ph-tag{display:inline-block;font-size:10.5px;color:var(--lx2);border:1px solid #9a9a9a;border-radius:999px;padding:3px 10px;margin-bottom:14px;font-weight:500;}
.ph-wrap h3{font-size:16px;font-weight:600;margin-bottom:6px;color:var(--lx1);}
.ph-wrap p{font-size:12.5px;color:var(--lx2);line-height:1.65;}
/* MENU MAIS (mobile) */
.mais-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mais-item{display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:11px;border:1px solid var(--ltb);background:transparent;color:var(--t1);cursor:pointer;text-align:left;font-size:12.5px;font-weight:500;}
.mais-item.sel{border-color:var(--acc);background:rgba(0,0,0,.04);}
.mais-ic{display:flex;flex-shrink:0;color:var(--t3);}
.mais-ic svg{width:17px;height:17px;}
.mais-lb{min-width:0;}
/* MOBILE */
#bottomnav{display:none;}
@media(max-width:860px){
  #sidebar{display:none;}
  #content{padding:18px 12px 104px;}
  #topbar{padding:0 12px;height:48px;}
  .page-hd{align-items:flex-start;gap:10px;}
  .page-title{font-size:17px;}
  .g3,.g4,.kpis{grid-template-columns:1fr 1fr;}
  .g2,.g-mc{grid-template-columns:1fr;}
  .dash-grid{grid-template-columns:repeat(2,1fr);}
  .greeting{font-size:19px;}
  .card,.wl{padding:15px;}
  .metric{font-size:19px;}
  /* toolbars: filtros roláveis em vez de empilhar */
  .toolbar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
  .toolbar::-webkit-scrollbar{height:0;}
  .search{min-width:150px;flex:0 0 auto;width:55%;}
  .fsel,.toolbar .btn-sm,.toolbar .btn-ghost{flex:0 0 auto;}
  /* abas roláveis */
  .tabs{width:100%;overflow-x:auto;}
  .tabs::-webkit-scrollbar{height:0;}
  /* tabelas: rolagem horizontal, sem espremer colunas */
  .tbl{min-width:620px;}
  .tacts{opacity:1;}
  /* kanban ocupa quase a tela toda */
  .col{min-width:76vw;max-width:76vw;}
  .board{scroll-snap-type:x mandatory;}
  .col{scroll-snap-align:start;}
  /* agenda em coluna única legível */
  .ag-week{grid-template-columns:1fr;gap:6px;}
  .ag-day{min-height:auto;}
  /* formulários e wizard */
  .f2{grid-template-columns:1fr;}
  .wiz-body,.wiz-nav{max-width:100%;}
  .entrega-row{grid-template-columns:1fr 46px 78px 26px;gap:6px;}
  .preset-pills{max-height:132px;overflow-y:auto;}
  #modal{padding:18px;border-radius:14px;max-height:86vh;}
  .modal-actions{position:sticky;bottom:-18px;background:var(--s1);padding-top:10px;}
  .cli-grid{grid-template-columns:1fr 1fr;}
  .theme-grid{grid-template-columns:1fr 1fr;}
  /* barra inferior */
  #bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(205,205,205,.96);backdrop-filter:blur(16px);border-top:1px solid var(--bline);padding:8px 2px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;z-index:50;}
  .bn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--lx3);font-size:9px;font-weight:500;cursor:pointer;padding:2px 6px;min-width:52px;}
  .bn svg{width:18px;height:18px;}
  .bn.active{color:var(--acc);}
  /* chat da IA não cobre a barra */
  .ai-fab{bottom:78px;right:14px;}
  .ai-panel{right:8px;left:8px;width:auto;bottom:134px;max-height:58vh;}
}
@media(max-width:520px){.dw-2{grid-column:span 1;}}
/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;}
.g-mc{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-bottom:12px;}
.eyebrow{font-size:11px;color:var(--lx3);text-transform:capitalize;margin-bottom:5px;}
.greeting{font-size:22px;font-weight:600;letter-spacing:-0.025em;margin-bottom:24px;color:var(--lx1);}
/* WEEK CAL */
.wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.wk-cell{border-radius:10px;padding:8px 4px;text-align:center;background:var(--lt2);}
.wk-dow{font-size:9px;color:var(--dk3);text-transform:uppercase;font-weight:550;letter-spacing:.05em;}
.wk-num{font-size:14px;font-weight:600;color:var(--dk1);margin-top:2px;}
.wk-cell.today{background:var(--acc);}
.wk-cell.today .wk-dow{color:#9a9a9a;}
.wk-cell.today .wk-num{color:var(--accT);}
.wk-dot{width:4px;height:4px;border-radius:50%;background:var(--dk2);margin:3px auto 0;visibility:hidden;}
.wk-cell.has .wk-dot{visibility:visible;}
.wk-cell.today .wk-dot{background:#bbb;}
/* CHART */
.chart-bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px;}
.cb-group{flex:1;display:flex;align-items:flex-end;gap:3px;height:100%;}
.cb{flex:1;border-radius:4px 4px 2px 2px;min-height:2px;}
.cb.rec{background:var(--dk1);}
.cb.desp{background:#7a7a7a;}
.chart-lbls{display:flex;gap:10px;margin-top:8px;}
.chart-lbls span{flex:1;text-align:center;font-size:10px;color:var(--dk3);text-transform:uppercase;}
.chart-leg{display:flex;gap:14px;margin-top:10px;}
.chart-leg .lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dk2);}
.chart-leg i{width:10px;height:10px;border-radius:3px;display:inline-block;}
/* ROWS / TABLES */
.row-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ltb);}
.row-item:last-child{border-bottom:none;}
.ri-name{font-size:12.5px;font-weight:500;}
.ri-sub{font-size:11.5px;color:var(--t3);margin-top:1px;}
.ri-val{font-size:12.5px;font-weight:550;flex-shrink:0;margin-left:12px;}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tbl-wrap::-webkit-scrollbar{height:5px;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:10.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;font-weight:500;padding:0 10px 10px 0;text-align:left;border-bottom:1px solid var(--b1);}
.tbl td{padding:11px 10px 11px 0;border-bottom:1px solid var(--b1);vertical-align:middle;font-size:12.5px;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:rgba(0,0,0,.035);}
.tacts{display:flex;gap:4px;opacity:0;transition:opacity .13s;}
tr:hover .tacts{opacity:1;}
/* BADGES / DOTS */
.bdg{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid #a2a2a2;color:#555;font-weight:500;white-space:nowrap;}
.bdg.quente{color:var(--red);}.bdg.morno{color:var(--amber);}.bdg.frio{color:var(--blue);}
.bdg.alta{color:var(--red);}.bdg.media{color:var(--amber);}.bdg.baixa{color:var(--blue);}
.sdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;flex-shrink:0;}
.s-gray{background:#8a8a8a;}.s-amber{background:var(--amber);}.s-green{background:var(--green);}.s-red{background:var(--red);}.s-blue{background:var(--blue);}
/* KANBAN — cards claros sobre fundo */
#board,.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:14px;}
.col{min-width:232px;max-width:232px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;}
.col-hd{display:flex;justify-content:space-between;align-items:center;padding:0 2px;}
.col-name{font-size:12px;font-weight:550;color:var(--lx2);}
.col-stat{font-size:11px;color:var(--lx3);}
.col-body{display:flex;flex-direction:column;gap:8px;min-height:40px;}
.kcard{background:var(--s1);border:1px solid var(--ltb);border-radius:12px;padding:13px 14px;color:var(--t1);transition:border-color .15s;}
.kcard:hover{border-color:var(--b3);}
.kc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:2px;}
.kc-name{font-size:12.5px;font-weight:550;}
.kc-sub{font-size:11.5px;color:var(--t3);margin-bottom:10px;}
.kc-ft{display:flex;justify-content:space-between;align-items:center;}
.kc-val{font-size:12.5px;font-weight:550;}
.kc-acts{display:flex;gap:4px;opacity:0;transition:opacity .13s;}
.kcard:hover .kc-acts{opacity:1;}
.col-empty{border:1px dashed #a0a0a0;border-radius:10px;padding:16px 10px;text-align:center;font-size:11px;color:var(--lx3);}
/* MEU DIA */
.day-lbl{font-size:10.5px;color:var(--dk3);text-transform:uppercase;letter-spacing:.08em;font-weight:550;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--ltb);}
.task-input-wrap{display:flex;gap:8px;margin-bottom:10px;}
.task-input{flex:1;background:rgba(255,255,255,.55);border:1px solid var(--ltb);border-radius:8px;padding:8px 11px;color:var(--dk1);font-size:12.5px;}
.task-input::placeholder{color:var(--dk3);}
.task-input:focus{outline:none;border-color:var(--dk3);}
.task-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--ltb);}
.task-item:last-child{border-bottom:none;}
.tk-check{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--dk3);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .13s;}
.tk-check.done{background:var(--acc);border-color:var(--acc);}
.tk-check.done::after{content:'✓';font-size:9px;color:var(--accT);font-weight:700;}
.tk-text{flex:1;font-size:12.5px;color:var(--dk1);}
.tk-text.done{color:var(--dk3);text-decoration:line-through;}
.tk-del{width:20px;height:20px;border:none;background:transparent;color:var(--dk3);cursor:pointer;font-size:12px;opacity:0;transition:opacity .13s;}
.task-item:hover .tk-del{opacity:1;}
.tk-del:hover{color:#b91c1c;}
.dem-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--ltb);}
.dem-item:last-child{border-bottom:none;}
.dem-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.dem-dot.atrasada{background:#dc2626;}
.dem-dot.hoje{background:#d97706;}
.dem-body{flex:1;min-width:0;}
.dem-name{font-size:12.5px;font-weight:500;color:var(--dk1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dem-meta{font-size:11.5px;color:var(--dk3);}
.dem-prazo{font-size:11px;flex-shrink:0;margin-left:8px;font-weight:550;}
.dem-prazo.atrasada{color:#dc2626;}
.dem-prazo.hoje{color:#d97706;}
/* GROUP VIEW */
.grp{margin-bottom:18px;}
.grp-hd{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid #a0a0a0;margin-bottom:4px;}
.grp-name{font-size:12.5px;font-weight:600;color:var(--lx1);}
.grp-stat{font-size:11px;color:var(--lx3);}
/* AGENDA */
.ag-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.ag-day{background:var(--s1);border:1px solid var(--ltb);border-radius:12px;min-height:150px;padding:10px;color:var(--t1);}
.ag-day.today{border-color:var(--acc);border-width:1.5px;}
.ag-dhd{font-size:10px;color:var(--t3);text-transform:uppercase;font-weight:550;}
.ag-dnum{font-size:15px;font-weight:600;margin:1px 0 8px;}
.ag-ev{background:var(--s2);border:1px solid var(--b2);border-radius:7px;padding:6px 8px;margin-bottom:5px;font-size:11px;transition:border-color .15s,transform .15s;}
.ag-ev .t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ag-ev:hover{border-color:var(--acc);transform:translateY(-1px);}
.ag-ev .h{color:var(--t3);font-size:10px;margin-top:1px;}
.ag-ev a{color:var(--t3);text-decoration:none;font-size:10px;}
.ag-ev a:hover{color:var(--t1);}
.ev-reuniao{border-left:2px solid var(--blue);}
.ev-gravacao{border-left:2px solid var(--red);}
.ev-edicao{border-left:2px solid var(--amber);}
.ev-entrega{border-left:2px solid var(--green);}
.ev-outro{border-left:2px solid #8a8a8a;}
.ev-prazo{border-left:2px solid #9333ea;}
/* WIZARD */
.wiz-steps{display:flex;align-items:center;gap:6px;margin-bottom:22px;flex-wrap:wrap;}
.wstep{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--lx3);padding:5px 12px;border-radius:999px;border:1px solid #9a9a9a;}
.wstep.done{color:#15803d;border-color:#8fbf9f;}
.wstep.cur{color:var(--lx1);border-color:#8a8a8a;background:rgba(0,0,0,.05);}
.wstep .n{width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;font-size:9.5px;}
.wiz-body{max-width:640px;}
.wiz-nav{display:flex;justify-content:space-between;margin-top:22px;max-width:640px;}
.entrega-row{display:grid;grid-template-columns:1fr 64px 100px 30px;gap:8px;margin-bottom:8px;align-items:center;}
.preset-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.ppill{font-size:10.5px;padding:4px 10px;border-radius:999px;border:1px solid #9a9a9a;background:transparent;color:var(--t2);cursor:pointer;transition:all .12s;}
.ppill:hover{color:var(--t1);border-color:#7a7a7a;background:rgba(0,0,0,.05);}
.inv-box{background:var(--s2);border:1px solid var(--b2);border-radius:12px;padding:16px;margin-top:14px;}
.inv-line{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;color:var(--t2);}
.inv-line.total{border-top:1px solid var(--b3);margin-top:6px;padding-top:10px;font-weight:600;color:var(--t1);font-size:14px;}
/* MODAL */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
#overlay.show{display:flex;}
#modal{background:var(--s1);border:1px solid var(--b2);border-radius:16px;width:100%;max-width:400px;padding:24px;max-height:88vh;overflow-y:auto;color:var(--t1);}
#modal.wide{max-width:760px;}
#modal h2{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--t1);}
.field{margin-bottom:12px;}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field label{display:block;font-size:11px;color:var(--t3);margin-bottom:5px;font-weight:500;}
.field input,.field select,.field textarea{width:100%;background:rgba(255,255,255,.55);border:1px solid var(--b2);border-radius:8px;padding:9px 11px;color:var(--t1);font-size:13px;transition:border-color .13s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--t3);}
.field input::placeholder,.field textarea::placeholder{color:var(--t3);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
/* PLACEHOLDER */
.ph-wrap{max-width:420px;padding:30px 0;}
.ph-tag{display:inline-block;font-size:10.5px;color:var(--lx2);border:1px solid #9a9a9a;border-radius:999px;padding:3px 10px;margin-bottom:14px;font-weight:500;}
.ph-wrap h3{font-size:16px;font-weight:600;margin-bottom:6px;color:var(--lx1);}
.ph-wrap p{font-size:12.5px;color:var(--lx2);line-height:1.65;}
/* MENU MAIS (mobile) */
.mais-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mais-item{display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:11px;border:1px solid var(--ltb);background:transparent;color:var(--t1);cursor:pointer;text-align:left;font-size:12.5px;font-weight:500;}
.mais-item.sel{border-color:var(--acc);background:rgba(0,0,0,.04);}
.mais-ic{display:flex;flex-shrink:0;color:var(--t3);}
.mais-ic svg{width:17px;height:17px;}
.mais-lb{min-width:0;}
/* MOBILE */
#bottomnav{display:none;}
@media(max-width:860px){
  #sidebar{display:none;}
  #content{padding:20px 14px 100px;}
  #topbar{padding:0 14px;}
  .g3,.g4,.kpis{grid-template-columns:1fr 1fr;}
  .dash-grid{grid-template-columns:repeat(2,1fr);}
  .g2,.g-mc{grid-template-columns:1fr;}
  .greeting{font-size:19px;}
  .ag-week{grid-template-columns:repeat(2,1fr);}
  #bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(205,205,205,.95);backdrop-filter:blur(16px);border-top:1px solid var(--bline);padding:9px 4px calc(9px + env(safe-area-inset-bottom));justify-content:space-around;z-index:50;}
  .bn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--lx3);font-size:9px;font-weight:500;cursor:pointer;}
  .bn svg{width:18px;height:18px;}
  .bn.active{color:var(--lx1);}
  .entrega-row{grid-template-columns:1fr 50px 84px 26px;}
}
@media(max-width:520px){
  .g3,.g4,.kpis{grid-template-columns:1fr;}
  .dash-grid{grid-template-columns:1fr;}
  .dw-2{grid-column:span 1;}
  .cli-grid{grid-template-columns:1fr;}
  .mais-grid{grid-template-columns:1fr;}
  .col{min-width:84vw;max-width:84vw;}
  .search{width:100%;}
}
.card,.wl,.kcard,.ag-day{transition:border-color .15s,box-shadow .18s,transform .18s;}
.card:hover,.wl:hover,.kcard:hover,.ag-day:hover{border-color:#8f8f8f;box-shadow:0 6px 20px rgba(0,0,0,.13);transform:translateY(-1px);}
.wl-go{cursor:pointer;}
.card-go{cursor:pointer;transition:border-color .15s;}
.card-go:hover{border-color:var(--dk1);}
.wgo{color:var(--dk1);cursor:pointer;text-decoration:none;font-weight:550;}
.wgo:hover{text-decoration:underline;}
#modal .btn-ghost{color:var(--t2);border-color:#9a9a9a;}
#modal .btn-ghost:hover{color:var(--t1);border-color:#7a7a7a;}
/* KANBAN COLORIDO */
.col-pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:999px;}
.kcard.kc-tint{border-left:3px solid transparent;}
/* CLIENTES */
.cli-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.cli-card{cursor:pointer;}
.cli-avatar{width:38px;height:38px;border-radius:11px;background:var(--acc);color:var(--accT);display:flex;align-items:center;justify-content:center;font-weight:650;font-size:15px;margin-bottom:12px;}
.cli-nome{font-size:13.5px;font-weight:600;margin-bottom:2px;}
.cli-meta{font-size:11.5px;color:var(--t3);margin-bottom:12px;}
.cli-stats{display:flex;gap:14px;border-top:1px solid var(--ltb);padding-top:10px;}
.cli-stat b{display:block;font-size:13px;font-weight:600;}
.cli-stat span{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;}
/* AI CHAT */
.ai-fab{position:fixed;bottom:22px;right:22px;width:46px;height:46px;border-radius:50%;background:var(--acc);color:var(--accT);border:none;font-size:19px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:90;transition:transform .15s;}
.ai-fab:hover{transform:scale(1.07);}
.ai-panel{position:fixed;bottom:78px;right:22px;width:370px;max-height:72vh;background:var(--s1);border:1px solid var(--ltb);border-radius:16px;display:none;flex-direction:column;z-index:95;box-shadow:0 16px 48px rgba(0,0,0,.22);color:var(--t1);overflow:hidden;}
.ai-panel.show{display:flex;}
.ai-hd{padding:14px 16px;border-bottom:1px solid var(--ltb);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px;}
.ai-msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-height:140px;}
.ai-m{max-width:86%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;}
.ai-m.u{align-self:flex-end;background:var(--acc);color:var(--accT);border-bottom-right-radius:4px;}
.ai-m.a{align-self:flex-start;background:var(--s2);color:var(--t1);border-bottom-left-radius:4px;}

/* ═══ CALCULADORA — MOTOR DE PRECIFICAÇÃO OFICIAL LOZY ═══
   Implementa as regras do documento "Calculadora de Orçamento e Modelo de
   Precificação". Duas leituras que o documento não deixa 100% explícitas —
   assumidas abaixo, revisar com uso real e ajustar se necessário:
   1) O acréscimo de "vídeo + fotos" (+50%) incide sobre o valor de serviço
      da captação JÁ COM o desconto de múltiplas diárias aplicado.
   2) Em "Captação complexa", a base é a tabela "Simples" na duração
      escolhida, somada aos custos extras informados (equipe/equipamento). */
function captTierValor(tab,horas,horaExtra){
  if(!tab||!tab.tiers.length)return 0;
  const tiers=[...tab.tiers].sort((a,b)=>a.h-b.h);
  if(horas<=tiers[0].h)return tiers[0].v;
  const exact=tiers.find(t=>t.h===horas);
  if(exact)return exact.v;
  const acima=tiers.find(t=>t.h>horas); /* durações intermediárias arredondam pra faixa acima */
  if(acima)return acima.v;
  const top=tiers[tiers.length-1];
  return top.v+(horas-top.h)*horaExtra; /* acima do teto: hora extra */
}
function calcCaptacao(cfg,inp){
  const c=cfg.capt;
  let unit;
  if(inp.tabelaId==='complexa'){
    const base=c.tabs.find(t=>t.id==='simples');
    unit=captTierValor(base,inp.horas,c.horaExtra)+Number(inp.complexaExtra||0);
  }else{
    const tab=c.tabs.find(t=>t.id===inp.tabelaId)||c.tabs[0];
    unit=captTierValor(tab,inp.horas,c.horaExtra);
  }
  unit=Math.max(unit,c.minimo);
  const diarias=Math.max(1,Number(inp.diarias)||1);
  const servicoBase=unit*diarias;
  const descMulti=diarias>=c.descMultiDiarias.min?servicoBase*c.descMultiDiarias.pct/100:0;
  const servicoPosDesc=servicoBase-descMulti;
  const acrescVideoFotos=inp.videoMaisFotos?servicoPosDesc*c.videoMaisFotosPct/100:0;
  const servicoFinal=servicoPosDesc+acrescVideoFotos;
  let fotosCusto=0;
  if(inp.videoMaisFotos&&Number(inp.fotosQtd)>0){
    const extra=Math.max(0,Number(inp.fotosQtd)-c.fotos.base);
    const blocos=Math.ceil(extra/c.fotos.bloco);
    fotosCusto=c.fotos.valorBase+blocos*c.fotos.valorBloco;
  }
  const deslocKm=Number(inp.deslocKm)||0,deslocHoras=Number(inp.deslocHoras)||0;
  const desloc=(deslocKm||deslocHoras)?(Math.ceil(deslocKm/c.desloc.kmFaixa)*c.desloc.valorFaixa+deslocHoras*c.desloc.valorHora)*diarias:0;
  const total=servicoFinal+fotosCusto+desloc;
  return{unit,diarias,servicoBase,descMulti,acrescVideoFotos,servicoFinal,fotosCusto,desloc,total,aPartir:inp.tabelaId==='complexa'};
}
function edicaoVolumeTier(cfg,qtd){return cfg.edicao.volDesc.find(v=>qtd>=v.min&&qtd<=v.max)||null;}
function calcEdicaoItem(cfg,it){
  const e=cfg.edicao;
  const qtd=Math.max(1,Number(it.qtd)||1);
  const isPacote=it.tipo!=='aftermovie'&&qtd>=e.minPacote;
  let unitBase;
  if(it.tipo==='aftermovie')unitBase=e.unit.aftermovie;
  else if(isPacote)unitBase=it.tipo==='simples'?e.unit.pacoteSimples:e.unit.pacoteDinamico;
  else unitBase=it.tipo==='simples'?e.unit.pontualSimples:e.unit.pontualDinamico;
  const durSeg=Number(it.duracaoSeg)||60;
  if(durSeg>300)return{manual:true,motivo:'Duração acima de 5min — orçar manualmente.',ref:it};
  const durTier=e.durMult.find(d=>durSeg<=d.max)||e.durMult[e.durMult.length-1];
  let unit=unitBase*durTier.mult;
  let volPct=0;
  if(!isPacote&&it.tipo!=='aftermovie'){
    const tier=edicaoVolumeTier(cfg,qtd);
    if(tier){
      volPct=tier.pct;
      const pacoteUnit=(it.tipo==='simples'?e.unit.pacoteSimples:e.unit.pacoteDinamico)*durTier.mult;
      unit=Math.max(unit*(1-volPct/100),pacoteUnit); /* desconto nunca derruba abaixo do preço de pacote */
    }
  }
  let subtotal=Math.max(unit*qtd,e.minimo); /* mínimo vale sobre o pedido, não sobre o unitário — não pode inflar o preço de pacote */
  const prazoPadrao=Math.max(e.urg.minDias,e.urg.porVideoDias*qtd);
  let acrescUrg=0,urgTipo=null;
  if(it.sameDay){acrescUrg=subtotal*(e.urg.sameDayMult-1);urgTipo='same-day';}
  else if(it.prazoDesejadoDias&&it.prazoDesejadoDias<prazoPadrao){acrescUrg=subtotal*e.urg.acrescimoPct/100;urgTipo='urgencia';}
  subtotal+=acrescUrg;
  const extras=(Number(it.versoesExtra)||0)*e.versaoExtra+(Number(it.revisoesExtra)||0)*e.revisaoExtra;
  subtotal+=extras;
  return{manual:false,unit,qtd,isPacote,volPct,durMult:durTier.mult,prazoPadrao,acrescUrg,urgTipo,extras,subtotal,ref:it};
}
function calcEdicao(cfg,itens){
  const linhas=(itens||[]).map(it=>calcEdicaoItem(cfg,it));
  const manual=linhas.some(l=>l.manual);
  const total=manual?0:linhas.reduce((a,l)=>a+l.subtotal,0);
  return{linhas,manual,total};
}
function calcOrcamento(cfg,w){
  const capt=w.escopo!=='edicao'&&w.capt?calcCaptacao(cfg,w.capt):null;
  const edicao=w.escopo!=='captacao'?calcEdicao(cfg,w.edicaoItens||[]):null;
  const servCapt=capt?capt.total-capt.desloc:0;
  const servEdi=edicao&&!edicao.manual?edicao.total:0;
  const servicoTotal=servCapt+servEdi;
  const descPct=Number(w.descontoPct)||0;
  const desconto=servicoTotal*descPct/100;
  const deslocTotal=(capt?capt.desloc:0)+Number(w.deslocExtra||0);
  const total=servicoTotal-desconto+deslocTotal;
  return{capt,edicao,servCapt,servEdi,servicoTotal,desconto,deslocTotal,total};

/* ═══ STORAGE — adaptador ═══
   window.storage existe dentro do claude.ai; hospedado (GitHub Pages,
   arquivo local, app instalado) cai para localStorage. Mesma interface. */
const Store={
  async get(k){
    if(typeof window!=='undefined'&&window.storage)return window.storage.get(k,false);
    const v=localStorage.getItem(k);return v?{key:k,value:v}:null;
  },
  async set(k,v){
    if(typeof window!=='undefined'&&window.storage)return window.storage.set(k,v,false);
    localStorage.setItem(k,v);return{key:k,value:v};
  }
};

async function load(){
  let got=false;
  try{
    const r=await Store.get('lozy-hub-v2');
    if(r&&r.value){const d=JSON.parse(r.value);KEYS.forEach(k=>{if(d[k])S[k]=d[k];});got=true;}
  }catch(e){}
  if(!got){ /* migração da v0.3 */
    for(const k of ['leads','demandas','tasks']){
      try{const r=await Store.get('lozy-'+k);if(r&&r.value)S[k]=JSON.parse(r.value);}catch(e){}
    }
    S.tasks=S.tasks.map(t=>t.titulo?t:{id:t.id,titulo:t.text,prioridade:'Média',status:t.done?'Concluída':'A fazer',prazo:null});
    S.demandas=S.demandas.map((d,i)=>({uid:d.uid||('DEM-'+String(i+1).padStart(3,'0')),maeId:d.maeId||null,custo:d.custo||0,receita:d.receita||0,horas:d.horas||0,...d}));
  }
  /* carga migrada do Notion: aplica sempre que o estado estiver vazio, mesmo se houver um save antigo em branco */
  if(!S.demandas.length&&!S.fin.length)applySeed(false);
  else if(!S.parc.length||!S.assin.length){S.parc=SEED3.parc.map(p=>({...p}));S.assin=SEED3.assin.map(a=>({...a}));linkAssinaturas();save();}
  if(!S.tasks.some(t=>String(t.id).startsWith('nt'))||!S.cbase.length){S.tasks=[...SEED2.tasks.map(t=>({...t})),...S.tasks.filter(t=>!String(t.id).startsWith('nt'))];S.cbase=[...SEED2.cbase.map(c=>({...c})),...S.cbase.filter(c=>!String(c.id).startsWith('nc'))];save();}
  if(!Array.isArray(S.trash))S.trash=[];
  trashAutoPurge();
  applyTheme();
  render();
}
function applySeed(reset){
  if(reset){S.demandas=[];S.fin=[];S.projetos=[];}
  S.demandas=[...SEED.demandas.map(d=>({...d})),...S.demandas.filter(d=>!String(d.id).startsWith('nd'))];
  S.tasks=[...SEED2.tasks.map(t=>({...t})),...S.tasks.filter(t=>!String(t.id).startsWith('nt'))];
  S.cbase=[...SEED2.cbase.map(c=>({...c})),...S.cbase.filter(c=>!String(c.id).startsWith('nc'))];
  S.fin=[...SEED.fin.map(f=>({...f})),...S.fin.filter(f=>!String(f.id).startsWith('nr')&&!String(f.id).startsWith('ne'))];
  SEED.projetos.forEach(p=>{if(!S.projetos.some(x=>x.id===p.id))S.projetos.push({...p});});
  S.parc=[...SEED3.parc.map(p=>({...p})),...S.parc.filter(p=>!String(p.id).startsWith('np_'))];
  S.assin=[...SEED3.assin.map(a=>({...a})),...S.assin.filter(a=>!String(a.id).startsWith('na'))];
  linkAssinaturas();
  save();
}

let _uidSeq=0;

const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtD=s=>s?new Date(s+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}):'—';
function prazoStatus(prazo){
  if(!prazo)return null;
  const h=new Date();h.setHours(0,0,0,0);
  const p=new Date(prazo+'T00:00:00');
  const diff=Math.round((p-h)/864e5);
  if(diff<0)return{label:'Atrasada '+Math.abs(diff)+'d',cls:'atrasada',diff};
  if(diff===0)return{label:'Hoje',cls:'hoje',diff};
  return{label:'Em '+diff+'d',cls:'ok',diff};
}
/* ═══ PRAZO DE DEMANDAS (lógica V1 → ajuste → entrega) ═══
   `prazo` = prazo da V1. Quando o status entra em "Com o cliente", a V1 já foi
   entregue e o prazo relevante passa a ser `prazoAjuste` (se definido). Uma vez
   "Entregue", o atraso vira um fato histórico (entregueEm vs. o prazo que valia
   na hora) e para de recalcular contra o dia de hoje. */
function demPrazoAtivo(d){return d.prazoAjuste||d.prazo||null;}
function demandaAtraso(d){
  if(d.status==='Entregue'){
    if(!d.entregueEm)return null; /* sem data de entrega registrada (ex: migração antiga) — não afirma nada */
    const alvo=d.prazoAjuste||d.prazo;if(!alvo)return null;
    const diff=Math.round((new Date(d.entregueEm+'T00:00:00')-new Date(alvo+'T00:00:00'))/864e5);
    return diff>0?{label:'entregue '+diff+'d atrasada',cls:'atrasada',diff}:null; /* no prazo = silêncio, sem selo */
  }
  const alvo=demPrazoAtivo(d);
  return alvo?prazoStatus(alvo):null;
}
function statusLog(item,novo){ /* histórico de status genérico — usado por demandas e tarefas */
  if(!Array.isArray(item.statusHistory))item.statusHistory=[{status:item.status,em:todayStr()}];
  item.statusHistory.push({status:novo,em:todayStr()});
}
function tempoPorStatus(hist){ /* devolve [{status,dias,atual}] a partir do statusHistory */
  if(!Array.isArray(hist)||!hist.length)return[];
  return hist.map((h,i)=>{
    const fim=i<hist.length-1?hist[i+1].em:todayStr();
    const dias=Math.max(0,Math.round((new Date(fim+'T00:00:00')-new Date(h.em+'T00:00:00'))/864e5));
    return{status:h.status,dias,atual:i===hist.length-1};
  });
}
function demTransicao(d,novo){ /* carimba a data da transição só na primeira vez que ela acontece */
  if(d.status===novo)return;
  statusLog(d,novo);
  if(novo==='Com o cliente'&&!d.entregueV1Em)d.entregueV1Em=todayStr();
  if(novo==='Entregue'&&!d.entregueEm)d.entregueEm=todayStr();
  d.status=novo;
}
function taskTransicao(t,novo){
  if(t.status===novo)return;
  statusLog(t,novo);
  t.status=novo;
}
function pintTransicao(p,novo){
  if(p.status===novo)return;
  statusLog(p,novo);
  p.status=novo;
}
function monthKey(s){return s?s.slice(0,7):null;}
function addM(ds,n){const d=new Date(ds+'T00:00:00');const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function mesRef(l){ /* lógica Central Lozy: mês em que o lançamento entra no P&L.
  Receita: usa a competência declarada (mês em que o serviço foi gerado), com
  fallback pra data quando o registro é antigo e não tem competência salva —
  separa "a que mês pertence" de "quando vence", que antes viviam no mesmo campo.
  Despesa: cartão de crédito + dia de fechamento da fatura. */
  if(l.tipo==='receita')return l.competencia||monthKey(l.data);
  if(l.tipo!=='despesa'||l.forma!=='Crédito')return monthKey(l.data);
  const c=CONTAS.find(c=>c.nome===l.conta);
  if(!c||!c.fech)return monthKey(l.data);
  const d=new Date(l.data+'T00:00:00');
  if(d.getDate()>c.fech)d.setMonth(d.getMonth()+1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
const liq=r=>Number(r.valor||0)*(1-Number(r.aliquota||0)/100);
function clientes(){ /* base derivada: todos os nomes de cliente do sistema */
  const s=new Set();
  S.leads.filter(l=>l.stage==='Fechado').forEach(l=>s.add(l.empresa));
  S.demandas.forEach(d=>d.cliente&&s.add(d.cliente));
  S.projetos.forEach(p=>p.cliente&&s.add(p.cliente));
  S.fin.forEach(f=>f.cliente&&s.add(f.cliente));
  return[...s].filter(Boolean).sort();
}

      return '<button class="snav '+(S.active===id?'active':'')+'" onclick="goTo(\''+id+'\')">'+IC[id]+
        (exp?'<span class="nlbl">'+s.label+(!s.ready?'<i class="soon">em breve</i>':'')+'</span>'
            :'<span class="tip">'+s.label+(!s.ready?' · em breve':'')+'</span>')+'</button>';
    }).join('')).join('');
  const mob=['dashboard','demandas','financeiro','agenda'];
  const outras=SECTIONS.filter(x=>!mob.includes(x.id));
  const ativoFora=outras.some(x=>x.id===S.active);
  document.getElementById('bottomnav').innerHTML=mob.map(id=>{
    const s=SECTIONS.find(x=>x.id===id);
    return '<button class="bn '+(S.active===id?'active':'')+'" onclick="goTo(\''+id+'\')">'+IC[id]+'<span>'+s.label.split(' ')[0]+'</span></button>';
  }).join('')+
  '<button class="bn '+(ativoFora?'active':'')+'" onclick="openMaisMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg><span>Mais</span></button>';

function tabsHtml(mod,list){
