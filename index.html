    ${tks.length?`<div style="font-size:11px;color:var(--t3);margin-bottom:10px;">${doneT}/${tks.length} concluídas</div>`:''}
    ${tks.length?tks.map(tk=>{
      const ps=tk.prazo?prazoStatus(tk.prazo):null;
      return `<div class="row-item"><div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
      <button class="tk-check ${tk.status==='Concluída'?'done':''}" style="border-color:var(--b3)" onclick="pintToggleTask('${tk.id}')"></button>
      <div style="min-width:0"><div class="ri-name" style="${tk.status==='Concluída'?'color:var(--t3);text-decoration:line-through':''}">${esc(tk.titulo)}</div>
      <div class="ri-sub">${tk.status}${tk.prazo?' · '+fmtD(tk.prazo):''}${ps&&ps.cls==='atrasada'&&tk.status!=='Concluída'?' · <span style="color:var(--red)">'+ps.label+'</span>':''}</div></div></div>
      <button class="ibtn" title="abrir" onclick="openCard('tasks','${tk.id}')">⤢</button></div>`;
    }).join(''):'<div class="empty-msg">Nenhuma tarefa vinculada ainda.</div>'}`;
  }
  if(cv.tab==='obs'){
    const obs=[...(it.observacoes||[])].reverse();
    return `${obs.length?obs.map(o=>`<div style="border:1px solid var(--b2);border-radius:10px;padding:11px;margin-bottom:8px;">
      <div style="font-size:10.5px;color:var(--t3);margin-bottom:5px;">${fmtD(o.em)}</div>
      ${o.texto?`<div style="font-size:13px;white-space:pre-wrap;line-height:1.5;">${esc(o.texto)}</div>`:''}
      ${o.img?`<img src="${o.img}" style="max-width:100%;border-radius:8px;margin-top:8px;display:block;">`:''}
      <button class="ibtn del" style="margin-top:6px;" onclick="delObs('${o.id}')">✕ remover</button></div>`).join(''):'<div class="empty-msg">Nenhuma observação ainda.</div>'}
    <textarea id="obs-novo" rows="3" placeholder="Escrever uma observação..." style="margin-top:6px;"></textarea>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;">
      <button class="btn-sm" onclick="addObs()">+ Adicionar observação</button>
      <label class="btn-sm" style="cursor:pointer;">📎 Anexar imagem<input type="file" accept="image/*" style="display:none" onchange="addObsImg(this)"></label>
    </div>
    <div style="font-size:10.5px;color:var(--t3);margin-top:6px;">Imagens ficam salvas no navegador — evite anexar muitas fotos em alta resolução (o espaço do Hub é limitado a alguns MB no total).</div>`;
  }
  if(cv.tab==='chk'){
    const chk=it.checklist||[];
    const feitos=chk.filter(c=>c.feito).length;
    return `${chk.length?`<div style="font-size:11px;color:var(--t3);margin-bottom:10px;">${feitos}/${chk.length} concluídos</div>`:''}
    ${chk.map(c=>`<div style="display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--b2);">
      <input type="checkbox" style="width:auto" ${c.feito?'checked':''} onchange="toggleChk('${c.id}')">
      <span style="flex:1;font-size:13px;${c.feito?'text-decoration:line-through;color:var(--t3)':''}">${esc(c.texto)}</span>
      <button class="ibtn del" onclick="delChk('${c.id}')">✕</button></div>`).join('')}
    ${!chk.length?'<div class="empty-msg">Nenhum item ainda.</div>':''}
    <div style="display:flex;gap:8px;margin-top:12px;"><input id="chk-novo" class="task-input" placeholder="Novo item..." onkeydown="if(event.key==='Enter'){event.preventDefault();addChk();}"><button class="btn-sm" onclick="addChk()">+</button></div>`;
  }
  if(cv.tab==='hist'){
    const hist=tempoPorStatus(it.statusHistory);
    if(!hist.length)return '<div class="empty-msg">Sem histórico registrado ainda — passa a contar a partir da próxima mudança de status.</div>';
    return hist.map(h=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--b2);font-size:13px;">
      <span>${esc(h.status)}${h.atual?' <span class="bdg">atual</span>':''}</span><span style="color:var(--t3);font-size:12px">${h.dias} dia${h.dias!==1?'s':''}</span></div>`).join('');
  }
  return '';
}
function addObsImg(input){
  const file=input.files&&input.files[0];if(!file)return;
  const it=cardEntity();if(!it)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const MAXW=900;const scale=Math.min(1,MAXW/img.width);
      const canvas=document.createElement('canvas');
      canvas.width=img.width*scale;canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl=canvas.toDataURL('image/jpeg',0.82);
      if(!Array.isArray(it.observacoes))it.observacoes=[];
      it.observacoes.push({id:uid('ob'),texto:'',img:dataUrl,em:todayStr()});
      save();document.getElementById('card-tab-body').innerHTML=cardTabBody();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
  input.value='';
}
function addObs(){
  const el=document.getElementById('obs-novo');const txt=el.value.trim();if(!txt)return;
  const it=cardEntity();if(!it)return;
  if(!Array.isArray(it.observacoes))it.observacoes=[];
  it.observacoes.push({id:uid('ob'),texto:txt,em:todayStr()});
  save();document.getElementById('card-tab-body').innerHTML=cardTabBody();
}
function delObs(id){
  const it=cardEntity();if(!it||!it.observacoes)return;
  it.observacoes=it.observacoes.filter(o=>o.id!==id);save();document.getElementById('card-tab-body').innerHTML=cardTabBody();
}
function addChk(){
  const el=document.getElementById('chk-novo');const txt=el.value.trim();if(!txt)return;
  const it=cardEntity();if(!it)return;
  if(!Array.isArray(it.checklist))it.checklist=[];
  it.checklist.push({id:uid('ck'),texto:txt,feito:false});
  save();document.getElementById('card-tab-body').innerHTML=cardTabBody();
}
function toggleChk(id){
  const it=cardEntity();if(!it||!it.checklist)return;
  const c=it.checklist.find(x=>x.id===id);if(c)c.feito=!c.feito;
  save();document.getElementById('card-tab-body').innerHTML=cardTabBody();
}
function delChk(id){
  const it=cardEntity();if(!it||!it.checklist)return;
  it.checklist=it.checklist.filter(x=>x.id!==id);save();document.getElementById('card-tab-body').innerHTML=cardTabBody();
}
function pintAddTask(pid){
  const el=document.getElementById('pint-task-novo');const v=el.value.trim();if(!v)return;
  S.tasks.unshift({id:uid('t'),titulo:v,prioridade:'Média',status:'A fazer',statusHistory:[{status:'A fazer',em:todayStr()}],prazo:null,demandaId:null,area:'',cliente:'',projIntId:pid});
  save();document.getElementById('card-tab-body').innerHTML=cardTabBody();
}
function pintToggleTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  taskTransicao(t,t.status==='Concluída'?'A fazer':'Concluída');
  save();document.getElementById('card-tab-body').innerHTML=cardTabBody();
}

</script>
<script>
/* ═══════════════════════════════════════════════════════════════
   REVERSIBILIDADE — desfazer, lixeira e arraste
   Princípio: nenhuma ação estrutural apaga dado de forma direta.
   Excluir move o registro para S.trash (com o índice original e as
   relações que precisam ser refeitas). Toda ação estrutural empilha
   um snapshot das arrays afetadas em UNDO, que alimenta Cmd/Ctrl+Z.
   ═══════════════════════════════════════════════════════════════ */

const TRASH_DIAS=30;
const TRASH_META={
  leads:{l:'Lead',n:r=>r.empresa,ir:'comercial'},
  contatos:{l:'Contato',n:r=>r.nome,ir:'comercial'},
  followups:{l:'Follow-up',n:r=>r.titulo,ir:'comercial'},
  demandas:{l:'Demanda',n:r=>(r.uid?r.uid+' · ':'')+(r.titulo||''),ir:'demandas'},
  tasks:{l:'Tarefa',n:r=>r.titulo,ir:'tarefas'},
  projetos:{l:'Projeto',n:r=>r.nome,ir:'projetos'},
  pint:{l:'Projeto Interno',n:r=>r.nome,ir:'pint'},
  fin:{l:'Lançamento',n:r=>r.desc,ir:'financeiro'},
  eventos:{l:'Evento',n:r=>r.titulo,ir:'agenda'},
  propostas:{l:'Proposta',n:r=>r.titulo||r.cliente,ir:'propostas'},
  parc:{l:'Parcelamento',n:r=>r.nome,ir:'financeiro'},
  assin:{l:'Assinatura',n:r=>r.nome,ir:'financeiro'},
  cbase:{l:'Cliente',n:r=>r.nome,ir:'clientes'}
};
function trashLabel(kind){return TRASH_META[kind]?TRASH_META[kind].l:kind;}
function trashName(kind,r){
  let n='';try{const m=TRASH_META[kind];n=m&&m.n?m.n(r):'';}catch(e){}
  return String(n||r.titulo||r.nome||r.desc||r.empresa||'registro sem nome').trim()||'registro sem nome';
}

/* ── pilha de desfazer: snapshot só das arrays tocadas ── */
const UNDO={u:[],r:[],max:20};
const snapKeys=ks=>{const o={};ks.forEach(k=>o[k]=JSON.stringify(S[k]||[]));return o;};
const applySnap=o=>Object.keys(o).forEach(k=>S[k]=JSON.parse(o[k]));
function pushUndo(label,keys){
  UNDO.u.push({label,keys,snap:snapKeys(keys)});
  if(UNDO.u.length>UNDO.max)UNDO.u.shift();
  UNDO.r.length=0;
}
function doUndo(){
  const e=UNDO.u.pop();
  if(!e)return toast('Nada para desfazer nesta sessão. O que foi excluído continua na Lixeira.','Abrir Lixeira',"goTo('lixeira')");
  UNDO.r.push({label:e.label,keys:e.keys,snap:snapKeys(e.keys)});
  applySnap(e.snap);save();render();
  toast('Desfeito: '+e.label,'Refazer','doRedo()',6000);
}
function doRedo(){
  const e=UNDO.r.pop();if(!e)return toast('Nada para refazer.');
  UNDO.u.push({label:e.label,keys:e.keys,snap:snapKeys(e.keys)});
  applySnap(e.snap);save();render();
  toast('Refeito: '+e.label,'Desfazer','doUndo()',6000);
}

/* ── toast com ação ── */
let toastT=null;
function toast(msg,actLabel,actCode,ms){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el);}
  el.innerHTML='<span class="toast-msg">'+esc(msg)+'</span>'
    +(actLabel?'<button class="toast-act" onclick="hideToast();'+actCode+'">'+esc(actLabel)+'</button>':'')
    +'<button class="toast-x" onclick="hideToast()">✕</button>';
  el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(hideToast,ms||8000);
}
function hideToast(){const el=document.getElementById('toast');if(el)el.classList.remove('show');}

/* ── exclusão reversível: única porta de saída de qualquer registro ── */
function softDel(kind,id){
  const arr=S[kind];
  if(!Array.isArray(arr))return;
  const idx=arr.findIndex(x=>x.id===id);
  if(idx<0)return;
  const rec=arr[idx];
  const nome=trashName(kind,rec);
  pushUndo('excluir '+trashLabel(kind).toLowerCase()+' "'+nome+'"',[kind,'trash']);
  const rel={};
  if(kind==='demandas'){ /* preserva o vínculo mãe→filhas para poder refazê-lo na restauração */
    rel.filhas=S.demandas.filter(d=>d.maeId===id).map(d=>d.id);
    S.demandas.forEach(d=>{if(d.maeId===id)d.maeId=null;});
  }
  arr.splice(idx,1);
  if(kind==='fin')S.finLastUpdate=new Date().toISOString();
  if(!Array.isArray(S.trash))S.trash=[];
  S.trash.unshift({id:uid('tr'),kind,idx,at:new Date().toISOString(),data:JSON.parse(JSON.stringify(rec)),rel});
  if(S.trash.length>400)S.trash.length=400;
  save();render();
  toast(trashLabel(kind)+' "'+nome+'" foi para a Lixeira.','Desfazer','doUndo()');
}

function trashRestore(trId){
  const t=S.trash.find(x=>x.id===trId);
  if(!t)return;
  if(!Array.isArray(S[t.kind]))return toast('Não consegui restaurar: a base "'+t.kind+'" não existe mais.');
  pushUndo('restaurar '+trashLabel(t.kind).toLowerCase()+' "'+trashName(t.kind,t.data)+'"',[t.kind,'trash']);
  if(!S[t.kind].some(x=>x.id===t.data.id)){
    const pos=Math.min(Math.max(0,t.idx==null?S[t.kind].length:t.idx),S[t.kind].length);
    S[t.kind].splice(pos,0,JSON.parse(JSON.stringify(t.data)));
  }
  if(t.kind==='demandas'&&t.rel&&t.rel.filhas)
    t.rel.filhas.forEach(fid=>{const f=S.demandas.find(d=>d.id===fid);if(f&&!f.maeId)f.maeId=t.data.id;});
  S.trash=S.trash.filter(x=>x.id!==trId);
  save();render();
  toast('Restaurado: '+trashName(t.kind,t.data),'Ir para '+(TRASH_META[t.kind]?TRASH_META[t.kind].l:''),"goTo('"+((TRASH_META[t.kind]||{}).ir||'dashboard')+"')");
}
function trashDrop(trId){
  const t=S.trash.find(x=>x.id===trId);if(!t)return;
  if(!confirm('Apagar "'+trashName(t.kind,t.data)+'" definitivamente? Esta é a única ação do Hub que não tem volta.'))return;
  pushUndo('apagar definitivamente "'+trashName(t.kind,t.data)+'"',['trash']);
  S.trash=S.trash.filter(x=>x.id!==trId);
  save();render();toast('Apagado definitivamente.','Desfazer','doUndo()');
}
function trashEmpty(){
  if(!S.trash.length)return;
  if(!confirm('Esvaziar a Lixeira? '+S.trash.length+' registro(s) serão apagados definitivamente.'))return;
  pushUndo('esvaziar a Lixeira ('+S.trash.length+' registros)',['trash']);
  S.trash=[];save();render();toast('Lixeira esvaziada.','Desfazer','doUndo()');
}
function trashRestoreAll(){
  const ids=S.trash.map(t=>t.id);
  if(!ids.length)return;
  if(!confirm('Restaurar todos os '+ids.length+' registros da Lixeira?'))return;
  const kinds=[...new Set(S.trash.map(t=>t.kind))].filter(k=>Array.isArray(S[k]));
  pushUndo('restaurar '+ids.length+' registros da Lixeira',[...kinds,'trash']);
  [...S.trash].reverse().forEach(t=>{
    if(!Array.isArray(S[t.kind])||S[t.kind].some(x=>x.id===t.data.id))return;
    const pos=Math.min(Math.max(0,t.idx==null?S[t.kind].length:t.idx),S[t.kind].length);
    S[t.kind].splice(pos,0,JSON.parse(JSON.stringify(t.data)));
    if(t.kind==='demandas'&&t.rel&&t.rel.filhas)
      t.rel.filhas.forEach(fid=>{const f=S.demandas.find(d=>d.id===fid);if(f&&!f.maeId)f.maeId=t.data.id;});
  });
  S.trash=[];save();render();toast(ids.length+' registros restaurados.','Desfazer','doUndo()');
}
function trashAutoPurge(){
  if(!Array.isArray(S.trash))return;
  const lim=Date.now()-TRASH_DIAS*864e5;
  const antes=S.trash.length;
  S.trash=S.trash.filter(t=>{const ts=new Date(t.at).getTime();return isNaN(ts)||ts>lim;});
  if(S.trash.length!==antes)save();
}

function renderLixeira(c){
  const q=(S.q.tr||'').toLowerCase();
  const f=S.f.tr||{};
  const kinds=[...new Set((S.trash||[]).map(t=>t.kind))].sort();
  let its=(S.trash||[]).filter(t=>(!f.kind||t.kind===f.kind)&&(!q||trashName(t.kind,t.data).toLowerCase().includes(q)));
  const dias=t=>Math.max(0,TRASH_DIAS-Math.floor((Date.now()-new Date(t.at).getTime())/864e5));
  c.innerHTML=`
    <div class="page-hd"><div><div class="page-title">Lixeira</div></div>
    <div style="display:flex;gap:8px;">
      <button class="btn-ghost" onclick="doUndo()">↶ Desfazer última ação</button>
      ${S.trash.length?'<button class="btn-ghost" onclick="trashRestoreAll()">Restaurar tudo</button><button class="btn-ghost" onclick="trashEmpty()">Esvaziar</button>':''}
    </div></div>
    <div class="card" style="margin-bottom:12px;font-size:12px;color:var(--t2);line-height:1.7;">
      Nada é apagado na hora. Tudo que você exclui no Hub para aqui e pode voltar por ${TRASH_DIAS} dias — depois disso some sozinho.
      Para reverter algo que acabou de acontecer, <b>Cmd/Ctrl + Z</b> desfaz a última ação da sessão (inclusive movimentações de card).
    </div>
    ${S.trash.length?`<div class="toolbar">
      <input class="search" placeholder="Buscar na lixeira..." value="${esc(S.q.tr||'')}" oninput="S.q.tr=this.value;render();setTimeout(()=>{const e=document.querySelector('.search');e.focus();e.setSelectionRange(e.value.length,e.value.length)},0)">
      <select class="fsel" onchange="S.f.tr={...S.f.tr,kind:this.value};render()"><option value="">Tipo: Todos</option>${kinds.map(k=>`<option value="${k}" ${f.kind===k?'selected':''}>${trashLabel(k)}</option>`).join('')}</select>
    </div>`:''}
    ${its.length?`<div class="card" style="padding:6px 20px;">${its.map(t=>`
      <div class="tr-item">
        <div class="tr-body">
          <div class="tr-name">${esc(trashName(t.kind,t.data))}</div>
          <div class="tr-meta">${trashLabel(t.kind)} · excluído em ${new Date(t.at).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})} · some em ${dias(t)}d${t.rel&&t.rel.filhas&&t.rel.filhas.length?' · devolve '+t.rel.filhas.length+' filha(s) ao vínculo':''}</div>
        </div>
        <div class="tr-acts">
          <button class="btn-sm" onclick="trashRestore('${t.id}')">↺ Restaurar</button>
          <button class="ibtn del" title="Apagar definitivamente" onclick="trashDrop('${t.id}')">✕</button>
        </div>
      </div>`).join('')}</div>`
    :`<div class="card"><div class="empty-msg">${S.trash.length?'Nenhum registro com esse filtro.':'A Lixeira está vazia.'}</div></div>`}`;
}

/* ═══ ARRASTAR CARDS ═══
   Pointer Events em vez de HTML5 drag-and-drop: o mesmo código serve
   mouse e toque. No mouse arrasta de qualquer ponto do card; no toque
   arrasta pela alça ⠿ (assim o dedo no corpo do card continua rolando
   a tela em vez de mover o registro sem querer). */
let DG=null;
const dgGrip='<span class="dg-grip" title="Arrastar">⠿</span>';
function dgDown(ev,kind,id){
  if(ev.pointerType==='mouse'&&ev.button!==0)return;
  if(ev.target.closest('button,select,input,textarea,a'))return;
  if(ev.pointerType!=='mouse'&&!ev.target.closest('.dg-grip'))return;
  const card=ev.currentTarget;
  DG={kind,id,card,x0:ev.clientX,y0:ev.clientY,live:false,ghost:null,board:card.closest('.board')};
  try{card.setPointerCapture(ev.pointerId);}catch(e){}
}
function dgActivate(x,y){
  const r=DG.card.getBoundingClientRect();
  DG.ox=r.left-DG.x0;DG.oy=r.top-DG.y0;
  const g=DG.card.cloneNode(true);
  g.classList.add('drag-ghost');
  g.style.width=r.width+'px';
  document.body.appendChild(g);
  DG.ghost=g;DG.live=true;
  DG.card.classList.add('dg-src');
  document.body.classList.add('dg-on');
  dgGhostTo(x,y);
}
function dgGhostTo(x,y){if(DG&&DG.ghost){DG.ghost.style.left=(x+DG.ox)+'px';DG.ghost.style.top=(y+DG.oy)+'px';}}
function dgColAt(x,y){
  if(DG.ghost)DG.ghost.style.visibility='hidden';
  const el=document.elementFromPoint(x,y);
  if(DG.ghost)DG.ghost.style.visibility='';
  const col=el&&el.closest?el.closest('.col[data-dg]'):null;
  return col&&col.dataset.dg===DG.kind?col:null;
}
function dgMove(ev){
  if(!DG)return;
  if(!DG.live){
    if(Math.abs(ev.clientX-DG.x0)<5&&Math.abs(ev.clientY-DG.y0)<5)return;
    dgActivate(ev.clientX,ev.clientY);
  }
  ev.preventDefault();
  dgGhostTo(ev.clientX,ev.clientY);
  document.querySelectorAll('.col.dg-over').forEach(c=>c.classList.remove('dg-over'));
  const col=dgColAt(ev.clientX,ev.clientY);
  if(col)col.classList.add('dg-over');
  if(DG.board){ /* rola o quadro quando o card chega perto da borda */
    const r=DG.board.getBoundingClientRect();
    if(ev.clientX>r.right-70)DG.board.scrollLeft+=16;
    else if(ev.clientX<r.left+70)DG.board.scrollLeft-=16;
  }
}
function dgEnd(ev){
  if(!DG)return;
  const live=DG.live,kind=DG.kind,id=DG.id;
  const col=live?dgColAt(ev.clientX,ev.clientY):null;
  const alvo=col?col.dataset.dgval:null;
  dgClear();
  if(live&&alvo)dgDrop(kind,id,alvo);
}
function dgClear(){
  if(!DG)return;
  if(DG.ghost)DG.ghost.remove();
  if(DG.card)DG.card.classList.remove('dg-src');
  document.body.classList.remove('dg-on');
  document.querySelectorAll('.col.dg-over').forEach(c=>c.classList.remove('dg-over'));
  DG=null;
}
function dgDrop(kind,id,alvo){
  if(kind==='demandas'){
    const d=S.demandas.find(x=>x.id===id);
    if(!d||d.status===alvo)return;
    pushUndo('mover '+d.uid+' para "'+alvo+'"',['demandas']);
    demTransicao(d,alvo);save();render();
    toast(d.uid+' → '+alvo,'Desfazer','doUndo()',5000);
  }else if(kind==='tasks'){
    const t=S.tasks.find(x=>x.id===id);
    if(!t||t.status===alvo)return;
    pushUndo('mover tarefa "'+t.titulo+'" para "'+alvo+'"',['tasks']);
    taskTransicao(t,alvo);save();render();
    toast('"'+t.titulo+'" → '+alvo,'Desfazer','doUndo()',5000);
  }else if(kind==='leads'){
    const l=S.leads.find(x=>x.id===id);
    if(!l||l.stage===alvo)return;
    pushUndo('mover lead "'+l.empresa+'" para "'+alvo+'"',['leads','projetos']);
    l.stage=alvo;
    if(alvo==='Fechado'&&!S.projetos.some(p=>p.leadId===id))
      S.projetos.push({id:uid('p'),nome:l.empresa,cliente:l.empresa,fase:'Briefing',entrega:null,leadId:id});
    save();render();
    toast(l.empresa+' → '+alvo,'Desfazer','doUndo()',5000);
  }else if(kind==='pint'){
    const p=S.pint.find(x=>x.id===id);
    if(!p||p.status===alvo)return;
    pushUndo('mover projeto interno "'+p.nome+'" para "'+alvo+'"',['pint']);
    pintTransicao(p,alvo);save();render();
    toast('"'+p.nome+'" → '+alvo,'Desfazer','doUndo()',5000);
  }
}
document.addEventListener('pointermove',dgMove,{passive:false});
document.addEventListener('pointerup',dgEnd);
document.addEventListener('pointercancel',dgClear);

/* ── Cmd/Ctrl+Z e Cmd/Ctrl+Shift+Z ── */
document.addEventListener('keydown',e=>{
  if(!(e.metaKey||e.ctrlKey)||e.key.toLowerCase()!=='z')return;
  const t=e.target;
  if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
  if(document.getElementById('overlay').classList.contains('show'))return;
  e.preventDefault();
  e.shiftKey?doRedo():doUndo();
});
</script>
<script>
/* ═══════════════════════════════════════════════════════════════
   SINCRONIZAÇÃO — Supabase
   Estratégia: diff por registro contra um snapshot do último sync.
   Só o que mudou sobe; o que mudou no servidor desce. Conflito no
   mesmo registro resolve por updated_at (o mais recente vence).
   Sem backend configurado, o Hub segue funcionando local.
   ═══════════════════════════════════════════════════════════════ */
const SYNC_KINDS=['leads','contatos','followups','demandas','tasks','projetos','pint','fin','eventos','propostas','cbase','parc','assin','trash'];
const SETTING_KEYS=['theme','prefs','dash','cols','sort','finPresets'];
let SY={busy:false,last:null,err:null,snap:{}};

function syncCfg(){return (S.prefs&&S.prefs.sb_url)?{url:S.prefs.sb_url,key:S.prefs.sb_key,token:S.prefs.sb_token,refresh:S.prefs.sb_refresh,email:S.prefs.sb_email}:null;}
function syncOn(){const c=syncCfg();return !!(c&&c.url&&c.key&&c.token);}

async function sbFetch(path,opts={}){
  const c=syncCfg();if(!c)throw new Error('sem configuração');
  const r=await fetch(c.url.replace(/\/$/,'')+path,{...opts,headers:{
    'apikey':c.key,'Authorization':'Bearer '+c.token,
    'Content-Type':'application/json',...(opts.headers||{})}});
  if(r.status===401){const ok=await sbRefresh();if(ok)return sbFetch(path,opts);throw new Error('sessão expirada — entre novamente');}
  if(!r.ok)throw new Error('HTTP '+r.status+' — '+(await r.text()).slice(0,140));
  /* upsert com return=minimal responde 201/204 sem corpo — nada a interpretar */
  if(r.status===204)return null;
  const txt=await r.text();
  if(!txt||!txt.trim())return null;
  try{return JSON.parse(txt);}catch(e){return null;}
}
async function sbRefresh(){
  const c=syncCfg();if(!c||!c.refresh)return false;
  try{
    const r=await fetch(c.url.replace(/\/$/,'')+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:{'apikey':c.key,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:c.refresh})});
    if(!r.ok)return false;
    const t=await r.text();if(!t)return false;
    const d=JSON.parse(t);
    S.prefs.sb_token=d.access_token;S.prefs.sb_refresh=d.refresh_token;save();
    return true;
  }catch(e){return false;}
}
async function sbLogin(url,key,email,senha){
  const r=await fetch(url.replace(/\/$/,'')+'/auth/v1/token?grant_type=password',{
    method:'POST',headers:{'apikey':key,'Content-Type':'application/json'},
    body:JSON.stringify({email,password:senha})});
  const t=await r.text();
  let d={};try{d=t?JSON.parse(t):{};}catch(e){}
  if(!r.ok)throw new Error(d.error_description||d.msg||d.message||('falha na autenticação (HTTP '+r.status+')'));
  if(!d.access_token)throw new Error('resposta sem token — confira URL e anon key');
  S.prefs={...S.prefs,sb_url:url,sb_key:key,sb_email:email,sb_token:d.access_token,sb_refresh:d.refresh_token};
  save();return true;
}
function sbLogout(){
  ['sb_token','sb_refresh','sb_email'].forEach(k=>delete S.prefs[k]);
  SY.snap={};SY.last=null;save();render();
}

/* ── snapshot: fotografia do estado no último sync bem-sucedido ── */
function snapshot(){
  const m={};
  SYNC_KINDS.forEach(k=>(S[k]||[]).forEach(r=>{if(r&&r.id)m[k+'|'+r.id]=JSON.stringify(r);}));
  return m;
}
async function loadSnap(){
  try{const r=await Store.get('lozy-sync-snap');if(r&&r.value){const d=JSON.parse(r.value);SY.snap=d.snap||{};SY.last=d.last||null;}}catch(e){}
}
async function saveSnap(){
  try{await Store.set('lozy-sync-snap',JSON.stringify({snap:SY.snap,last:SY.last}));}catch(e){}
}

async function doSync(silent){
  if(!syncOn()||SY.busy)return;
  SY.busy=true;SY.err=null;if(!silent)render();
  let etapa='conexão';
  try{
    /* 1. DESCE o que mudou no servidor desde o último sync */
    etapa='baixar alterações';
    const since=SY.last?`&updated_at=gt.${encodeURIComponent(SY.last)}`:'';
    const remoto=await sbFetch(`/rest/v1/lozy_records?select=id,kind,data,updated_at,deleted&order=updated_at.asc${since}`);
    const agora=new Date().toISOString();
    const cur=snapshot();
    (remoto||[]).forEach(row=>{
      const arr=S[row.kind];if(!Array.isArray(arr))return;
      const i=arr.findIndex(x=>x&&x.id===row.id);
      const localMudou=cur[row.kind+'|'+row.id]!==SY.snap[row.kind+'|'+row.id];
      if(row.deleted){ if(i>=0&&!localMudou)arr.splice(i,1); return; }
      /* se o registro também mudou localmente, o servidor só vence se for mais novo */
      if(i>=0&&localMudou)return;
      if(i>=0)arr[i]=row.data;else arr.push(row.data);
    });

    /* 2. SOBE o que mudou aqui */
    etapa='enviar alterações';
    const depois=snapshot();
    const up=[];
    Object.keys(depois).forEach(k=>{
      if(depois[k]!==SY.snap[k]){
        const[kind,...rest]=k.split('|');
        up.push({id:rest.join('|'),kind,data:JSON.parse(depois[k]),deleted:false});
      }
    });
    const del=Object.keys(SY.snap).filter(k=>!(k in depois)).map(k=>{
      const[kind,...rest]=k.split('|');
      return{id:rest.join('|'),kind,data:{},deleted:true};
    });
    const payload=[...up,...del];
    for(let i=0;i<payload.length;i+=200){
      await sbFetch('/rest/v1/lozy_records',{method:'POST',
        headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
        body:JSON.stringify(payload.slice(i,i+200))});
    }

    /* 3. Configurações (tema, colunas, widgets) */
    etapa='salvar configurações';
    const cfg=SETTING_KEYS.map(k=>({key:k,value:S[k]===undefined?null:(k==='prefs'?sanitizePrefs(S.prefs):S[k])})).filter(x=>x.value!==null);
    if(cfg.length)await sbFetch('/rest/v1/lozy_settings',{method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(cfg)});

    SY.snap=snapshot();SY.last=agora;
    await saveSnap();save();
  }catch(e){
    SY.err='['+etapa+'] '+e.message;
    console.error('[Lozy sync]',etapa,e);
  }
  SY.busy=false;
  if(silent)renderSyncPill();else render();
}
/* nunca enviar tokens de sessão para a tabela de configurações */
function sanitizePrefs(p){
  const o={...(p||{})};
  ['sb_token','sb_refresh','sb_key','sb_url','sb_email'].forEach(k=>delete o[k]);
  return o;
}
/* primeira sincronização em máquina nova: puxa tudo */
async function syncPullAll(){
  if(!syncOn())return;
  SY.busy=true;render();
  try{
    const rows=await sbFetch('/rest/v1/lozy_records?select=id,kind,data,deleted&deleted=is.false');
    SYNC_KINDS.forEach(k=>{if(Array.isArray(S[k]))S[k]=[];});
    (rows||[]).forEach(r=>{if(Array.isArray(S[r.kind]))S[r.kind].push(r.data);});
    const cfg=await sbFetch('/rest/v1/lozy_settings?select=key,value');
    (cfg||[]).forEach(c=>{if(SETTING_KEYS.includes(c.key)&&c.value){
      if(c.key==='prefs')S.prefs={...S.prefs,...c.value};else S[c.key]=c.value;}});
    SY.snap=snapshot();SY.last=new Date().toISOString();
    await saveSnap();save();applyTheme();
  }catch(e){SY.err=e.message;}
  SY.busy=false;render();
}

/* ── indicador visual no topo ── */
function renderSyncPill(){
  const el=document.getElementById('sync-pill');if(!el)return;
  if(!syncOn()){el.innerHTML='<span class="badge-ver" title="Dados salvos apenas neste dispositivo">● local</span>';return;}
  if(SY.busy){el.innerHTML='<span class="badge-ver">↻ sincronizando…</span>';return;}
  if(SY.err){el.innerHTML=`<span class="badge-ver" style="color:var(--red)" title="${esc(SY.err)}">⚠ erro</span>`;return;}
  const h=SY.last?new Date(SY.last).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'—';
  el.innerHTML=`<span class="badge-ver" style="cursor:pointer" onclick="doSync()" title="Clique para sincronizar agora">✓ sync ${h}</span>`;
}
/* auto-sync: ao voltar para a aba e a cada 2 min */
function startAutoSync(){
  setInterval(()=>{if(syncOn()&&!document.hidden)doSync(true);},120000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&syncOn())doSync(true);});
  window.addEventListener('online',()=>{if(syncOn())doSync(true);});
}

/* ── painel de configuração (usado em Ajustes) ── */
function syncPanel(){
  const c=syncCfg();
  if(!syncOn())return `
    <div style="font-size:12px;color:var(--t2);line-height:1.7;margin-bottom:14px;">
      Hoje seus dados vivem <b>apenas neste navegador</b>. Conectando um projeto Supabase, o mesmo Hub passa a abrir sincronizado no computador e no celular.
      <br><span style="color:var(--t3)">Antes: rode o arquivo <b>supabase-schema.sql</b> no SQL Editor do seu projeto e crie seu usuário em Authentication → Users.</span>
    </div>
    <div class="f2">
      <div class="field"><label>Project URL</label><input id="sb1" placeholder="https://xxxx.supabase.co" value="${esc(c?.url)}"></div>
      <div class="field"><label>Anon key</label><input id="sb2" placeholder="eyJhbGciOi..." value="${esc(c?.key)}"></div>
    </div>
    <div class="f2">
      <div class="field"><label>E-mail</label><input id="sb3" type="email" value="${esc(c?.email)}"></div>
      <div class="field"><label>Senha</label><input id="sb4" type="password" placeholder="sua senha do Supabase"></div>
    </div>
    <button class="btn" onclick="syncConnect()">Conectar e sincronizar</button>
    <div id="sb-msg" style="font-size:11.5px;color:var(--red);margin-top:10px;"></div>`;
  return `
    <div style="font-size:12px;color:var(--t2);line-height:1.7;margin-bottom:14px;">
      Conectado como <b>${esc(c.email)}</b>. Sincroniza sozinho a cada 2 minutos e sempre que você volta para a aba.
      ${SY.last?`<br><span style="color:var(--t3)">Último sync: ${new Date(SY.last).toLocaleString('pt-BR')}</span>`:''}
      ${SY.err?`<br><span style="color:var(--red)">Erro: ${esc(SY.err)}</span>`:''}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn" onclick="doSync()">${SY.busy?'Sincronizando…':'Sincronizar agora'}</button>
      <button class="btn-sm" onclick="if(confirm('Baixar tudo do servidor e substituir os dados deste dispositivo?'))syncPullAll()">↓ Baixar tudo do servidor</button>
      <button class="btn-sm" onclick="sbLogout()">Desconectar</button>
    </div>`;
}
async function syncConnect(){
  const v=k=>document.getElementById(k).value.trim();
  const msg=document.getElementById('sb-msg');
  msg.textContent='Conectando…';msg.style.color='var(--t3)';
  try{
    await sbLogin(v('sb1'),v('sb2'),v('sb3'),document.getElementById('sb4').value);
    await loadSnap();
    await doSync();
    render();
  }catch(e){msg.textContent=e.message;msg.style.color='var(--red)';}
}
</script>
<script>
/* ═══ CLIENTES ═══ */
function cliStats(nome){
  const dems=S.demandas.filter(d=>d.cliente===nome);
  const rec=sum(S.fin.filter(f=>f.tipo==='receita'&&f.cliente===nome),f=>liq(f));
  const desp=sum(S.fin.filter(f=>f.tipo==='despesa'&&f.cliente===nome),f=>f.valor);
  return{dems:dems.length,abertas:dems.filter(d=>d.status!=='Entregue').length,rec,res:rec-desp,projetos:S.projetos.filter(p=>p.cliente===nome).length};
}
function allClientes(){
  const nomes=new Set(S.cbase.map(c=>c.nome));
  const extras=clientes().filter(n=>!nomes.has(n)).map(n=>({id:'x'+n,nome:n,email:'',tel:'',instagram:'',segmento:'',cidade:'',notas:'',derived:true}));
  return[...S.cbase,...extras];
}
function renderClientes(c){
  const q=(S.q.cli||'').toLowerCase();
  let cs=allClientes().filter(x=>!q||[x.nome,x.segmento,x.email,x.instagram].join(' ').toLowerCase().includes(q));
  cs.sort((a,b)=>a.nome.localeCompare(b.nome));
  c.innerHTML=`
    <div class="page-hd"><div><div class="page-title">Clientes</div></div>
    <button class="btn-ghost" onclick="openCliente()">+ Novo cliente</button></div>
    ${tabsHtml('clientes',[{id:'cards',l:'Cards'},{id:'lista',l:'Lista'},{id:'porreceita',l:'Por receita'}])}

 {id:'oliva',nome:'Oliva',bg:'#3a3d34',surf:'#d7d9cf',acc:'#20231c'}
];
function hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function toHex(r,g,b){return '#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('');}
function lum(h){const[r,g,b]=hx(h);return(0.299*r+0.587*g+0.114*b)/255;}
function mix(a,b,t){const A=hx(a),B=hx(b);return toHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);}
function applyTheme(){
  const t=S.theme||THEME_PRESETS[0];
  const r=document.documentElement.style;
  const surfDark=lum(t.surf)<0.5, bgDark=lum(t.bg)<0.5;
  const txt=surfDark?'#f0f0f0':'#161616', txtInk=surfDark?'#ffffff':'#000000';
  const lx=bgDark?'#efefef':'#161616';
  r.setProperty('--bg',t.bg);
  r.setProperty('--chrome',mix(t.bg,surfDark||bgDark?'#ffffff':'#000000',bgDark?0.04:0.05*-1+0.05));
  r.setProperty('--chrome',mix(t.bg,bgDark?'#ffffff':'#000000',0.04));
  r.setProperty('--bline',mix(t.bg,bgDark?'#ffffff':'#000000',0.18));
  r.setProperty('--s1',t.surf);r.setProperty('--lt',t.surf);
  r.setProperty('--s2',mix(t.surf,txtInk,0.06));r.setProperty('--lt2',mix(t.surf,txtInk,0.06));
  r.setProperty('--s3',mix(t.surf,txtInk,0.12));
  r.setProperty('--ltb',mix(t.surf,txtInk,0.15));r.setProperty('--b1',mix(t.surf,txtInk,0.15));
  r.setProperty('--b2',mix(t.surf,txtInk,0.21));
  r.setProperty('--b3',mix(t.surf,txtInk,0.32));
  r.setProperty('--t1',txt);r.setProperty('--dk1',txt);
  r.setProperty('--t2',mix(txt,t.surf,0.28));r.setProperty('--dk2',mix(txt,t.surf,0.28));
  r.setProperty('--t3',mix(txt,t.surf,0.48));r.setProperty('--dk3',mix(txt,t.surf,0.48));
  r.setProperty('--lx1',lx);
  r.setProperty('--lx2',mix(lx,t.bg,0.3));
  r.setProperty('--lx3',mix(lx,t.bg,0.5));
  r.setProperty('--acc',t.acc);
  r.setProperty('--accT',lum(t.acc)<0.5?'#f5f5f5':'#161616');
}

/* ═══ LOZY AI ═══ */
let AIH=[];let aiBusy=false;
function aiToggle(){document.getElementById('ai-panel').classList.toggle('show');
  if(document.getElementById('ai-panel').classList.contains('show'))setTimeout(()=>document.getElementById('ai-input')?.focus(),80);}
function aiSnapshot(){
  const mk=monthKey(todayStr());
  return JSON.stringify({
    hoje:todayStr(),
    leads_abertos:S.leads.filter(l=>!['Fechado','Perdido'].includes(l.stage)).map(l=>({empresa:l.empresa,stage:l.stage,valor:l.valor,temp:l.temp})).slice(0,15),
    demandas_abertas:S.demandas.filter(d=>d.status!=='Entregue').map(d=>({uid:d.uid,titulo:d.titulo,cliente:d.cliente,prazo:demPrazoAtivo(d),status:d.status})).slice(0,20),
    tarefas_pendentes:S.tasks.filter(t=>t.status!=='Concluída').map(t=>({titulo:t.titulo,prazo:t.prazo,prioridade:t.prioridade})).slice(0,15),
    financeiro_mes:{recebido:sum(S.fin.filter(f=>f.tipo==='receita'&&f.pago&&mesRef(f)===mk),f=>liq(f)),pago:sum(S.fin.filter(f=>f.tipo==='despesa'&&f.pago&&mesRef(f)===mk),f=>f.valor),a_receber:sum(S.fin.filter(f=>f.tipo==='receita'&&!f.pago),f=>liq(f)),a_pagar:sum(S.fin.filter(f=>f.tipo==='despesa'&&!f.pago),f=>f.valor)},
    eventos_semana:S.eventos.filter(e=>weekDays().map(dstr).includes(e.data)).map(e=>({titulo:e.titulo,data:e.data,h:e.hIni})),
    projetos:S.projetos.map(p=>({nome:p.nome,fase:p.fase})).slice(0,12)
  });
}
const AI_SYS=`Você é o assistente do Lozy Hub, sistema de gestão da Lozy Creative (agência audiovisual de Leonardo, São Paulo). Você recebe um snapshot JSON dos dados atuais. Responda em português, direto e útil.
Você DEVE responder APENAS com JSON válido, sem markdown, neste formato:
{"reply":"sua resposta em texto","actions":[]}
Ações disponíveis (inclua em actions apenas quando o usuário pedir para criar algo):
{"type":"addTask","titulo":"...","prioridade":"Alta|Média|Baixa","prazo":"YYYY-MM-DD ou null"}
{"type":"addDemanda","titulo":"...","cliente":"...","tipo":"Reel|Brutos|Fotos|Podcast|Youtube|Publicidade|Tráfego|Cobertura|Extra","prazo":"YYYY-MM-DD ou null"}
{"type":"addLead","empresa":"...","contato":"...","valor":0,"temp":"quente|morno|frio"}
{"type":"addEvento","titulo":"...","data":"YYYY-MM-DD","hIni":"HH:MM","hFim":"HH:MM","tipo":"Reunião|Gravação|Edição|Entrega|Outro"}
{"type":"addReceita","desc":"...","valor":0,"data":"YYYY-MM-DD","aliquota":6,"cliente":"..."}
{"type":"addDespesa","desc":"...","valor":0,"data":"YYYY-MM-DD","categoria":"Equipamentos|Softwares|Transporte|Alimentação|Operação|Outros"}
Regras de preços Lozy (para dúvidas): captação simples 4h/6h/8h=R$650/950/1250; cirurgia/evento=850/1150/1450; Um Mês em Um Dia 4h=850; hora extra 150; edição pacote(10+) simples/dinâmico=140/160; pontual=160/200; aftermovie 380; versão extra 80; revisão extra 80; desconto só sobre serviço; sinal 40% da captação; validade 30 dias.`;
function aiMsg(cls,txt){
  const m=document.getElementById('ai-msgs');
  const d=document.createElement('div');d.className='ai-m '+cls;d.textContent=txt;
  m.appendChild(d);m.scrollTop=m.scrollHeight;return d;
}
async function aiSend(){
  const inp=document.getElementById('ai-input');const q=inp.value.trim();
  if(!q||aiBusy)return;
  inp.value='';aiMsg('u',q);AIH.push({role:'user',content:q});
  aiBusy=true;const wait=aiMsg('sys','pensando…');
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:AI_SYS+'\n\nSNAPSHOT ATUAL:\n'+aiSnapshot(),messages:AIH.slice(-12)})});
    const data=await res.json();
    const raw=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    let parsed;try{parsed=JSON.parse(raw.replace(/```json|```/g,'').trim());}catch(e){parsed={reply:raw||'Não consegui interpretar a resposta.',actions:[]};}
    wait.remove();
    aiMsg('a',parsed.reply);
    AIH.push({role:'assistant',content:raw});
    const feitos=[];
    (parsed.actions||[]).forEach(a=>{
      if(a.type==='addTask'){S.tasks.unshift({id:uid('t'),titulo:a.titulo,prioridade:a.prioridade||'Média',status:'A fazer',prazo:a.prazo||null});feitos.push('tarefa "'+a.titulo+'"');}
      else if(a.type==='addDemanda'){S.demandas.push({id:uid('d'),uid:nextDemUid(),titulo:a.titulo,cliente:a.cliente||'',tipo:a.tipo||'Edição',status:DSTATUS[0],prazo:a.prazo||null,maeId:null,receita:0,custo:0,horas:0});feitos.push('demanda "'+a.titulo+'"');}
      else if(a.type==='addLead'){S.leads.push({id:uid('l'),empresa:a.empresa,contato:a.contato||'',valor:Number(a.valor)||0,origem:'Lozy AI',temp:a.temp||'morno',stage:'Novo Lead',segmento:'',cidade:'',proxAcao:'',proxData:null});feitos.push('lead "'+a.empresa+'"');}
      else if(a.type==='addEvento'){S.eventos.push({id:uid('e'),titulo:a.titulo,tipo:a.tipo||'Reunião',data:a.data||todayStr(),hIni:a.hIni||'09:00',hFim:a.hFim||'',local:''});feitos.push('evento "'+a.titulo+'"');}
      else if(a.type==='addReceita'){const _data=a.data||todayStr();S.fin.push({id:uid('f'),tipo:'receita',desc:a.desc,valor:Number(a.valor)||0,data:_data,competencia:a.competencia||monthKey(_data),tipoReceita:'Extra',aliquota:Number(a.aliquota)||6,forma:'PIX',conta:'Conta PJ',cliente:a.cliente||'',pago:false});S.finLastUpdate=new Date().toISOString();feitos.push('receita "'+a.desc+'"');}
      else if(a.type==='addDespesa'){S.fin.push({id:uid('f'),tipo:'despesa',desc:a.desc,valor:Number(a.valor)||0,data:a.data||todayStr(),categoria:a.categoria||'Outros',natureza:'Variável',mecanismo:'À vista',forma:'PIX',conta:'Conta PJ',cliente:'',pago:false});S.finLastUpdate=new Date().toISOString();feitos.push('despesa "'+a.desc+'"');}
    });
    if(feitos.length){save();render();aiMsg('sys','✓ Criado: '+feitos.join(', '));}
  }catch(e){
    wait.remove();
    aiMsg('sys','Sem conexão com a API — o assistente funciona quando o Lozy Hub roda dentro do claude.ai. Em hospedagem própria, entra no roadmap do backend.');
  }
  aiBusy=false;
}
function mountAI(){
  const fab=document.createElement('button');fab.className='ai-fab';fab.innerHTML='✦';fab.onclick=aiToggle;fab.title='Lozy AI';
  const p=document.createElement('div');p.className='ai-panel';p.id='ai-panel';
  p.innerHTML=`<div class="ai-hd"><span>✦ Lozy AI</span><button class="ibtn" onclick="aiToggle()">✕</button></div>
  <div class="ai-msgs" id="ai-msgs"><div class="ai-m a">Oi, Leonardo. Posso responder sobre sua operação ou criar coisas por você — ex: "cria uma tarefa de revisar o reel da clínica pra amanhã, prioridade alta" ou "como tá meu mês no financeiro?"</div></div>
  <div class="ai-in"><input id="ai-input" placeholder="Pergunte ou peça algo..." onkeydown="if(event.key==='Enter')aiSend()"><button class="btn" onclick="aiSend()">→</button></div>`;
  document.body.appendChild(fab);document.body.appendChild(p);
}
