function finRecorrentes(b){
  const f=S.f.finRec||{};
  const srt=S.sort.finRec||{campo:'proxima',dir:'asc'};
  const dirmul=srt.dir==='asc'?1:-1;
  const cmp=(a,b2)=>(a>b2?1:a<b2?-1:0)*dirmul;

  let ps=S.parc.map(p=>({p,i:parcInfo(p)}));
  ps=ps.filter(({p,i})=>(!f.cat||p.categoria===f.cat)&&(!f.conta||p.conta===f.conta)&&(!f.status||(f.status==='quitado'?i.quitado:!i.quitado)));
  ps.sort((a,b2)=>srt.campo==='valor'?cmp(a.i.valorParcela,b2.i.valorParcela):srt.campo==='nome'?cmp(a.p.nome.toLowerCase(),b2.p.nome.toLowerCase()):cmp(a.i.proxData||'9999',b2.i.proxData||'9999'));

  let as=S.assin.map(a=>({a,i:assinInfo(a)}));
  as=as.filter(({a})=>(!f.cat||a.categoria===f.cat)&&(!f.conta||a.conta===f.conta));
  as.sort((x,y)=>srt.campo==='valor'?cmp(x.a.valor,y.a.valor):srt.campo==='nome'?cmp(x.a.nome.toLowerCase(),y.a.nome.toLowerCase()):cmp(x.i.prox,y.i.prox));

  const ativos=ps.filter(x=>!x.i.quitado);
  const compromisso=sum(ativos,x=>x.i.restante);
  const mensalParc=sum(ativos,x=>x.i.valorParcela);
  const mensalAssin=sum(as.filter(x=>x.a.ativo!==false),x=>x.a.tipo==='Yearly'?x.a.valor/12:x.a.valor);

  const parcHtml=ps.map(({p,i})=>`<div class="row-item"><div style="flex:1;min-width:0;">
      <div class="ri-name">${esc(p.nome)} <span class="bdg" style="${i.quitado?'color:var(--green)':''}">${i.pagas} de ${p.nParcelas} pagas</span></div>
      <div class="ri-sub">${p.categoria} · ${p.conta} · ${fmtBRL2(i.valorParcela)}/mês · Total ${fmtBRL(p.valorTotal)}${i.quitado?' · quitado ✓':' · faltam '+(p.nParcelas-i.pagas)+' parcelas ('+fmtBRL(i.restante)+') · próxima '+fmtD(i.proxData)}</div>
      <div style="height:4px;background:rgba(0,0,0,.09);border-radius:99px;margin-top:6px;max-width:280px;"><div style="height:100%;background:${i.quitado?'var(--green)':'var(--acc)'};border-radius:99px;width:${Math.round(i.pagas/p.nParcelas*100)}%"></div></div>
    </div>
    <div style="display:flex;gap:4px;align-items:center;">
    ${i.quitado?'<span class="bdg" style="color:var(--green)">✓ Quitado</span>':`<button class="btn-sm" onclick="lancarParcela('${p.id}')">${i.pendente?'Pagar':'Lançar'} parcela ${i.pagas+1}</button>`}
    <button class="ibtn" onclick="openParc('${p.id}')">✎</button><button class="ibtn del" onclick="delParc('${p.id}')">✕</button></div></div>`).join('');

  const assHtml=as.map(({a,i})=>`<div class="row-item" style="opacity:${a.ativo===false?0.5:1}"><div style="flex:1;min-width:0;">
      <div class="ri-name">${esc(a.nome)} <span class="bdg">${a.tipo==='Yearly'?'↻ anual':'↻ mensal'}</span>${a.ativo===false?' <span class="bdg" style="color:var(--red)">pausada</span>':''}</div>
      <div class="ri-sub">${a.categoria} · ${a.conta} · ${fmtBRL(a.valor)}${a.tipo==='Yearly'?'/ano':'/mês'} · ${i.cobrancas?i.cobrancas+' cobranças · última '+fmtD(i.ultima):'nenhuma cobrança lançada'}</div></div>
      <div style="display:flex;gap:4px;align-items:center;">
      <button class="btn-sm" onclick="lancarCobranca('${a.id}')">${i.pendente?'Pagar':'Lançar'} ${fmtD(i.prox)}</button>
      <button class="ibtn" onclick="toggleAssin('${a.id}')" title="${a.ativo===false?'Reativar':'Pausar'}">${a.ativo===false?'▶':'❚❚'}</button>
      <button class="ibtn" onclick="openAssin('${a.id}')">✎</button><button class="ibtn del" onclick="delAssin('${a.id}')">✕</button></div></div>`).join('');

  const toolbar=`<div class="toolbar">
    <select class="fsel" onchange="S.f.finRec={...S.f.finRec,cat:this.value};render()"><option value="">Categoria: Todas</option>${FCATS.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    <select class="fsel" onchange="S.f.finRec={...S.f.finRec,conta:this.value};render()"><option value="">Conta: Todas</option>${CONTAS.map(c=>`<option ${f.conta===c.nome?'selected':''}>${c.nome}</option>`).join('')}</select>
    <select class="fsel" onchange="S.f.finRec={...S.f.finRec,status:this.value};render()"><option value="">Parcelamentos: Todos</option><option value="andamento" ${f.status==='andamento'?'selected':''}>Em andamento</option><option value="quitado" ${f.status==='quitado'?'selected':''}>Quitados</option></select>
    <select class="fsel" onchange="S.sort.finRec={...srt,campo:this.value};render()"><option value="proxima" ${srt.campo==='proxima'?'selected':''}>Ordenar: Próxima data</option><option value="valor" ${srt.campo==='valor'?'selected':''}>Ordenar: Valor</option><option value="nome" ${srt.campo==='nome'?'selected':''}>Ordenar: Nome</option></select>
    <button class="ibtn" title="Inverter ordem" onclick="S.sort.finRec={...srt,dir:srt.dir==='asc'?'desc':'asc'};render()">${srt.dir==='asc'?'↑':'↓'}</button>
    ${(f.cat||f.conta||f.status)?'<button class="btn-sm" onclick="S.f.finRec={};render()">Limpar filtros</button>':''}
    <span style="flex:1"></span>
    <button class="btn-ghost" onclick="openParc()">+ Parcelamento</button><button class="btn-ghost" onclick="openAssin()">+ Assinatura</button>
  </div>`;

  b.innerHTML=toolbar+`<div class="g3">
    <div class="card"><div class="clabel">Compromisso futuro</div><div class="metric">${fmtBRL(compromisso)}</div><div class="metric-s">${ativos.length} parcelamentos ativos</div></div>
    <div class="card"><div class="clabel">Parcelas por mês</div><div class="metric">${fmtBRL(mensalParc)}</div><div class="metric-s">enquanto durarem</div></div>
    <div class="card"><div class="clabel">Assinaturas por mês</div><div class="metric">${fmtBRL(mensalAssin)}</div><div class="metric-s">${as.filter(x=>x.a.ativo!==false).length} ativas</div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="widget-hd"><span class="widget-ttl">Parcelamentos</span><span class="widget-more">${(()=>{const pend=parcAudit().filter(x=>!x.ok).length;return `${ps.length} exibidos · ${ativos.length} em andamento${pend?` · <a style="color:var(--amber);cursor:pointer;text-decoration:underline" onclick="openRevisarParcelas()">${pend} com datas a revisar</a>`:` · <a style="color:var(--acc);cursor:pointer;text-decoration:underline" onclick="openRevisarParcelas()">revisar datas</a>`}`;})()}</span></div>
    ${parcHtml||'<div class="empty-msg">Nenhum parcelamento com esses filtros.</div>'}</div>
    <div class="card"><div class="widget-hd"><span class="widget-ttl">Assinaturas</span><span class="widget-more">${fmtBRL(mensalAssin)}/mês</span></div>
    ${assHtml||'<div class="empty-msg">Nenhuma assinatura com esses filtros.</div>'}</div>
  </div>
  <div class="card" style="font-size:11.5px;color:var(--t3);line-height:1.7;"><b style="color:var(--t2)">Como funciona:</b> Parcelamentos e assinaturas são <b>cadastros próprios</b> — o plano fica registrado (valor total, nº de parcelas, periodicidade) e cada cobrança vira um lançamento quando você clica em "Lançar". É o mesmo modelo do Notion (botões Add Parcela / Add Charge): o histórico reflete só o que realmente aconteceu, e o compromisso futuro fica visível sem poluir o caixa.</div>`;
}
</script>
<script>
/* ═══ AGENDA ═══ */
function renderAgenda(c){
  const days=weekDays();const today=todayStr();
  const dows=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
  c.innerHTML=`
    <div class="page-hd"><div><div class="page-title">Agenda</div></div>
    <div style="display:flex;gap:8px;"><button class="btn-ghost" onclick="exportICS()">↓ Exportar .ics</button><button class="btn-ghost" onclick="openEvento()">+ Novo evento</button></div></div>
    <div style="font-size:11.5px;color:var(--t3);margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap;">
      <span><span class="sdot s-blue"></span>Reunião</span><span><span class="sdot s-red"></span>Gravação</span><span><span class="sdot s-amber"></span>Edição</span><span><span class="sdot s-green"></span>Entrega</span><span><span class="sdot" style="background:#c084fc"></span>Prazo de demanda</span>
    </div>
    <div class="ag-week">${days.map((d,i)=>{
      const ds=dstr(d);
      const evs=S.eventos.filter(e=>e.data===ds).sort((a,b)=>(a.hIni||'').localeCompare(b.hIni||''));
      const przs=S.demandas.filter(x=>x.status!=='Entregue'&&x.prazo===ds);
      return `<div class="ag-day ${ds===today?'today':''}"><div class="ag-dhd">${dows[i]}</div><div class="ag-dnum">${d.getDate()}</div>
      ${evs.map(e=>`<div class="ag-ev ev-${e.tipo.toLowerCase().normalize('NFD').replace(/[^a-z]/g,'')||'outro'}" onclick="openEvento('${e.id}')" style="cursor:pointer">
        <div class="t">${esc(e.titulo)}</div><div class="h">${e.hIni||''}${e.hFim?'–'+e.hFim:''}${e.local?' · '+esc(e.local):''}</div>
        <div style="display:flex;gap:8px;margin-top:3px;"><a href="${gcalLink(e)}" target="_blank" onclick="event.stopPropagation()">+ Google Agenda</a><a href="#" onclick="event.stopPropagation();delEvento('${e.id}');return false;">excluir</a></div></div>`).join('')}
      ${przs.map(p=>`<div class="ag-ev ev-prazo"><div class="t">Prazo: ${esc(p.titulo)}</div><div class="h">${esc(p.cliente||'')} · ${p.uid}</div></div>`).join('')}
      ${(!evs.length&&!przs.length)?'<div style="font-size:10.5px;color:var(--t3);padding:4px 0;">—</div>':''}
      </div>`;
    }).join('')}</div>
    <div class="card" style="margin-top:14px;font-size:11.5px;color:var(--t3);line-height:1.7;">
      <b style="color:var(--t2)">Google Agenda:</b> cada evento tem um link "+ Google Agenda" que abre o evento pré-preenchido na sua conta. Para levar tudo de uma vez, use <b>Exportar .ics</b> e importe o arquivo em calendar.google.com → Configurações → Importar. Sincronização automática de mão dupla entra no roadmap quando o hub ganhar backend.
    </div>`;
}
function gcalLink(e){
  const d=e.data.replace(/-/g,'');
  const hi=(e.hIni||'09:00').replace(':','')+'00';
  const hf=(e.hFim||e.hIni||'10:00').replace(':','')+'00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.titulo)+'&dates='+d+'T'+hi+'/'+d+'T'+hf+'&details='+encodeURIComponent('Evento Lozy Hub — '+e.tipo)+(e.local?'&location='+encodeURIComponent(e.local):'');
}
function exportICS(){
  if(!S.eventos.length)return;
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LozyHub//PT-BR'];
  S.eventos.forEach(e=>{
    const d=e.data.replace(/-/g,'');
    lines.push('BEGIN:VEVENT','UID:'+e.id+'@lozyhub','DTSTART:'+d+'T'+((e.hIni||'09:00').replace(':',''))+'00','DTEND:'+d+'T'+((e.hFim||e.hIni||'10:00').replace(':',''))+'00','SUMMARY:'+e.titulo.replace(/[,;]/g,' '),e.local?'LOCATION:'+e.local.replace(/[,;]/g,' '):'','END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const blob=new Blob([lines.filter(Boolean).join('\r\n')],{type:'text/calendar'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lozy-agenda.ics';a.click();
}
function delEvento(id){softDel('eventos',id);}
function openEvento(id){
  const e=id?S.eventos.find(x=>x.id===id):null;
  openModal(e?'Editar evento':'Novo evento',`
    <div class="field"><label>Título</label><input id="m1" value="${esc(e?.titulo)}" placeholder="Ex: Reunião com cliente"></div>
    <div class="f2"><div class="field"><label>Tipo</label><select id="m2">${ETIPOS.map(t=>`<option ${e?.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Data</label><input id="m3" type="date" value="${e?.data||todayStr()}"></div></div>
    <div class="f2"><div class="field"><label>Início</label><input id="m4" type="time" value="${e?.hIni||'14:00'}"></div>
    <div class="field"><label>Fim</label><input id="m5" type="time" value="${e?.hFim||'15:00'}"></div></div>
    <div class="field"><label>Local / link</label><input id="m6" value="${esc(e?.local)}" placeholder="Sala, endereço ou link da call"></div>`,
  ()=>{const v=k=>document.getElementById(k).value;if(!v('m1').trim())return;
    const data={titulo:v('m1').trim(),tipo:v('m2'),data:v('m3'),hIni:v('m4'),hFim:v('m5'),local:v('m6').trim()};
    if(e)Object.assign(e,data);else S.eventos.push({id:uid('e'),...data});
    save();closeModal();render();});
}

/* ═══ CENTRO ESTRATÉGICO ═══ */
function renderCentral(c){
  c.innerHTML=`
    <div class="page-hd"><div><div class="page-title">Centro Estratégico</div></div></div>
    ${tabsHtml('central',[{id:'visao',l:'Visão Geral'},{id:'comercial',l:'Comercial'},{id:'producao',l:'Produção'},{id:'financeiro',l:'Financeiro'},{id:'clientes',l:'Clientes'},{id:'crescimento',l:'Crescimento'}])}
    <div id="ce-body"></div>`;
  ({visao:ceVisao,comercial:ceComercial,producao:ceProducao,financeiro:ceFinanceiro,clientes:ceClientes,crescimento:ceCrescimento}[S.tab.central])(document.getElementById('ce-body'));
}
function mesTot(mk){
  return{
    rec:sum(S.fin.filter(f=>f.tipo==='receita'&&f.pago&&mesRef(f)===mk),f=>liq(f)),
    desp:sum(S.fin.filter(f=>f.tipo==='despesa'&&f.pago&&mesRef(f)===mk),f=>f.valor)
  };
}
function prevMk(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}

function ceVisao(b){
  const mk=monthKey(todayStr());const cur=mesTot(mk);
  const ganhos=S.leads.filter(l=>l.stage==='Fechado').length;
  const perdidos=S.leads.filter(l=>l.stage==='Perdido').length;
  const conv=(ganhos+perdidos)?ganhos/(ganhos+perdidos)*100:0;
  b.innerHTML=`<div class="g4">
    <div class="card"><div class="clabel">Receita do mês</div><div class="metric">${fmtBRL(cur.rec)}</div></div>
    <div class="card"><div class="clabel">Lucro do mês</div><div class="metric" style="color:${cur.rec-cur.desp<0?'var(--red)':'var(--t1)'}">${fmtBRL(cur.rec-cur.desp)}</div><div class="metric-s">margem ${cur.rec?((cur.rec-cur.desp)/cur.rec*100).toFixed(1):0}%</div></div>
    <div class="card"><div class="clabel">Conversão comercial</div><div class="metric">${conv.toFixed(0)}%</div><div class="metric-s">${ganhos} ganhos / ${perdidos} perdidos</div></div>
    <div class="card"><div class="clabel">Produções ativas</div><div class="metric">${S.projetos.filter(p=>p.fase!=='Entrega').length}</div><div class="metric-s">${S.demandas.filter(d=>d.status!=='Entregue').length} demandas abertas</div></div>
  </div>
  <div class="card" style="font-size:12px;color:var(--t2);line-height:1.7;">Use as abas acima para mergulhar em cada área. Todos os números vêm em tempo real dos módulos — nada é digitado duas vezes.</div>`;
}
function ceComercial(b){
  const novos=S.leads.length;
  const ganhos=S.leads.filter(l=>l.stage==='Fechado');
  const perdidos=S.leads.filter(l=>l.stage==='Perdido').length;
  const conv=(ganhos.length+perdidos)?ganhos.length/(ganhos.length+perdidos)*100:0;
  const ticket=ganhos.length?sum(ganhos)/ganhos.length:0;
  const emNeg=S.leads.filter(l=>l.stage==='Negociação');
  const maxV=Math.max(1,...STAGES.map(st=>sum(S.leads.filter(l=>l.stage===st))));
  b.innerHTML=`<div class="g4">
    <div class="card"><div class="clabel">Leads totais</div><div class="metric">${novos}</div></div>
    <div class="card"><div class="clabel">Conversão</div><div class="metric">${conv.toFixed(0)}%</div><div class="metric-s">${ganhos.length} ganhos / ${perdidos} perdidos</div></div>
    <div class="card"><div class="clabel">Ticket médio</div><div class="metric">${fmtBRL(ticket)}</div></div>
    <div class="card"><div class="clabel">Em negociação</div><div class="metric">${fmtBRL(sum(emNeg))}</div><div class="metric-s">${emNeg.length} conversas</div></div>
  </div>
  <div class="card"><div class="widget-hd"><span class="widget-ttl">Funil comercial</span></div>
  ${STAGES.map(st=>{const ls=S.leads.filter(l=>l.stage===st);const v=sum(ls);
  return `<div style="display:flex;align-items:center;gap:12px;padding:7px 0;"><div style="width:120px;font-size:12px;color:var(--t2)">${st}</div>
  <div style="flex:1;height:5px;background:rgba(0,0,0,.09);border-radius:99px;overflow:hidden;"><div style="height:100%;background:var(--t1);border-radius:99px;width:${Math.round(v/maxV*100)}%"></div></div>
  <div style="min-width:110px;text-align:right;font-size:11.5px;color:var(--t3)">${ls.length} · ${fmtBRL(v)}</div></div>`;}).join('')}</div>`;
}
function ceProducao(b){
  const concl=S.projetos.filter(p=>p.fase==='Entrega').length;
  const atras=S.projetos.filter(p=>p.entrega&&p.fase!=='Entrega'&&prazoStatus(p.entrega)?.cls==='atrasada').length;
  const tkC=S.tasks.filter(t=>t.status==='Concluída').length;
  const tkP=S.tasks.length-tkC;
  const demAtras=S.demandas.filter(d=>d.status!=='Entregue'&&demPrazoAtivo(d)&&prazoStatus(demPrazoAtivo(d))?.cls==='atrasada').length;
  b.innerHTML=`<div class="g4">
    <div class="card"><div class="clabel">Projetos ativos</div><div class="metric">${S.projetos.filter(p=>p.fase!=='Entrega').length}</div></div>
    <div class="card"><div class="clabel">Concluídos</div><div class="metric">${concl}</div></div>
    <div class="card"><div class="clabel">Atrasados</div><div class="metric" style="color:${atras?'var(--red)':'var(--t1)'}">${atras}</div><div class="metric-s">${demAtras} demandas atrasadas</div></div>
    <div class="card"><div class="clabel">Tarefas</div><div class="metric">${tkC}<span style="color:var(--t3);font-size:14px"> / ${tkC+tkP}</span></div><div class="metric-s">concluídas / total</div></div>
  </div>
  <div class="card"><div class="widget-hd"><span class="widget-ttl">Demandas por status</span></div>
  ${DSTATUS.map(st=>{const n=S.demandas.filter(d=>d.status===st).length;const mx=Math.max(1,S.demandas.length);
  return `<div style="display:flex;align-items:center;gap:12px;padding:7px 0;"><div style="width:120px;font-size:12px;color:var(--t2)">${st}</div>
  <div style="flex:1;height:5px;background:rgba(0,0,0,.09);border-radius:99px;"><div style="height:100%;background:var(--t1);border-radius:99px;width:${Math.round(n/mx*100)}%"></div></div>
  <div style="min-width:40px;text-align:right;font-size:11.5px;color:var(--t3)">${n}</div></div>`;}).join('')}</div>`;
}
function ceFinanceiro(b){
  const mk=monthKey(todayStr());
  const rec=S.fin.filter(f=>f.tipo==='receita');
  const desp=S.fin.filter(f=>f.tipo==='despesa');
  const recebido=sum(rec.filter(f=>f.pago&&mesRef(f)===mk),f=>liq(f));
  const aReceber=sum(rec.filter(f=>!f.pago),f=>liq(f));
  const pago=sum(desp.filter(f=>f.pago&&mesRef(f)===mk),f=>f.valor);
  const aPagar=sum(desp.filter(f=>!f.pago),f=>f.valor);
  const atrasR=sum(rec.filter(f=>!f.pago&&f.data&&prazoStatus(f.data)?.cls==='atrasada'),f=>liq(f));
  const atrasP=sum(desp.filter(f=>!f.pago&&f.data&&prazoStatus(f.data)?.cls==='atrasada'),f=>f.valor);
  const fixo=sum(desp.filter(f=>f.natureza==='Fixo'&&mesRef(f)===mk),f=>f.valor);
  const varv=sum(desp.filter(f=>f.natureza==='Variável'&&mesRef(f)===mk),f=>f.valor);
  b.innerHTML=`<div class="g3">
    <div class="card"><div class="clabel">Recebido (mês)</div><div class="metric" style="color:var(--green)">${fmtBRL(recebido)}</div><div class="metric-s">${fmtBRL(aReceber)} a receber · <span style="color:var(--red)">${fmtBRL(atrasR)} atrasado</span></div></div>
    <div class="card"><div class="clabel">Pago (mês)</div><div class="metric" style="color:var(--red)">${fmtBRL(pago)}</div><div class="metric-s">${fmtBRL(aPagar)} a pagar · <span style="color:var(--red)">${fmtBRL(atrasP)} atrasado</span></div></div>
    <div class="card"><div class="clabel">Saldo previsto</div><div class="metric">${fmtBRL(recebido+aReceber-pago-aPagar)}</div><div class="metric-s">margem realizada ${recebido?((recebido-pago)/recebido*100).toFixed(1):0}%</div></div>
  </div>
  <div class="card"><div class="widget-hd"><span class="widget-ttl">Estrutura de custos do mês</span><span class="widget-more">Natureza — regra Central Lozy</span></div>
  <div style="display:flex;gap:12px;">
    <div style="flex:1"><div class="clabel">Fixo</div><div class="metric" style="font-size:18px">${fmtBRL(fixo)}</div></div>
    <div style="flex:1"><div class="clabel">Variável</div><div class="metric" style="font-size:18px">${fmtBRL(varv)}</div></div>
    <div style="flex:1"><div class="clabel">Fixo / Receita</div><div class="metric" style="font-size:18px">${recebido?(fixo/recebido*100).toFixed(0):0}%</div></div>
  </div></div>`;
}
function ceClientes(b){
  const map={};
  S.fin.filter(f=>f.tipo==='receita').forEach(f=>{const k=f.cliente||'Sem cliente';map[k]=map[k]||{rec:0,desp:0};map[k].rec+=liq(f);});
  S.fin.filter(f=>f.tipo==='despesa'&&f.cliente).forEach(f=>{map[f.cliente]=map[f.cliente]||{rec:0,desp:0};map[f.cliente].desp+=Number(f.valor);});
  const top=Object.entries(map).sort((a,b)=>b[1].rec-a[1].rec).slice(0,8);
  const topL=Object.entries(map).sort((a,b)=>(b[1].rec-b[1].desp)-(a[1].rec-a[1].desp)).slice(0,8);
  b.innerHTML=`<div class="g3">
    <div class="card"><div class="clabel">Total de clientes</div><div class="metric">${clientes().length}</div></div>
    <div class="card"><div class="clabel">Com receita registrada</div><div class="metric">${Object.keys(map).filter(k=>map[k].rec>0).length}</div></div>
    <div class="card"><div class="clabel">Projetos por cliente</div><div class="metric">${clientes().length?(S.projetos.length/clientes().length).toFixed(1):0}</div><div class="metric-s">média</div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="widget-hd"><span class="widget-ttl">Top por receita</span></div>
    ${top.length?top.map(([cl,v])=>`<div class="row-item"><div class="ri-name">${esc(cl)}</div><div class="ri-val" style="color:var(--green)">${fmtBRL(v.rec)}</div></div>`).join(''):'<div class="empty-msg">Sem receitas por cliente ainda.</div>'}</div>
    <div class="card"><div class="widget-hd"><span class="widget-ttl">Top por resultado</span></div>
    ${topL.length?topL.map(([cl,v])=>`<div class="row-item"><div class="ri-name">${esc(cl)}</div><div class="ri-val" style="color:${v.rec-v.desp<0?'var(--red)':'var(--green)'}">${fmtBRL(v.rec-v.desp)}</div></div>`).join(''):'<div class="empty-msg">Sem dados suficientes.</div>'}</div>
  </div>`;
}
function ceCrescimento(b){
  const mk=monthKey(todayStr());const pv=prevMk();
  const cur=mesTot(mk),ant=mesTot(pv);
  const dRec=ant.rec?((cur.rec-ant.rec)/ant.rec*100):null;
  const lCur=cur.rec-cur.desp,lAnt=ant.rec-ant.desp;
  const dLuc=lAnt?((lCur-lAnt)/Math.abs(lAnt)*100):null;
  const months=[];const d=new Date();d.setDate(1);
  for(let i=5;i>=0;i--){const m=new Date(d);m.setMonth(m.getMonth()-i);months.push(m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0'));}
  const serie=months.map(m=>({m,...mesTot(m)}));
  const mx=Math.max(1,...serie.map(x=>Math.max(x.rec,x.rec-x.desp,0)));
  const bars=(get,color)=>`<div class="chart-bars" style="height:110px">${serie.map(x=>`<div class="cb-group"><div class="cb" style="background:${color};height:${Math.max(2,Math.max(0,get(x))/mx*100)}%"></div></div>`).join('')}</div>
  <div class="chart-lbls">${serie.map(x=>{const[y,m]=x.m.split('-');return '<span>'+new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</span>';}).join('')}</div>`;
  b.innerHTML=`<div class="g2">
    <div class="card"><div class="clabel">Receita</div><div class="metric">${fmtBRL(cur.rec)}</div><div class="metric-s">${dRec===null?'sem base de comparação':'<span style="color:'+(dRec>=0?'var(--green)':'var(--red)')+'">'+(dRec>=0?'▲':'▼')+' '+Math.abs(dRec).toFixed(1)+'%</span> vs mês anterior'}</div></div>
    <div class="card"><div class="clabel">Lucro</div><div class="metric" style="color:${lCur<0?'var(--red)':'var(--t1)'}">${fmtBRL(lCur)}</div><div class="metric-s">${dLuc===null?'sem base de comparação':'<span style="color:'+(dLuc>=0?'var(--green)':'var(--red)')+'">'+(dLuc>=0?'▲':'▼')+' '+Math.abs(dLuc).toFixed(1)+'%</span> vs mês anterior'}</div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="widget-hd"><span class="widget-ttl">Receita — últimos 6 meses</span></div>${bars(x=>x.rec,'var(--t1)')}</div>
    <div class="card"><div class="widget-hd"><span class="widget-ttl">Lucro — últimos 6 meses</span></div>${bars(x=>x.rec-x.desp,'var(--t2)')}</div>
  </div>`;
}
</script>
<script>
/* ═══ PROPOSTAS (com calculadora Lozy) ═══ */
function renderPropostas(c){
  if(S.tab.propostas==='nova'&&S.wiz)return renderWizard(c);
  const ps=[...S.propostas].sort((a,b)=>String(b.criada).localeCompare(a.criada));
  c.innerHTML=`
    <div class="page-hd"><div><div class="page-title">Propostas</div></div>
    <div style="display:flex;gap:8px;"><button class="btn-ghost" onclick="startWizard()">+ Nova (rápida)</button><button class="btn" onclick="startPropBlank()">+ Nova proposta guiada</button></div></div>
    ${ps.length?`<div class="toolbar">${colBtn('propostas')}${csvBtn('propostas',ps)}</div><div class="card" style="padding:6px 20px;">${renderDataTable('propostas',applyTableSort('propostas',ps),p=>`${p.versao===2?`<button class="ibtn" title="editar" onclick="editProp('${p.id}')">✎</button>`:''}<button class="ibtn" title="baixar HTML" onclick="downloadProp('${p.id}')">↓</button><button class="ibtn" title="visualizar" onclick="previewProp('${p.id}')">👁</button><button class="ibtn del" onclick="delProp('${p.id}')">✕</button>`)}</div>`
    :`<div class="card"><div class="empty-msg">Nenhuma proposta criada ainda. A proposta guiada puxa direto de um orçamento calculado na Calculadora — ou comece do zero em "Nova proposta guiada".</div></div>`}`;
}
function cycleProp(id){const p=S.propostas.find(x=>x.id===id);const st=['Rascunho','Enviada','Aprovada','Recusada'];p.status=st[(st.indexOf(p.status)+1)%st.length];save();render();}
function delProp(id){softDel('propostas',id);}

function startWizard(){
  S.wiz={step:0,empresa:'',cliente:'',projeto:'',formato:'Projeto Personalizado',conceito:'',entregas:[],desconto:0,desloc:0,modo:'cliente',validade:(()=>{const d=new Date();d.setDate(d.getDate()+30);return dstr(d);})()};
  S.tab.propostas='nova';render();
}
const WSTEPS=['Geral','Conceito','Escopo','Investimento','Resultado'];
function wStep(n){S.wiz.step=n;render();}
function renderWizard(c){
  const w=S.wiz;
  const inv=calcInvest(w);
  let body='';
  if(w.step===0)body=`
    <div class="field"><label>Cliente (pessoa)</label><input id="w1" value="${esc(w.cliente)}" placeholder="Nome da pessoa" oninput="S.wiz.cliente=this.value"></div>
    <div class="field"><label>Empresa ou marca</label><input id="w2" value="${esc(w.empresa)}" placeholder="Nome da empresa" oninput="S.wiz.empresa=this.value"></div>
    <div class="field"><label>Nome do projeto</label><input id="w3" value="${esc(w.projeto)}" placeholder="Ex: Conteúdo mensal — Redes sociais" oninput="S.wiz.projeto=this.value"></div>
    <div class="field"><label>Formato</label><select id="w4" onchange="S.wiz.formato=this.value">${['Projeto Personalizado','Conteúdo Mensal','Vídeo Institucional','Evento','Captação','Edição','Fotografia'].map(f=>`<option ${w.formato===f?'selected':''}>${f}</option>`).join('')}</select></div>`;
  else if(w.step===1)body=`
    <div class="field"><label>Frase de abertura</label><input id="w5" value="${esc(w.conceito.split('\n')[0]||'')}" placeholder="A ideia principal da proposta..." oninput="S.wiz.conceito=this.value+'\\n'+(S.wiz.conceito.split('\\n').slice(1).join('\\n'))"></div>
    <div class="field"><label>Contexto do projeto</label><textarea id="w6" rows="5" placeholder="O momento do cliente, o desafio e a proposta criativa..." oninput="S.wiz.conceito=(S.wiz.conceito.split('\\n')[0]||'')+'\\n'+this.value">${esc(w.conceito.split('\n').slice(1).join('\n'))}</textarea></div>`;
  else if(w.step===2)body=`
    <div style="font-size:11.5px;color:var(--t3);margin-bottom:10px;">Adicione entregas pela tabela Lozy (valores oficiais da calculadora) ou crie itens personalizados.</div>
    <div class="preset-pills">${PRESETS.map((p,i)=>`<button class="ppill" onclick="addPreset(${i})">${p.n} · ${fmtBRL(p.v)}</button>`).join('')}</div>
    ${w.entregas.map((e,i)=>`<div class="entrega-row">
      <input class="task-input" value="${esc(e.nome)}" oninput="S.wiz.entregas[${i}].nome=this.value">
      <input class="task-input" type="number" min="1" value="${e.qtd}" oninput="S.wiz.entregas[${i}].qtd=Number(this.value)||1;refreshInv()">
      <input class="task-input" type="number" step="0.01" value="${e.valor}" oninput="S.wiz.entregas[${i}].valor=Number(this.value)||0;refreshInv()">
      <button class="ibtn del" onclick="S.wiz.entregas.splice(${i},1);render()">✕</button></div>`).join('')}
    <button class="btn-sm" onclick="S.wiz.entregas.push({nome:'',qtd:1,valor:0});render()">+ Entrega personalizada</button>`;
  else if(w.step===3)body=`
    <div class="f2">
      <div class="field"><label>Desconto sobre serviço (%)</label><input type="number" min="0" max="50" value="${w.desconto}" oninput="S.wiz.desconto=Number(this.value)||0;refreshInv()"></div>
      <div class="field"><label>Deslocamento (R$) — fora do desconto</label><input type="number" step="0.01" value="${w.desloc}" oninput="S.wiz.desloc=Number(this.value)||0;refreshInv()"></div>
    </div>
    <div class="f2">
      <div class="field"><label>Como os valores aparecem para o cliente?</label><select onchange="S.wiz.modo=this.value">
        <option value="cliente" ${w.modo==='cliente'?'selected':''}>Somente investimento total</option>
        <option value="detalhado" ${w.modo==='detalhado'?'selected':''}>Detalhar valores por entrega</option></select></div>
      <div class="field"><label>Proposta válida até</label><input type="date" value="${w.validade}" onchange="S.wiz.validade=this.value"></div>
    </div>
    <div class="inv-box" id="inv-box">${invBox(inv,w)}</div>
    <div style="font-size:11px;color:var(--t3);margin-top:8px;">Regras Lozy aplicadas: desconto incide só sobre serviço (nunca sobre deslocamento) · mínimos captação R$650 / edição R$160 · sinal de 40% da captação para reservar a data · validade 30 dias.</div>`;
  else body=`
    <div class="inv-box">${invBox(inv,w)}</div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">
      <button class="btn" onclick="saveProposta()">Salvar proposta</button>
      <button class="btn-ghost" onclick="saveProposta(true)">Salvar + baixar HTML</button>
    </div>
    <div style="font-size:11.5px;color:var(--t3);margin-top:12px;">O HTML gerado é uma página standalone com a identidade Lozy — envie o arquivo direto pro cliente ou hospede no seu domínio.</div>`;

  c.innerHTML=`
    <div class="page-hd"><div><div class="page-title">${w.projeto||'Vamos construir sua proposta'}</div></div>
    <button class="btn-ghost" onclick="S.wiz=null;S.tab.propostas='lista';render()">← Voltar</button></div>
    <div class="wiz-steps">${WSTEPS.map((s,i)=>`<div class="wstep ${i<w.step?'done':i===w.step?'cur':''}" style="cursor:pointer" onclick="wStep(${i})"><span class="n">${i<w.step?'✓':i+1}</span>${s}</div>`).join('')}</div>
    <div class="wiz-body card">${body}</div>
    <div class="wiz-nav">
      <button class="btn-ghost" ${w.step===0?'style="visibility:hidden"':''} onclick="wStep(${w.step-1})">Anterior</button>
      ${w.step<WSTEPS.length-1?`<button class="btn" onclick="wStep(${w.step+1})">Próximo</button>`:''}
    </div>`;
}
function addPreset(i){const p=PRESETS[i];S.wiz.entregas.push({nome:p.n,qtd:1,valor:p.v});render();}
function calcInvest(w){
  const serv=w.entregas.reduce((a,e)=>a+e.qtd*e.valor,0);
  const desc=serv*(w.desconto/100);
  const total=serv-desc+Number(w.desloc||0);
  return{serv,desc,total};
}
function invBox(inv,w){
  return `<div class="inv-line"><span>Serviços (${w.entregas.length} entregas)</span><span>${fmtBRL2(inv.serv)}</span></div>
  ${inv.desc?`<div class="inv-line"><span>Desconto (${w.desconto}%)</span><span>−${fmtBRL2(inv.desc)}</span></div>`:''}
  ${w.desloc?`<div class="inv-line"><span>Deslocamento</span><span>${fmtBRL2(Number(w.desloc))}</span></div>`:''}
  <div class="inv-line total"><span>Investimento total</span><span>${fmtBRL2(inv.total)}</span></div>`;
}
function refreshInv(){const el=document.getElementById('inv-box');if(el)el.innerHTML=invBox(calcInvest(S.wiz),S.wiz);}
function saveProposta(dl){
  const w=S.wiz;const inv=calcInvest(w);
  const p={id:uid('pp'),empresa:w.empresa,cliente:w.cliente,projeto:w.projeto||'Proposta Lozy',formato:w.formato,conceito:w.conceito,entregas:w.entregas,desconto:w.desconto,desloc:w.desloc,modo:w.modo,investimento:inv.total,validade:w.validade,status:'Rascunho',criada:todayStr()};
  S.propostas.push(p);save();
  S.wiz=null;S.tab.propostas='lista';render();
  if(dl)downloadProp(p.id);
}
function propHTML(p){
  const linhas=p.modo==='detalhado'
    ?p.entregas.map(e=>'<tr><td>'+esc(e.nome)+'</td><td class="c">'+e.qtd+'</td><td class="r">'+fmtBRL2(e.qtd*e.valor)+'</td></tr>').join('')
    :p.entregas.map(e=>'<tr><td>'+esc(e.nome)+'</td><td class="c">'+e.qtd+'</td><td class="r">—</td></tr>').join('');
  const conc=p.conceito.split('\n');
  return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proposta — '+esc(p.projeto)+'</title>'+
  '<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#EAE3D6;color:#1A1B1D;line-height:1.6}'+
  '.wrap{max-width:720px;margin:0 auto;padding:60px 24px}'+
  '.mark{width:44px;height:44px;border-radius:12px;border:1.5px solid #1A1B1D;color:#1A1B1D;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;margin-bottom:36px}'+
  'h1{font-size:30px;font-weight:650;letter-spacing:-.03em;margin-bottom:6px}'+
  '.sub{color:#847d6d;font-size:14px;margin-bottom:44px}'+
  'h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#847d6d;margin:40px 0 14px;font-weight:600}'+
  '.lead{font-size:19px;font-weight:550;letter-spacing:-.01em;margin-bottom:10px}'+
  'p{color:#4a463f;font-size:14.5px}'+
  'table{width:100%;border-collapse:collapse;margin-top:6px}'+
  'td,th{padding:12px 0;border-bottom:1px solid #d9d0bc;font-size:14px;text-align:left}'+
  'td.c{text-align:center;color:#847d6d}td.r{text-align:right}'+
  '.inv{background:#F2EDE1;border:1px solid #d9d0bc;border-radius:16px;padding:24px;margin-top:14px}'+
  '.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:650;letter-spacing:-.02em;padding-top:14px;border-top:1px solid #d9d0bc;margin-top:10px}'+
  '.cond{font-size:12.5px;color:#847d6d;line-height:1.8}'+
  '.foot{margin-top:56px;padding-top:20px;border-top:1px solid #d9d0bc;color:#847d6d;font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}'+
  'details{border-bottom:1px solid #d9d0bc}summary{padding:12px 0;cursor:pointer;font-size:14px;font-weight:500;list-style:none}summary::after{content:"+";float:right;color:#847d6d}details[open] summary::after{content:"−"}details p{padding:0 0 14px;font-size:13px}'+
  '@media print{body{background:#fff;color:#111}.inv{background:#f5f5f5;border-color:#ddd}td,th{border-color:#ddd}p{color:#333}.sub,.cond{color:#666}}</style></head><body><div class="wrap">'+
  '<div class="mark">L</div>'+
  '<h1>'+esc(p.projeto)+'</h1>'+
  '<div class="sub">Proposta para '+esc(p.empresa||p.cliente)+' · '+p.formato+' · válida até '+new Date(p.validade+'T00:00:00').toLocaleDateString('pt-BR')+'</div>'+
  (conc[0]?'<h2>Conceito</h2><div class="lead">'+esc(conc[0])+'</div>'+(conc.slice(1).join(' ').trim()?'<p>'+esc(conc.slice(1).join(' '))+'</p>':''):'')+
  '<h2>Escopo e entregas</h2><table><thead><tr><th>Entrega</th><th style="text-align:center">Qtd</th><th style="text-align:right">Valor</th></tr></thead><tbody>'+linhas+'</tbody></table>'+
  '<h2>Investimento</h2><div class="inv">'+
  (p.modo==='detalhado'&&p.desconto?'<div style="display:flex;justify-content:space-between;font-size:14px;color:#a3a3a3;padding:3px 0"><span>Desconto aplicado</span><span>'+p.desconto+'%</span></div>':'')+
  (p.desloc?'<div style="display:flex;justify-content:space-between;font-size:14px;color:#a3a3a3;padding:3px 0"><span>Deslocamento</span><span>'+fmtBRL2(p.desloc)+'</span></div>':'')+
  '<div class="tot"><span>Investimento total</span><span>'+fmtBRL2(p.investimento)+'</span></div></div>'+
  '<h2>Condições</h2><div class="cond">Sinal de 40% da captação para reserva da data — reagendável sem custo até 48h antes.<br>Edição paga na entrega · 2 revisões inclusas por vídeo.<br>Impostos já considerados — os valores desta proposta são finais.<br>Proposta válida por 30 dias a partir do envio.</div>'+
  '<h2>Dúvidas frequentes</h2>'+
  '<details><summary>O que acontece se eu precisar remarcar a diária?</summary><p>Reagendamento sem custo até 48h antes da data. Após esse prazo, o sinal é retido e uma nova reserva é necessária.</p></details>'+
  '<details><summary>Posso pedir mais revisões?</summary><p>Cada vídeo inclui 2 revisões. Revisões extras: R$80 cada.</p></details>'+
  '<details><summary>E se eu quiser o vídeo em outro formato?</summary><p>Versões adicionais em outros formatos (feed, stories, YouTube): R$80 por versão.</p></details>'+
  '<div class="foot"><span>Lozy Creative — lozycreative.com</span><span>São Paulo · '+new Date(p.criada+'T00:00:00').toLocaleDateString('pt-BR')+'</span></div>'+
  '</div></body></html>';
}
function downloadProp(id){
  const p=S.propostas.find(x=>x.id===id);
  const blob=new Blob([p.versao===2?propostaHTML2(p):propHTML(p)],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='proposta-'+(p.empresa||p.cliente||'lozy').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.html';a.click();
}
function previewProp(id){
  const p=S.propostas.find(x=>x.id===id);
  document.getElementById('modal-title').textContent='Preview — '+(p.projeto||p.titulo);
  document.getElementById('modal-body').innerHTML='<iframe style="width:100%;height:60vh;border:1px solid var(--b2);border-radius:10px;background:#EAE3D6" sandbox="allow-same-origin"></iframe>';
  document.getElementById('modal').classList.add('wide');
  document.getElementById('modal-actions').innerHTML='<button class="btn-ghost" onclick="closeModal()">Fechar</button><button class="btn" onclick="downloadProp(\''+id+'\')">↓ Baixar HTML</button>';
  document.getElementById('overlay').classList.add('show');
  setTimeout(()=>{document.querySelector('#modal-body iframe').srcdoc=(p.versao===2?propostaHTML2(p):propHTML(p));},50);
}

/* ═══ CALCULADORA — MÓDULO (Nova / Histórico / Ajustes) ═══ */
function renderCalculadora(c){
  if(S.propWiz)return renderPropWizard(c);
  c.innerHTML=`
    <div class="page-hd"><div><div class="page-title">Calculadora</div></div></div>
    ${tabsHtml('calc',[{id:'nova',l:'Novo orçamento'},{id:'historico',l:'Histórico'},{id:'ajustes',l:'Ajustes'}])}
    <div id="calc-body"></div>`;
  const b=document.getElementById('calc-body');
  const t=S.tab.calc;
  if(t==='historico')calcHistorico(b);
  else if(t==='ajustes')calcAjustes(b);
  else calcNova(b);
}
function ensureCalc(){
  if(!S.calc)S.calc={
    cliente:'',empresa:'',escopo:'completo',modo:'interno',
    capt:{tabelaId:'simples',horas:4,diarias:1,complexaExtra:0,videoMaisFotos:false,fotosQtd:0,deslocKm:0,deslocHoras:0},
    edicaoItens:[{tipo:'simples',qtd:1,duracaoSeg:60,prazoDesejadoDias:null,sameDay:false,versoesExtra:0,revisoesExtra:0}],
    descontoPct:0,deslocExtra:0
  };
  return S.calc;
}
function refreshCalc(){const el=document.getElementById('calc-out');if(el)el.innerHTML=calcOut();}
function calcOut(){const w=ensureCalc();return calcBreakdownHtml(calcOrcamento(S.pricing,w),w);}
function calcBreakdownHtml(r,w){
  if(r.edicao&&r.edicao.manual&&w.modo==='cliente')
    return `<div class="inv-line total"><span>Investimento</span><span style="color:var(--amber);font-size:14px">Orçar manualmente — duração acima de 5min</span></div>`;
  if(w.modo==='cliente')
    return `<div class="inv-line total"><span>Investimento${r.capt&&r.capt.aPartir?' (a partir de)':''}</span><span>${fmtBRL2(r.total)}</span></div>`;
  let h='';
  if(r.capt){
    const cp=r.capt;
    h+=`<div class="inv-line" style="font-weight:600;padding-top:2px;">Captação${cp.aPartir?' (a partir de)':''}</div>
    <div class="inv-line"><span>${fmtBRL2(cp.unit)} × ${cp.diarias} diária${cp.diarias>1?'s':''}</span><span>${fmtBRL2(cp.servicoBase)}</span></div>
    ${cp.descMulti?`<div class="inv-line"><span>Desconto múltiplas diárias</span><span>−${fmtBRL2(cp.descMulti)}</span></div>`:''}
    ${cp.acrescVideoFotos?`<div class="inv-line"><span>Vídeo + fotos (+${S.pricing.capt.videoMaisFotosPct}%)</span><span>+${fmtBRL2(cp.acrescVideoFotos)}</span></div>`:''}
    ${cp.fotosCusto?`<div class="inv-line"><span>Tratamento de fotos</span><span>${fmtBRL2(cp.fotosCusto)}</span></div>`:''}
    ${cp.desloc?`<div class="inv-line"><span>Deslocamento (captação)</span><span>${fmtBRL2(cp.desloc)}</span></div>`:''}`;
  }
  if(r.edicao){
    h+=`<div class="inv-line" style="font-weight:600;padding-top:10px;">Edição</div>`;
    if(r.edicao.manual)h+=`<div class="inv-line" style="color:var(--amber)">Um ou mais vídeos passam de 5min — orçar essa parte manualmente.</div>`;
    else r.edicao.linhas.forEach((l,i)=>{
      h+=`<div class="inv-line"><span>Vídeo ${i+1} — ${fmtBRL2(l.unit)} × ${l.qtd}${l.isPacote?' · pacote':''}${l.volPct?' · −'+l.volPct+'% volume':''}${l.durMult>1?' · ×'+l.durMult+' duração':''}${l.urgTipo==='same-day'?' · same day':l.urgTipo==='urgencia'?' · urgência':''}</span><span>${fmtBRL2(l.subtotal)}</span></div>`;
    });
  }
  h+=`<div class="inv-line" style="font-weight:600;padding-top:10px;">Resumo</div>
  <div class="inv-line"><span>Serviço total</span><span>${fmtBRL2(r.servicoTotal)}</span></div>
  ${r.desconto?`<div class="inv-line"><span>Desconto adicional (${w.descontoPct}%)</span><span>−${fmtBRL2(r.desconto)}</span></div>`:''}
  ${r.deslocTotal?`<div class="inv-line"><span>Deslocamento total</span><span>${fmtBRL2(r.deslocTotal)}</span></div>`:''}
  <div class="inv-line total"><span>Investimento total</span><span>${fmtBRL2(r.total)}</span></div>`;
  return h;
}
function calcNova(b){
  const w=ensureCalc();
  const captBlock=w.escopo!=='edicao'?`
    <div class="card" style="margin-bottom:12px;">
      <div class="widget-hd"><span class="widget-ttl">Captação</span></div>
      <div class="f2">

function ensureLeadFromOrc(o){
  const chave=(o.empresa||o.cliente||'').trim().toLowerCase();
  if(!chave)return false;
  const existe=S.leads.some(l=>(l.empresa||'').trim().toLowerCase()===chave||(!(l.empresa||'').trim()&&(l.contato||'').trim().toLowerCase()===chave));
  if(existe)return false;
  S.leads.push({id:uid('l'),stage:'Novo Lead',empresa:o.empresa||o.cliente,contato:o.cliente||'',valor:o.total,origem:'Calculadora',temp:'morno',segmento:'',cidade:'',proxAcao:'Entrar em contato sobre o orçamento calculado',proxData:null});
  return true;
}
function saveOrcamento(){
  const w=ensureCalc();
  const r=calcOrcamento(S.pricing,w);
  if(r.edicao&&r.edicao.manual)return toast('Um dos vídeos passa de 5min — ajuste a duração ou orce essa parte manualmente antes de salvar.');
  const o={id:uid('orc'),cliente:w.cliente.trim(),empresa:w.empresa.trim(),escopo:w.escopo,modo:w.modo,input:JSON.parse(JSON.stringify(w)),total:r.total,desconto:r.desconto,status:'Aberto',criado:todayStr()};
  S.orcamentos.unshift(o);
  const novoLead=ensureLeadFromOrc(o);
  save();
  S.calc=null;
  S.tab.calc='historico';render();
  toast('Orçamento salvo'+(o.cliente?' para '+o.cliente:'')+'.'+(novoLead?' Criado também em Comercial.':''));
}
function orcStatusCycle(id){const o=S.orcamentos.find(x=>x.id===id);if(!o)return;const st=['Aberto','Ganho','Perdido'];o.status=st[(st.indexOf(o.status)+1)%st.length];save();render();}
function delOrc(id){
  const idx=S.orcamentos.findIndex(x=>x.id===id);if(idx<0)return;
  pushUndo('excluir orçamento',['orcamentos']);
  S.orcamentos.splice(idx,1);save();render();
  toast('Orçamento excluído.','Desfazer','doUndo()');
}
function orcamentosCsv(){
  const rows=[['Cliente','Empresa','Escopo','Total','Desconto','Status','Criado']];
  S.orcamentos.forEach(o=>rows.push([o.cliente,o.empresa,o.escopo,o.total.toFixed(2),o.desconto.toFixed(2),o.status,o.criado]));
  const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='orcamentos-lozy.csv';a.click();
}
function calcHistorico(b){
  const os=[...S.orcamentos].sort((a,b2)=>String(b2.criado).localeCompare(a.criado));
  const ganhos=os.filter(o=>o.status==='Ganho'),perdidos=os.filter(o=>o.status==='Perdido');
  const conv=(ganhos.length+perdidos.length)?ganhos.length/(ganhos.length+perdidos.length)*100:0;
  const ticket=ganhos.length?sum(ganhos,o=>o.total)/ganhos.length:0;
  const descMedio=os.length?os.reduce((a,o)=>a+(o.desconto&&o.total?o.desconto/(o.desconto+o.total)*100:0),0)/os.length:0;
  b.innerHTML=`
    <div class="g4" style="margin-bottom:14px;">
      <div class="card"><div class="clabel">Orçamentos</div><div class="metric">${os.length}</div></div>
      <div class="card"><div class="clabel">Ticket médio (ganhos)</div><div class="metric">${fmtBRL(ticket)}</div></div>
      <div class="card"><div class="clabel">Taxa de conversão</div><div class="metric">${conv.toFixed(0)}%</div><div class="metric-s">${ganhos.length} ganhos / ${perdidos.length} perdidos</div></div>
      <div class="card"><div class="clabel">Desconto médio</div><div class="metric">${descMedio.toFixed(1)}%</div></div>
    </div>
    ${os.length?`<div class="toolbar"><button class="btn-ghost" onclick="orcamentosCsv()">↓ Exportar CSV</button></div>
    <div class="card" style="padding:6px 20px;">${os.map(o=>`
      <div class="row-item"><div style="min-width:0;flex:1;">
        <div class="ri-name">${esc(o.cliente||'Sem cliente')}${o.empresa?' · '+esc(o.empresa):''}</div>
        <div class="ri-sub">${o.escopo==='completo'?'Completo':o.escopo==='captacao'?'Só captação':'Só edição'} · ${fmtD(o.criado)} · ${fmtBRL2(o.total)}</div>

      <button style="border:none;background:none;cursor:pointer;display:flex;align-items:center;gap:6px;" onclick="orcStatusCycle('${o.id}')"><span class="sdot ${o.status==='Ganho'?'s-green':o.status==='Perdido'?'s-red':'s-amber'}"></span><span style="font-size:12px;color:var(--t2)">${o.status}</span></button>
      <div style="display:flex;gap:4px;margin-left:8px;">
        <button class="ibtn" title="Gerar proposta" onclick="startPropFromOrc('${o.id}')">📄</button>
        <button class="ibtn del" onclick="delOrc('${o.id}')">✕</button>
      </div></div>`).join('')}</div>`
    :'<div class="card"><div class="empty-msg">Nenhum orçamento salvo ainda. Calcule um em "Novo orçamento" e clique em Salvar.</div></div>'}`;

function getPricing(path){return path.split('.').reduce((o,k)=>o&&o[k],S.pricing);}
function setPricing(path,val){

}

function startPropFromOrc(id){
  const o=S.orcamentos.find(x=>x.id===id);if(!o)return;
  const r=calcOrcamento(S.pricing,o.input);
  if(r.edicao&&r.edicao.manual)return toast('Esse orçamento tem um vídeo acima de 5min marcado pra orçar manualmente — ajuste antes de gerar a proposta.');
  const itens=[];
  if(r.capt){
    const tabNome=o.input.capt.tabelaId==='complexa'?'Captação complexa':((S.pricing.capt.tabs.find(t=>t.id===o.input.capt.tabelaId)||{}).nome||'Captação');
    itens.push({descricao:'Captação — '+tabNome+' ('+o.input.capt.diarias+'× '+o.input.capt.horas+'h)',qtd:1,valor:round2(r.capt.total-r.capt.desloc)});
  }
  if(r.edicao&&!r.edicao.manual)r.edicao.linhas.forEach((l,i)=>{
    itens.push({descricao:'Edição — vídeo '+(i+1)+(l.ref.tipo==='aftermovie'?' (aftermovie)':l.isPacote?' (pacote)':''),qtd:l.qtd,valor:round2(l.qtd?l.subtotal/l.qtd:0)});
  });
  S.propWiz={
    step:0,orcId:id,numero:nextPropNumero(),
    cliente:o.cliente||'',empresa:o.empresa||'',titulo:'',subtitulo:'',contexto:'',recorrente:false,
    itens,desconto:round2(r.desconto),deslocamento:round2(r.deslocTotal),
    cronograma:[
      {etapa:'Alinhamento e aprovação da proposta',prazo:'Semana 1'},
      {etapa:'Captação',prazo:'Semana 2'},
      {etapa:'Edição e primeira entrega',prazo:'Semana 3'},
      {etapa:'Ajustes finais',prazo:'Semana 4'}
    ],
    condicoes:{sinalPct:S.pricing.geral.sinalPct,quandoQuita:'Na entrega final',revisoesInclusas:S.pricing.edicao.revisoesInclusas,validadeDias:S.pricing.geral.validadeDias,obs:'Valores já consideram os impostos — o total desta proposta é final.'},
    notas:[
      {titulo:'Revisões inclusas',texto:'Cada vídeo inclui '+S.pricing.edicao.revisoesInclusas+' rodadas de ajuste, dentro do escopo aprovado.'},
      {titulo:'Reagendamento',texto:'Reagendável sem custo até '+S.pricing.geral.reagendLimiteH+'h antes da data marcada — após esse prazo, o sinal é retido.'}
    ],
    accent:'wine',textos:{...PROP_TEXTOS_PADRAO},secoes:{...PROP_PRESETS.completa},preset:'completa',perfilId:null,totalManual:null,editId:null
  };
  goTo('calculadora');
}
function startPropBlank(){
  S.propWiz={step:0,orcId:null,numero:nextPropNumero(),cliente:'',empresa:'',titulo:'',subtitulo:'',contexto:'',recorrente:false,
    itens:[{descricao:'',qtd:1,valor:0}],desconto:0,deslocamento:0,
    cronograma:[{etapa:'Alinhamento e aprovação da proposta',prazo:'Semana 1'}],
    condicoes:{sinalPct:S.pricing.geral.sinalPct,quandoQuita:'Na entrega final',revisoesInclusas:S.pricing.edicao.revisoesInclusas,validadeDias:S.pricing.geral.validadeDias,obs:'Valores já consideram os impostos — o total desta proposta é final.'},
    notas:[],accent:'wine',textos:{...PROP_TEXTOS_PADRAO},secoes:{...PROP_PRESETS.completa},preset:'completa',perfilId:null,totalManual:null,editId:null};
  S.active='calculadora';goTo('calculadora');
}
const PROPWSTEPS=['Cliente','Contexto','Investimento','Cronograma & condições','Seções e textos','Notas & estilo','Gerar'];
function propWStep(n){S.propWiz.step=n;render();}
function applyPerfil(id){
  if(!id){S.propWiz.perfilId=null;return;}
  const pf=S.perfis.find(x=>x.id===id);if(!pf)return;
  S.propWiz.textos={...PROP_TEXTOS_PADRAO,...pf.textos};
  if(pf.secoes){S.propWiz.secoes=propSecoes(pf.secoes);S.propWiz.preset=null;}
  S.propWiz.perfilId=id;render();
}
function savePerfilFromWiz(){
  const nome=prompt('Nome do perfil (ex: Corporativo, Criador/Influencer, Saúde):','');
  if(!nome||!nome.trim())return;
  S.perfis.push({id:uid('pf'),nome:nome.trim(),textos:{...S.propWiz.textos},secoes:{...S.propWiz.secoes}});
  save();render();toast('Perfil "'+nome.trim()+'" salvo.');
}
/* Presets só pré-marcam os checkboxes da etapa "Seções e textos" — depois disso
   cada seção é ajustável individualmente. */
function applyPropPreset(k){
  const p=PROP_PRESETS[k];if(!p)return;
  S.propWiz.secoes={...p};S.propWiz.preset=k;S.propWiz.perfilId=null;
  if(k==='essencial')S.propWiz.recorrente=false;
  render();
}
function togglePropSec(k,v){
  S.propWiz.secoes[k]=v;S.propWiz.preset=null;
  if(k==='mensal')S.propWiz.recorrente=v;
  render();
}
function delPerfil(id){S.perfis=S.perfis.filter(x=>x.id!==id);save();render();}
function propWizTotalCalc(w){
  const serv=w.itens.reduce((a,i)=>a+Number(i.qtd||0)*Number(i.valor||0),0);
  return serv-Number(w.desconto||0)+Number(w.deslocamento||0);
}
function propWizTotal(w){
  if(w.totalManual!=null)return Number(w.totalManual)||0;
  return propWizTotalCalc(w);
}
function refreshPropTotal(){const el=document.getElementById('prop-total');if(el)el.innerHTML='<div class="inv-line total"><span>Investimento total</span><span>'+fmtBRL2(propWizTotal(S.propWiz))+'</span></div>';}

function editProp(id){
  const p=S.propostas.find(x=>x.id===id);
  if(!p||p.versao!==2)return toast('Só é possível editar propostas geradas pelo assistente guiado (v2).');
  S.propWiz={
    step:0,editId:p.id,orcId:p.orcId,numero:p.numero,
    cliente:p.cliente||'',empresa:p.empresa||'',titulo:p.titulo||'',subtitulo:p.subtitulo||'',contexto:p.contexto||'',recorrente:!!p.recorrente,
    itens:JSON.parse(JSON.stringify(p.itens||[])),desconto:p.desconto||0,deslocamento:p.deslocamento||0,
    totalManual:p.totalManual!=null?p.totalManual:null,
    cronograma:JSON.parse(JSON.stringify(p.cronograma||[])),
    condicoes:JSON.parse(JSON.stringify(p.condicoes||{sinalPct:S.pricing.geral.sinalPct,quandoQuita:'Na entrega final',revisoesInclusas:S.pricing.edicao.revisoesInclusas,validadeDias:S.pricing.geral.validadeDias,obs:''})),
    notas:JSON.parse(JSON.stringify(p.notas||[])),
    accent:p.accent||'wine',textos:{...PROP_TEXTOS_PADRAO,...(p.textos||{})},
    secoes:p.secoes?propSecoes(p.secoes):propSecoes({mensal:!!p.recorrente}),preset:null,perfilId:null
  };
  S.active='calculadora';goTo('calculadora');
}
function savePropWiz(dl){
  const w=S.propWiz;
  const base={versao:2,numero:w.numero,orcId:w.orcId,cliente:w.cliente.trim(),empresa:w.empresa.trim(),
    titulo:w.titulo||'Proposta Lozy',subtitulo:w.subtitulo,contexto:w.contexto,recorrente:w.recorrente,
    itens:w.itens,desconto:w.desconto,deslocamento:w.deslocamento,totalManual:w.totalManual,total:propWizTotal(w),
    cronograma:w.cronograma,condicoes:w.condicoes,notas:w.notas,accent:w.accent,textos:w.textos||PROP_TEXTOS_PADRAO,secoes:propSecoes(w.secoes),
    validade:(()=>{const d=new Date();d.setDate(d.getDate()+Number(w.condicoes.validadeDias||30));return dstr(d);})()};
  let p=w.editId?S.propostas.find(x=>x.id===w.editId):null;
  if(p)Object.assign(p,base);
  else{p={id:uid('pp'),...base,status:'Rascunho',criada:todayStr()};S.propostas.push(p);}
  save();
  if(w.orcId){const o=S.orcamentos.find(x=>x.id===w.orcId);if(o){o.propostaId=p.id;save();}}
  S.propWiz=null;S.active='propostas';S.tab.propostas='lista';
  buildNav();render();
  if(dl)downloadProp(p.id);
  toast('Proposta '+(w.editId?'atualizada':'salva')+(p.cliente?' para '+p.cliente:'')+'.');
}
function propIcon(name){
  const M={
    partida:'<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2"/>',
    escopo:'<path d="M7 3.5h7.5L19 8v12.5H7z"/><path d="M14.5 3.5V8H19M10 13h6M10 16.5h6"/>',
    mensal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    crono:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 3"/>',
    cond:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>',
    notas:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>'
  };
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(M[name]||'')+'</svg>';
}
function propSecHd(num,icon,titulo,desc){
  return '<div class="sec-hd"><div class="sec-badge"><span class="sec-icon">'+propIcon(icon)+'</span><span class="sec-num">'+num+'</span></div><div class="sec-title-group"><h2>'+esc(titulo)+'</h2><p class="sec-desc">'+esc(desc)+'</p></div></div>';
}
function propostaHTML2(p){
  const tx={...PROP_TEXTOS_PADRAO,...(p.textos||{})};
  const accentHex=p.accent==='terracotta'?'#8C4530':'#4E1A1D';
  const tWords=(p.titulo||'').trim().split(/\s+/);
  const tLast=tWords.pop()||'';
  const tituloHtml=(tWords.length?esc(tWords.join(' '))+' ':'')+'<span class="accw">'+esc(tLast)+'</span>';
  /* Propostas salvas antes das seções liga/desliga caem no padrão "tudo ligado". */

  /* Numeração das seções é derivada das que sobraram ligadas — com seções

  '.nota-titulo{font-weight:600;font-size:13px;margin-bottom:6px}.nota-texto{font-size:12px;color:var(--ink3);line-height:1.7;font-weight:400}'+
  '.foot{position:relative;z-index:1;margin-top:64px;padding-top:22px;border-top:1px solid var(--line);color:var(--ink3);font-size:11px;letter-spacing:.02em;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}'+
  '.foot span{transition:color .2s ease}.foot span:hover{color:var(--accent)}'+
  '.tag{transition:color .2s ease}.tag:hover{color:var(--ink)}'+
  /* A animação de entrada é progressive enhancement e NÃO pode ser o que decide

     não roda (preview de e-mail, iframe em segundo plano, conversor de PDF,

  '.reveal{transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}'+

  '.js-anim .reveal.visible{opacity:1;transform:translateY(0)}'+
  '.js-anim .item,.js-anim .crono-item,.js-anim .nota-card{opacity:0;transform:translateY(10px)}'+
  '.js-anim .sec.visible .item,.js-anim .sec.visible .crono-item,.js-anim .sec.visible .nota-card{opacity:1;transform:translateY(0)}'+

    '.sigil{opacity:.06}'+

  '}'+

     só quando dá pra garantir que o IntersectionObserver vai rodar. Numa aba
     oculta os timers são estrangulados e o observer não dispara — daí não
     animamos nada, em vez de arriscar entregar a proposta em branco. */
  '</div><script>(function(){'+
  'if(!("IntersectionObserver" in window)||document.visibilityState!=="visible")return;'+

  'els.forEach(function(e){io.observe(e);});'+
  'setTimeout(show,1400);})();<'+'/script>'+
  '</body></html>';
}

/* ═══ QUICK CREATE + MODAL INFRA ═══ */
function quickCreate(){
  const map={comercial:()=>openLead(),demandas:()=>openDem(),tarefas:()=>openTask(),projetos:()=>openProj(),pint:()=>openPint(),agenda:()=>openEvento(),propostas:()=>startWizard(),financeiro:()=>openLanc('despesa')};
  if(map[S.active])return map[S.active]();
  openModal('Criar novo',`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
    ${[['Lead','openLead()'],['Demanda','openDem()'],['Tarefa','openTask()'],['Projeto','openProj()'],['Projeto Interno','openPint()'],['Receita',"openLanc('receita')"],['Despesa',"openLanc('despesa')"],['Evento','openEvento()'],['Proposta','startWizard();closeModal()']].map(([l,fn])=>`<button class="btn-sm" style="justify-content:center;padding:12px" onclick="closeModal();${fn}">${l}</button>`).join('')}
  </div>`,null,true);
}
function openModal(title,body,onSubmit,hideSubmit){
  document.getElementById('modal').classList.remove('wide');
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-actions').innerHTML=hideSubmit
    ?'<button class="btn-ghost" onclick="closeModal()">Cancelar</button>'
    :'<button class="btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn" id="modal-submit">Salvar</button>';
  if(!hideSubmit)document.getElementById('modal-submit').onclick=onSubmit;
  document.getElementById('overlay').classList.add('show');
  setTimeout(()=>document.getElementById('m1')?.focus(),60);
}
function closeModal(){document.getElementById('overlay').classList.remove('show');}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});

/* ═══ CARD DRAWER — abrir qualquer item numa visão isolada (Notion-like) ═══
   Funciona para demandas, tarefas e lançamentos financeiros. Cada um ganha
   observações, checklist e (demandas/tarefas) histórico de tempo por status.
   Não substitui os modais de edição rápida (✎) — é uma visão adicional. */
function cardEntity(){
  const cv=S.cardView;if(!cv)return null;
  return (S[cv.kind]||[]).find(x=>x.id===cv.id)||null;
}
function openCard(kind,id){
  S.cardView={kind,id,tab:'det'};
  document.getElementById('modal').classList.add('wide');
  document.getElementById('overlay').classList.add('show');
  renderCard();
}
function closeCard(){S.cardView=null;closeModal();}
function cardTab(t){S.cardView.tab=t;renderCard();}
function renderCard(){
  const cv=S.cardView;const it=cardEntity();
  if(!cv||!it){closeCard();return;}
  const titulo=it.titulo||it.desc||'Item';
  const sub=cv.kind==='demandas'?((it.cliente||'Sem cliente')+' · '+it.uid+' · '+it.status)
    :cv.kind==='tasks'?((it.area||'Tarefa')+' · '+it.status)
    :cv.kind==='pint'?((it.area||'Sem área')+' · '+it.status)
    :((it.tipo==='receita'?'Receita':'Despesa')+' · '+fmtBRL2(it.valor)+(it.cliente?' · '+esc(it.cliente):''));
  const tabs=[['det','Detalhes']];
  if(cv.kind==='pint')tabs.push(['tarefas','Tarefas']);
  tabs.push(['obs','Observações'],['chk','Checklist']);
  if(cv.kind==='demandas'||cv.kind==='tasks'||cv.kind==='pint')tabs.push(['hist','Tempo por status']);
  document.getElementById('modal-title').textContent=titulo;
  document.getElementById('modal-body').innerHTML=`
    <div style="font-size:12px;color:var(--t3);margin-bottom:16px;">${esc(sub)}</div>
    <div class="tabs" style="margin-bottom:16px;">${tabs.map(([id,l])=>`<button class="tab ${cv.tab===id?'active':''}" onclick="cardTab('${id}')">${l}</button>`).join('')}</div>
    <div id="card-tab-body">${cardTabBody()}</div>`;
  document.getElementById('modal-actions').innerHTML=`<button class="btn-ghost" onclick="closeCard()">Fechar</button><button class="btn-ghost" style="color:var(--red)" onclick="cardDelete()">✕ Excluir</button>`;
}
function cardSet(field,val){const it=cardEntity();if(!it)return;it[field]=val;save();}
function cardSetRefresh(field,val){cardSet(field,val);renderCard();}
function cardSetStatus(novo){
  const it=cardEntity();const cv=S.cardView;if(!it||!cv)return;
  if(cv.kind==='demandas')demTransicao(it,novo);
  else if(cv.kind==='tasks')taskTransicao(it,novo);
  else if(cv.kind==='pint')pintTransicao(it,novo);
  save();renderCard();
}
function cardDelete(){
  const cv=S.cardView;if(!cv)return;
  if(!confirm('Excluir este item? Ele vai para a lixeira por 30 dias.'))return;
  if(cv.kind==='fin')delLanc(cv.id);else softDel(cv.kind,cv.id);
  closeCard();render();
}
function cardDetalhesHtml(kind,it){
  if(kind==='demandas'){
    const maes=S.demandas.filter(x=>!x.maeId&&x.id!==it.id);
    return `

function cardTabBody(){
  const cv=S.cardView;const it=cardEntity();if(!it)return'';
  if(cv.tab==='det')return cardDetalhesHtml(cv.kind,it);
  if(cv.tab==='tarefas'&&cv.kind==='pint'){
    const tks=S.tasks.filter(t=>t.projIntId===it.id);
    const doneT=tks.filter(t=>t.status==='Concluída').length;
    return `<div style="display:flex;gap:8px;margin-bottom:14px;">
      <input id="pint-task-novo" class="task-input" style="flex:1" placeholder="Nova tarefa..." onkeydown="if(event.key==='Enter'){event.preventDefault();pintAddTask('${it.id}');}">
